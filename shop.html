<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Theme Shop</title>
    <style>
        :root { --primary: #00f3ff; --accent: #ff007f; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        
        header { width: 100%; max-width: 850px; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 25px; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 25px; box-sizing: border-box; }
        .stats { font-size: 1.2rem; font-weight: bold; color: #facc15; }
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; width: 100%; max-width: 850px; }
        .theme-card { background: var(--card); border: 2px solid var(--primary); border-radius: 12px; padding: 20px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .preview-box { height: 60px; border-radius: 8px; margin: 15px 0; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid rgba(255,255,255,0.2); }
        
        .btn { background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div class="stats">🪙 Wallet: <span id="coin-count">0</span></div>
    </header>

    <h2>🎨 Global Theme Shop</h2>
    <p style="color:#94a3b8; margin-bottom: 20px;">Equipped themes automatically customize your entire arcade interface!</p>

    <div class="shop-grid">
        <div class="theme-card">
            <h3>Cyber Neon</h3>
            <div class="preview-box" style="background:#0f172a; color:#00f3ff; border-color:#00f3ff;">Default Style</div>
            <button class="btn" id="btn-neon" onclick="equipTheme('neon')">Equip</button>
        </div>

        <div class="theme-card">
            <h3>Matrix Green</h3>
            <div class="preview-box" style="background:#051a0e; color:#00ff66; border-color:#00ff66;">Cyber Grid</div>
            <button class="btn" id="btn-cyber" onclick="handleTheme('cyber', 100)">Buy (100 Coins)</button>
        </div>

        <div class="theme-card">
            <h3>Sunset Gold</h3>
            <div class="preview-box" style="background:#2a081d; color:#facc15; border-color:#facc15;">Warm Glow</div>
            <button class="btn" id="btn-sunset" onclick="handleTheme('sunset', 250)">Buy (250 Coins)</button>
        </div>

        <div class="theme-card">
            <h3>Purple Haze</h3>
            <div class="preview-box" style="background:#12072b; color:#a855f7; border-color:#a855f7;">Deep Space</div>
            <button class="btn" id="btn-purple" onclick="handleTheme('purple', 500)">Buy (500 Coins)</button>
        </div>
    </div>

    <script>
        let ownedThemes = JSON.parse(localStorage.getItem('arcade_owned_themes')) || ['neon'];
        let activeTheme = localStorage.getItem('arcade_theme') || 'neon';

        function getCoins() { return parseInt(localStorage.getItem('arcade_coins')) || 0; }
        function setCoins(val) { localStorage.setItem('arcade_coins', val); }

        function applyGlobalTheme() {
            const themes = {
                neon: { primary: '#00f3ff', accent: '#ff007f', bg: '#0f172a', card: '#1e293b' },
                cyber: { primary: '#00ff66', accent: '#ff9900', bg: '#051a0e', card: '#0b2e1a' },
                sunset: { primary: '#facc15', accent: '#ff007f', bg: '#2a081d', card: '#421232' },
                purple: { primary: '#a855f7', accent: '#00f3ff', bg: '#12072b', card: '#231047' }
            };
            const active = themes[activeTheme] || themes.neon;
            document.documentElement.style.setProperty('--primary', active.primary);
            document.documentElement.style.setProperty('--accent', active.accent);
            document.documentElement.style.setProperty('--bg', active.bg);
            document.documentElement.style.setProperty('--card', active.card);
        }

        function updateUI() {
            applyGlobalTheme();
            const coins = getCoins();
            document.getElementById('coin-count').innerText = coins.toLocaleString();

            const themeList = ['neon', 'cyber', 'sunset', 'purple'];
            themeList.forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (!btn) return;

                if (activeTheme === t) {
                    btn.innerText = 'Equipped';
                    btn.disabled = true;
                } else if (ownedThemes.includes(t)) {
                    btn.innerText = 'Equip';
                    btn.disabled = false;
                } else {
                    const costs = { cyber: 100, sunset: 250, purple: 500 };
                    btn.innerText = `Buy (${costs[t]} Coins)`;
                    btn.disabled = coins < costs[t];
                }
            });
        }

        function handleTheme(themeName, cost) {
            if (ownedThemes.includes(themeName)) {
                equipTheme(themeName);
            } else if (getCoins() >= cost) {
                setCoins(getCoins() - cost);
                ownedThemes.push(themeName);
                localStorage.setItem('arcade_owned_themes', JSON.stringify(ownedThemes));
                equipTheme(themeName);
            }
        }

        function equipTheme(themeName) {
            activeTheme = themeName;
            localStorage.setItem('arcade_theme', activeTheme);
            updateUI();
        }

        document.addEventListener("DOMContentLoaded", updateUI);
    </script>
</body>
</html>
