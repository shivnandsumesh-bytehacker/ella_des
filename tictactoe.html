<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe - Smart AI Edition</title>
    <script src="arcade.js"></script>
    <style>
        :root {
            --primary: #00f3ff;
            --primary-glow: rgba(0, 243, 255, 0.4);
            --accent: #ff007f;
            --accent-glow: rgba(255, 0, 127, 0.4);
            --gold: #facc15;
            --emerald: #10b981;
            --bg: #030712;
            --card: #0b1329;
            --panel-bg: rgba(11, 19, 41, 0.92);
        }
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        header {
            width: 100%;
            max-width: 680px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            margin-bottom: 12px;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .stats { font-size: 1.05rem; font-weight: bold; color: var(--gold); }
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; }
        a.nav:hover { text-shadow: 0 0 8px var(--primary); }

        #game-container {
            width: 100%;
            max-width: 680px;
            background: var(--card);
            border: 2px solid var(--primary);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Difficulty & Mode Selector */
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
            max-width: 440px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn:hover { border-color: var(--primary); color: #fff; }
        .mode-btn.active {
            border-color: var(--primary);
            color: #000;
            background: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
        }
        .mode-btn.hard.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 440px;
            background: var(--panel-bg);
            border: 1.5px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 16px;
        }
        .score-box { text-align: center; }
        .score-lbl { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
        .score-val { font-size: 1.5rem; font-weight: bold; font-family: monospace; }

        /* Turn Status Banner */
        #status-banner {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 16px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
        }

        /* 3x3 Grid Board */
        .board-wrap {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 20px;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
        }
        .cell {
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            font-weight: 900;
            font-family: 'Segoe UI', sans-serif;
            cursor: pointer;
            transition: all 0.15s ease-out;
        }
        .cell:hover:not(.taken) {
            border-color: var(--primary);
            background: rgba(0, 243, 255, 0.08);
            transform: scale(1.02);
        }
        .cell.taken { cursor: default; }

        .cell.x {
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary-glow);
            animation: popIn 0.2s ease-out;
        }
        .cell.o {
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow);
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            80% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Winning SVG Line Overlay */
        #win-line-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .win-stroke {
            stroke: var(--gold);
            stroke-width: 8px;
            stroke-linecap: round;
            filter: drop-shadow(0 0 10px var(--gold));
            stroke-dasharray: 450;
            stroke-dashoffset: 450;
            animation: drawLine 0.4s ease-out forwards;
        }
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        /* Action Buttons */
        .controls-row {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .action-btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 15px var(--primary);
            transform: translateY(-2px);
        }
        .action-btn.secondary {
            background: #1e293b;
            color: #94a3b8;
            border: 1.5px solid #334155;
        }
        .action-btn.secondary:hover {
            color: #fff;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div>⚡ <strong>CYBER TIC TAC TOE</strong></div>
        <div class="stats">🪙 Gold: <span id="coin-count">0</span></div>
    </header>

    <div id="game-container">
        <!-- Difficulty / Mode Toggles -->
        <div class="mode-selector">
            <button class="mode-btn" id="mode-easy" onclick="setDifficulty('EASY')">🤖 Easy AI</button>
            <button class="mode-btn hard active" id="mode-hard" onclick="setDifficulty('HARD')">💀 Master AI</button>
            <button class="mode-btn" id="mode-pvp" onclick="setDifficulty('PVP')">👥 2 Player</button>
        </div>

        <!-- Scores -->
        <div class="scoreboard">
            <div class="score-box">
                <div class="score-lbl" id="p1-label" style="color:var(--primary);">You (X)</div>
                <div class="score-val" id="score-p1" style="color:var(--primary);">0</div>
            </div>
            <div class="score-box">
                <div class="score-lbl">Ties</div>
                <div class="score-val" id="score-ties" style="color:#94a3b8;">0</div>
            </div>
            <div class="score-box">
                <div class="score-lbl" id="p2-label" style="color:var(--accent);">Master AI (O)</div>
                <div class="score-val" id="score-p2" style="color:var(--accent);">0</div>
            </div>
        </div>

        <!-- Status -->
        <div id="status-banner">Your Turn! Tap a square.</div>

        <!-- 3x3 Grid with SVG Winner Tracer -->
        <div class="board-wrap">
            <div class="board" id="board">
                <div class="cell" onclick="handleCellClick(0)"></div>
                <div class="cell" onclick="handleCellClick(1)"></div>
                <div class="cell" onclick="handleCellClick(2)"></div>
                <div class="cell" onclick="handleCellClick(3)"></div>
                <div class="cell" onclick="handleCellClick(4)"></div>
                <div class="cell" onclick="handleCellClick(5)"></div>
                <div class="cell" onclick="handleCellClick(6)"></div>
                <div class="cell" onclick="handleCellClick(7)"></div>
                <div class="cell" onclick="handleCellClick(8)"></div>
            </div>
            <svg id="win-line-svg"></svg>
        </div>

        <!-- Controls -->
        <div class="controls-row">
            <button class="action-btn" onclick="restartRound()">🔄 Next Round</button>
            <button class="action-btn secondary" onclick="resetScores()">Reset Score</button>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                if (type === 'x') {
                    // Crisp high-tech pop
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'o') {
                    // Deep electronic response
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'win') {
                    // Victory arpeggio
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        setTimeout(() => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.value = freq;
                            gain.gain.setValueAtTime(0.25, ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                            osc.connect(gain); gain.connect(ctx.destination);
                            osc.start(); osc.stop(ctx.currentTime + 0.2);
                        }, i * 70);
                    });
                } else if (type === 'tie') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.25);
                }
            } catch(e){}
        }

        // Game State
        let board = Array(9).fill('');
        let currentPlayer = 'X'; // X is Human (or P1 in PVP), O is AI/P2
        let gameActive = true;
        let difficulty = 'HARD'; // 'EASY', 'HARD', 'PVP'
        let scoreP1 = 0, scoreP2 = 0, scoreTies = 0;
        let gold = 0;

        const WINNING_COMBOS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        function updateWallet() {
            gold = parseInt(localStorage.getItem('arcade_coins')) || 0;
            document.getElementById('coin-count').innerText = gold.toLocaleString();
        }
        function addCoins(amt) {
            gold += amt;
            localStorage.setItem('arcade_coins', gold);
            updateWallet();
        }

        function setDifficulty(mode) {
            difficulty = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            if (mode === 'EASY') document.getElementById('mode-easy').classList.add('active');
            if (mode === 'HARD') document.getElementById('mode-hard').classList.add('active');
            if (mode === 'PVP') document.getElementById('mode-pvp').classList.add('active');

            const p2Label = document.getElementById('p2-label');
            if (mode === 'PVP') p2Label.innerText = "Player 2 (O)";
            else if (mode === 'EASY') p2Label.innerText = "Easy AI (O)";
            else p2Label.innerText = "Master AI (O)";

            resetScores();
        }

        function handleCellClick(index) {
            if (!gameActive || board[index] !== '') return;
            getAudioContext();

            // Player Move
            makeMove(index, currentPlayer);

            const result = checkGameState(board);
            if (result) {
                endRound(result);
                return;
            }

            if (difficulty === 'PVP') {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                document.getElementById('status-banner').innerText = `Player ${currentPlayer === 'X' ? '1 (X)' : '2 (O)'}'s Turn`;
            } else {
                // AI Turn
                currentPlayer = 'O';
                gameActive = false;
                document.getElementById('status-banner').innerText = 'AI is calculating...';

                const delay = difficulty === 'HARD' ? 350 : 250;
                setTimeout(() => {
                    const aiMove = getAIMove();
                    makeMove(aiMove, 'O');

                    const aiResult = checkGameState(board);
                    if (aiResult) {
                        endRound(aiResult);
                    } else {
                        currentPlayer = 'X';
                        gameActive = true;
                        document.getElementById('status-banner').innerText = 'Your Turn! (X)';
                    }
                }, delay);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            const cell = document.getElementsByClassName('cell')[index];
            cell.innerText = player;
            cell.classList.add('taken', player.toLowerCase());
            playSound(player.toLowerCase());
        }

        // AI Engine (Unbeatable Minimax for Hard, Flawed/Random for Easy)
        function getAIMove() {
            if (difficulty === 'EASY') {
                // 1. 30% chance to take a winning move if available
                if (Math.random() < 0.3) {
                    for (let i = 0; i < 9; i++) {
                        if (board[i] === '') {
                            board[i] = 'O';
                            if (checkWin(board, 'O')) { board[i] = ''; return i; }
                            board[i] = '';
                        }
                    }
                }
                // Otherwise choose random available spot
                const emptyCells = board.map((val, idx) => val === '' ? idx : null).filter(v => v !== null);
                return emptyCells[Math.floor(Math.random() * emptyCells.length)];
            }

            // HARD MODE: Unbeatable Minimax Algorithm
            let bestScore = -Infinity;
            let bestMove = null;

            for (let i = 0; i < 9; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            return bestMove;
        }

        function minimax(currBoard, depth, isMaximizing) {
            if (checkWin(currBoard, 'O')) return 10 - depth;
            if (checkWin(currBoard, 'X')) return depth - 10;
            if (currBoard.every(cell => cell !== '')) return 0;

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currBoard[i] === '') {
                        currBoard[i] = 'O';
                        let evaluation = minimax(currBoard, depth + 1, false);
                        currBoard[i] = '';
                        maxEval = Math.max(maxEval, evaluation);
                    }
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (currBoard[i] === '') {
                        currBoard[i] = 'X';
                        let evaluation = minimax(currBoard, depth + 1, true);
                        currBoard[i] = '';
                        minEval = Math.min(minEval, evaluation);
                    }
                }
                return minEval;
            }
        }

        function checkWin(b, player) {
            return WINNING_COMBOS.some(combo => combo.every(idx => b[idx] === player));
        }

        function checkGameState(b) {
            for (let combo of WINNING_COMBOS) {
                const [a, bIdx, c] = combo;
                if (b[a] && b[a] === b[bIdx] && b[a] === b[c]) {
                    return { winner: b[a], combo };
                }
            }
            if (b.every(cell => cell !== '')) {
                return { winner: 'TIE' };
            }
            return null;
        }

        function endRound(result) {
            gameActive = false;
            const status = document.getElementById('status-banner');

            if (result.winner === 'TIE') {
                scoreTies++;
                document.getElementById('score-ties').innerText = scoreTies;
                status.innerText = "It's a Draw! 🤝";
                status.style.color = '#94a3b8';
                playSound('tie');
            } else {
                drawWinningLine(result.combo);
                if (result.winner === 'X') {
                    scoreP1++;
                    document.getElementById('score-p1').innerText = scoreP1;
                    status.innerText = difficulty === 'PVP' ? 'Player 1 Wins! 🎉' : 'Victory! You Won! 🏆';
                    status.style.color = 'var(--emerald)';
                    playSound('win');
                    // Gold Bounty
                    addCoins(difficulty === 'HARD' ? 50 : 20);
                } else {
                    scoreP2++;
                    document.getElementById('score-p2').innerText = scoreP2;
                    status.innerText = difficulty === 'PVP' ? 'Player 2 Wins! 🎉' : (difficulty === 'HARD' ? 'Master AI Won! 💀' : 'AI Won! 🤖');
                    status.style.color = 'var(--accent)';
                    playSound('o');
                }
            }
        }

        function drawWinningLine(combo) {
            const cells = document.getElementsByClassName('cell');
            const c1 = cells[combo[0]].getBoundingClientRect();
            const c3 = cells[combo[2]].getBoundingClientRect();
            const wrap = document.querySelector('.board-wrap').getBoundingClientRect();

            const x1 = c1.left + c1.width / 2 - wrap.left;
            const y1 = c1.top + c1.height / 2 - wrap.top;
            const x2 = c3.left + c3.width / 2 - wrap.left;
            const y2 = c3.top + c3.height / 2 - wrap.top;

            const svg = document.getElementById('win-line-svg');
            svg.innerHTML = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="win-stroke" />`;
        }

        function restartRound() {
            board = Array(9).fill('');
            currentPlayer = 'X';
            gameActive = true;
            document.getElementById('status-banner').innerText = difficulty === 'PVP' ? "Player 1 (X)'s Turn" : 'Your Turn! (X)';
            document.getElementById('status-banner').style.color = 'var(--gold)';
            document.getElementById('win-line-svg').innerHTML = '';

            const cells = document.getElementsByClassName('cell');
            for (let cell of cells) {
                cell.innerText = '';
                cell.className = 'cell';
            }
        }

        function resetScores() {
            scoreP1 = 0; scoreP2 = 0; scoreTies = 0;
            document.getElementById('score-p1').innerText = 0;
            document.getElementById('score-p2').innerText = 0;
            document.getElementById('score-ties').innerText = 0;
            restartRound();
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateWallet();
        });
    </script>
</body>
</html>
