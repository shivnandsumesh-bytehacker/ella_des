<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Pong AI</title>
    <script src="arcade.js"></script>
    <style>
        :root { --primary: #00f3ff; --accent: #ff007f; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        
        header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 20px; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 15px; box-sizing: border-box; }
        .stats { font-size: 1.1rem; font-weight: bold; color: #facc15; }
        .status { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; color: var(--primary); min-height: 28px; }
        
        canvas { background: #000; border: 3px solid var(--primary); border-radius: 12px; box-shadow: 0 0 25px rgba(0, 243, 255, 0.25); max-width: 100%; }
        
        .controls { margin-top: 15px; display: flex; gap: 15px; }
        .btn { background: var(--primary); color: #000; border: none; padding: 10px 20px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div>Score: <span id="p-score" style="color:var(--primary)">0</span> - <span id="ai-score" style="color:var(--accent)">0</span></div>
        <div class="stats">🪙 Wallet: <span id="coin-count">0</span></div>
    </header>

    <div class="status" id="status">First to 5 wins!</div>

    <canvas id="pong" width="600" height="400"></canvas>

    <div class="controls">
        <button class="btn" onclick="resetGame()">Restart Game</button>
    </div>

    <script>
        const canvas = document.getElementById("pong");
        const ctx = canvas.getContext("2d");

        let pScore = 0;
        let aiScore = 0;
        let gameActive = true;
        const targetScore = 5;

        const paddleWidth = 12;
        const paddleHeight = 80;

        const player = { x: 10, y: canvas.height / 2 - 40, speed: 7 };
        const ai = { x: canvas.width - 22, y: canvas.height / 2 - 40, speed: 4.8, targetY: canvas.height / 2 - 40 };
        const ball = { x: canvas.width / 2, y: canvas.height / 2, radius: 7, speed: 5, dx: 5, dy: 3 };

        // Key state tracker for smooth movement
        const keys = { up: false, down: false };

        function updateWallet() {
            const coins = parseInt(localStorage.getItem('arcade_coins')) || 0;
            document.getElementById('coin-count').innerText = coins.toLocaleString();
        }

        function addCoins(amount) {
            let coins = parseInt(localStorage.getItem('arcade_coins')) || 0;
            localStorage.setItem('arcade_coins', coins + amount);
            updateWallet();
        }

        // Universal Control & Anti-Scroll Listener
        window.addEventListener("keydown", function(e) {
            const isUpKey = e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.code === "KeyW";
            const isDownKey = e.key === "ArrowDown" || e.key === "s" || e.key === "S" || e.code === "KeyS";

            if (isUpKey || isDownKey || e.key === " " || e.code === "Space") {
                e.preventDefault(); // Stop page scrolling
            }

            if (isUpKey) keys.up = true;
            if (isDownKey) keys.down = true;
        }, { passive: false });

        window.addEventListener("keyup", function(e) {
            const isUpKey = e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.code === "KeyW";
            const isDownKey = e.key === "ArrowDown" || e.key === "s" || e.key === "S" || e.code === "KeyS";

            if (isUpKey) keys.up = false;
            if (isDownKey) keys.down = false;
        });

        // Touch Control for iPad
        canvas.addEventListener("touchmove", e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            player.y = e.touches[0].clientY - rect.top - paddleHeight / 2;
        }, { passive: false });

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 5;
            ball.dx = -ball.dx;
            ball.dy = (Math.random() - 0.5) * 6;
        }

        function predictTarget() {
            if (ball.dx > 0) {
                let timeToReach = (ai.x - ball.x) / ball.dx;
                let predictedY = ball.y + ball.dy * timeToReach;
                
                while (predictedY < 0 || predictedY > canvas.height) {
                    if (predictedY < 0) predictedY = -predictedY;
                    if (predictedY > canvas.height) predictedY = 2 * canvas.height - predictedY;
                }
                ai.targetY = predictedY - paddleHeight / 2;
            } else {
                ai.targetY = canvas.height / 2 - paddleHeight / 2;
            }
        }

        function update() {
            if (!gameActive) return;

            // Ultra-smooth Player Movement based on active keys
            if (keys.up) player.y -= player.speed;
            if (keys.down) player.y += player.speed;

            // Bounds Clamping
            if (player.y < 0) player.y = 0;
            if (player.y + paddleHeight > canvas.height) player.y = canvas.height - paddleHeight;

            // AI Movement
            predictTarget();
            if (ai.y < ai.targetY) ai.y += Math.min(ai.speed, ai.targetY - ai.y);
            if (ai.y > ai.targetY) ai.y -= Math.min(ai.speed, ai.y - ai.targetY);

            // Ball Movement
            ball.x += ball.dx;
            ball.y += ball.dy;

            // Wall Collisions
            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy = -ball.dy;
            }

            // Paddle Collisions
            let activePaddle = (ball.x < canvas.width / 2) ? player : ai;
            if (checkCollision(ball, activePaddle)) {
                let collidePoint = (ball.y - (activePaddle.y + paddleHeight / 2)) / (paddleHeight / 2);
                let angleRad = (Math.PI / 4) * collidePoint;
                let direction = (ball.x < canvas.width / 2) ? 1 : -1;

                ball.speed += 0.4;
                ball.dx = direction * ball.speed * Math.cos(angleRad);
                ball.dy = ball.speed * Math.sin(angleRad);
            }

            // Scoring Checks
            if (ball.x - ball.radius < 0) {
                aiScore++;
                document.getElementById("ai-score").innerText = aiScore;
                if (aiScore >= targetScore) {
                    endGame("AI Wins! Better luck next time.", false);
                } else {
                    resetBall();
                }
            } else if (ball.x + ball.radius > canvas.width) {
                pScore++;
                document.getElementById("p-score").innerText = pScore;
                if (pScore >= targetScore) {
                    endGame("YOU WIN! +10 Coins", true);
                } else {
                    resetBall();
                }
            }
        }

        function checkCollision(b, p) {
            return b.x - b.radius < p.x + paddleWidth &&
                   b.x + b.radius > p.x &&
                   b.y - b.radius < p.y + paddleHeight &&
                   b.y + b.radius > p.y;
        }

        function endGame(msg, playerWon) {
            gameActive = false;
            document.getElementById("status").innerText = msg;
            if (playerWon) {
                addCoins(10);
            }
        }

        function render() {
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#334155";
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Player Paddle (Neon Blue)
            ctx.fillStyle = "#00f3ff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f3ff";
            ctx.fillRect(player.x, player.y, paddleWidth, paddleHeight);

            // AI Paddle (Neon Pink)
            ctx.fillStyle = "#ff007f";
            ctx.shadowColor = "#ff007f";
            ctx.fillRect(ai.x, ai.y, paddleWidth, paddleHeight);

            // Ball (Yellow)
            ctx.fillStyle = "#facc15";
            ctx.shadowColor = "#facc15";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            pScore = 0;
            aiScore = 0;
            gameActive = true;
            document.getElementById("p-score").innerText = 0;
            document.getElementById("ai-score").innerText = 0;
            document.getElementById("status").innerText = "First to 5 wins!";
            resetBall();
        }

        updateWallet();
        gameLoop();
    </script>
</body>
</html>
