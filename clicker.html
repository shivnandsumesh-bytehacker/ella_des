<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Coin Clicker</title>
    <script src="arcade.js"></script>
    <style>
        :root { --primary: #00f3ff; --accent: #ff007f; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 20px; user-select: none; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px 25px; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 20px; box-sizing: border-box; }
        .stats { font-size: 1.2rem; font-weight: bold; color: #facc15; }
        
        .clicker-container { position: relative; margin: 20px 0; }
        .coin-btn { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, #ffe600 0%, #ff8c00 100%); border: 6px solid #fff; box-shadow: 0 0 30px #ff8c00, inset 0 0 15px #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 5rem; transition: transform 0.05s ease-in-out; outline: none; }
        .coin-btn:active { transform: scale(0.92); }

        .floating-text { position: absolute; color: #00f3ff; font-size: 1.8rem; font-weight: bold; pointer-events: none; animation: floatUp 0.8s ease-out forwards; text-shadow: 0 0 10px #00f3ff; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.3); } }

        .upgrades { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; width: 100%; max-width: 800px; margin-top: 20px; }
        .upgrade-card { background: var(--card); border: 2px solid var(--primary); border-radius: 10px; padding: 15px; text-align: left; }
        .upgrade-card h4 { margin: 0 0 5px 0; color: var(--primary); font-size: 1.1rem; }
        .upgrade-card p { margin: 0 0 10px 0; font-size: 0.85rem; color: #94a3b8; }
        
        .btn { background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 0.9rem; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div class="stats">🪙 Wallet: <span id="coin-count">0</span></div>
        <a href="shop.html" class="nav">🛒 Shop</a>
    </header>

    <h2>✨ Neon Coin Clicker</h2>
    <p>Lifetime Earnings: <strong id="lifetime-count" style="color: #00f3ff;">0</strong></p>

    <div class="clicker-container" id="clicker-box">
        <button class="coin-btn" id="coin-btn" onclick="clickCoin(event)">🪙</button>
    </div>

    <h3>⚡ Upgrades</h3>
    <div class="upgrades">
        <div class="upgrade-card">
            <h4>Click Power (+1)</h4>
            <p>Earn +1 extra coin per click.</p>
            <button class="btn" id="btn-click-power" onclick="buyClickPower()">Buy (Cost: <span id="cost-click-power">10</span>)</button>
        </div>
        <div class="upgrade-card">
            <h4>Auto-Miner (+1/sec)</h4>
            <p>Automatically generates coins every second.</p>
            <button class="btn" id="btn-auto-clicker" onclick="buyAutoClicker()">Buy (Cost: <span id="cost-auto-clicker">25</span>)</button>
        </div>
    </div>

    <script>
        function getCoins() {
            return parseInt(localStorage.getItem('arcade_coins')) || 0;
        }

        function setCoins(val) {
            localStorage.setItem('arcade_coins', val);
        }

        function getLifetime() {
            return parseInt(localStorage.getItem('clicker_lifetime')) || 0;
        }

        function setLifetime(val) {
            localStorage.setItem('clicker_lifetime', val);
        }

        let clickPower = parseInt(localStorage.getItem('clicker_power')) || 1;
        let autoRate = parseInt(localStorage.getItem('clicker_auto_rate')) || 0;
        let costPower = parseInt(localStorage.getItem('clicker_cost_power')) || 10;
        let costAuto = parseInt(localStorage.getItem('clicker_cost_auto')) || 25;

        function updateClickerUI() {
            const currentCoins = getCoins();
            const lifetime = getLifetime();

            document.getElementById('coin-count').innerText = currentCoins.toLocaleString();
            document.getElementById('lifetime-count').innerText = lifetime.toLocaleString();
            
            document.getElementById('cost-click-power').innerText = costPower;
            document.getElementById('cost-auto-clicker').innerText = costAuto;

            document.getElementById('btn-click-power').disabled = currentCoins < costPower;
            document.getElementById('btn-auto-clicker').disabled = currentCoins < costAuto;
        }

        function clickCoin(event) {
            let coins = getCoins() + clickPower;
            let lifetime = getLifetime() + clickPower;

            setCoins(coins);
            setLifetime(lifetime);
            
            // Spawn Floating Text Effect
            const float = document.createElement('div');
            float.className = 'floating-text';
            float.innerText = `+${clickPower}`;
            
            const rect = document.getElementById('clicker-box').getBoundingClientRect();
            float.style.left = `${event.clientX - rect.left - 15}px`;
            float.style.top = `${event.clientY - rect.top - 30}px`;
            
            document.getElementById('clicker-box').appendChild(float);
            setTimeout(() => float.remove(), 800);

            updateClickerUI();
        }

        function buyClickPower() {
            let coins = getCoins();
            if (coins >= costPower) {
                setCoins(coins - costPower);
                clickPower += 1;
                costPower = Math.round(costPower * 1.6);
                localStorage.setItem('clicker_power', clickPower);
                localStorage.setItem('clicker_cost_power', costPower);
                updateClickerUI();
            }
        }

        function buyAutoClicker() {
            let coins = getCoins();
            if (coins >= costAuto) {
                setCoins(coins - costAuto);
                autoRate += 1;
                costAuto = Math.round(costAuto * 1.8);
                localStorage.setItem('clicker_auto_rate', autoRate);
                localStorage.setItem('clicker_cost_auto', costAuto);
                updateClickerUI();
            }
        }

        // Auto-Clicker Loop
        setInterval(() => {
            if (autoRate > 0) {
                setCoins(getCoins() + autoRate);
                setLifetime(getLifetime() + autoRate);
                updateClickerUI();
            }
        }, 1000);

        document.addEventListener("DOMContentLoaded", updateClickerUI);
    </script>
</body>
</html>
