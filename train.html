<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rail Sim Pro 3D - High Speed Express</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #00f3ff;
            --gold: #facc15;
            --emerald: #10b981;
            --amber: #f59e0b;
            --danger: #ef4444;
            --panel-bg: rgba(15, 23, 42, 0.88);
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background: #020617;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        #game-wrapper {
            width: 100%;
            max-width: 1320px;
            height: calc(100vh - 12px);
            max-height: 760px;
            border: 2px solid #334155;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            background: #38bdf8;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        #webgl-canvas { width: 100% !important; height: 100% !important; display: block; }

        /* Modern Flight-Simulator Style HUD (Inspired by Reference) */
        #top-route-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 4px 28px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 10;
        }
        #next-station-title { font-size: 1.15rem; font-weight: 900; letter-spacing: 1px; color: #fff; }
        #next-station-sub { font-size: 0.68rem; color: #94a3b8; text-transform: uppercase; }

        /* Speedometer & Speed Limit Dial */
        #speed-cluster {
            position: absolute;
            top: 12px;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 6px 14px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 10;
        }
        .speed-readout { font-size: 2.2rem; font-weight: 900; font-family: monospace; color: #fff; line-height: 1; }
        .speed-unit { font-size: 0.65rem; color: #94a3b8; font-weight: bold; text-align: left; }
        .limit-badge {
            background: #000;
            border: 3px solid var(--danger);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 900;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        /* Left Action & Signaling Alerts */
        .alerts-panel {
            position: absolute;
            top: 14px;
            left: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
            z-index: 10;
        }
        .alert-card {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.76rem;
            font-weight: 700;
            backdrop-filter: blur(8px);
        }
        .alert-dot { width: 12px; height: 12px; border-radius: 50%; }
        .alert-dot.green { background: var(--emerald); box-shadow: 0 0 8px var(--emerald); }
        .alert-dot.yellow { background: var(--amber); box-shadow: 0 0 8px var(--amber); }

        /* Floating Passenger Cash & Dialogue Popups */
        #fare-feedback {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: var(--emerald);
            color: #000;
            font-size: 1.3rem;
            font-weight: 900;
            padding: 8px 24px;
            border-radius: 30px;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
            pointer-events: none;
            z-index: 30;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Bottom Driver Desk Control Bar */
        .hud-bottom {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.94);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 6px 16px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .ctrl-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.74rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.12s;
        }
        .ctrl-btn:hover { border-color: var(--primary); transform: translateY(-2px); }
        .ctrl-btn.active { background: rgba(16, 185, 129, 0.3); border-color: var(--emerald); }
        .ctrl-val { font-size: 0.95rem; color: var(--gold); }

        #minimap-canvas {
            width: 70px !important;
            height: 70px !important;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: #020617;
            display: block;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="webgl-canvas"></canvas>

        <div id="top-route-bar">
            <div id="next-station-title">PENKARN CENTRAL</div>
            <div id="next-station-sub">DISTANCE: <span id="dist-counter" style="color:var(--gold);">450 M</span> | TRACK 1 EXPRESS</div>
        </div>

        <div id="speed-cluster">
            <div>
                <div class="speed-readout" id="speed-val">0</div>
                <div class="speed-unit">KMPH</div>
            </div>
            <div class="limit-badge" id="speed-limit">75</div>
        </div>

        <div class="alerts-panel">
            <div class="alert-card">
                <div class="alert-dot green" id="aspect-dot"></div>
                <span>LINE SIGNAL: CLEAR</span>
            </div>
            <div class="alert-card">
                🪙 FARES COLLECTED: £<span id="cash-counter" style="color:var(--gold);">1,500</span>
            </div>
            <div class="alert-card">
                👥 ONBOARD PAX: <span id="pax-counter" style="color:var(--primary);">28</span>
            </div>
        </div>

        <div id="fare-feedback">+£450 PASSENGER FARES!</div>

        <!-- Driver Desk Dashboard Hotbar -->
        <div class="hud-bottom">
            <div class="ctrl-btn" id="btn-key" onclick="toggleMasterKey()"><span class="ctrl-val" id="val-key">OFF</span>[K] Master</div>
            <div class="ctrl-btn" id="btn-rev" onclick="cycleReverser()"><span class="ctrl-val" id="val-rev">FWD</span>[R] Reverser</div>
            <div class="ctrl-btn" id="btn-doors" onclick="toggleDoors()"><span class="ctrl-val" id="val-doors">CLOSED</span>[T] Doors</div>
            <div class="ctrl-btn" id="btn-wiper" onclick="toggleWiper()"><span class="ctrl-val" id="val-wiper">OFF</span>[V] Wiper</div>
            <div class="ctrl-btn" onclick="soundHorn()"><span class="ctrl-val">📯</span>[H] Horn</div>
            <div class="ctrl-btn" onclick="cycleCamera()"><span class="ctrl-val" id="val-cam">CAB</span>[C] Camera</div>
            <canvas id="minimap-canvas" width="70" height="70"></canvas>
        </div>
    </div>

    <script>
        // High-Fidelity Web Audio Synthesizer (Pneumatics, Traction, & Rail Joints)
        let audioCtx = null;
        let motorOsc1 = null, motorOsc2 = null, motorGain = null;
        let lastJointDistance = 0;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        // Realistic Air Brake Purge Hiss
        function playAirBrakeHiss() {
            try {
                const ctx = getAudioContext();
                const bSize = ctx.sampleRate * 0.35;
                const buffer = ctx.createBuffer(1, bSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bSize; i++) data[i] = (Math.random() * 2 - 1) * 0.4;
                const src = ctx.createBufferSource();
                src.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 1800;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.35, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                src.start();
            } catch(e){}
        }

        // Speed-Synchronized Rail Joint Double Thud
        function playRailJointSound() {
            try {
                const ctx = getAudioContext();
                [0, 0.08].forEach(dt => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(75, ctx.currentTime + dt);
                    osc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + dt + 0.05);
                    g.gain.setValueAtTime(0.18, ctx.currentTime + dt);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dt + 0.05);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(ctx.currentTime + dt);
                    osc.stop(ctx.currentTime + dt + 0.05);
                });
            } catch(e){}
        }

        // Dual Tone Locomotive Horn
        function playHornSound() {
            try {
                const ctx = getAudioContext();
                [311.13, 370.00].forEach(f => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(f, ctx.currentTime);
                    g.gain.setValueAtTime(0.18, ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.7);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.7);
                });
            } catch(e){}
        }

        function initTractionSound() {
            try {
                const ctx = getAudioContext();
                if (motorGain) return;
                motorGain = ctx.createGain();
                motorGain.gain.setValueAtTime(0.0001, ctx.currentTime);
                motorGain.connect(ctx.destination);

                motorOsc1 = ctx.createOscillator();
                motorOsc1.type = 'sawtooth';
                motorOsc1.frequency.value = 55;
                motorOsc1.connect(motorGain);
                motorOsc1.start();

                motorOsc2 = ctx.createOscillator();
                motorOsc2.type = 'triangle';
                motorOsc2.frequency.value = 110;
                motorOsc2.connect(motorGain);
                motorOsc2.start();
            } catch(e){}
        }

        function updateTractionSound(power, speedRatio) {
            if (!motorGain) return;
            const ctx = getAudioContext();
            if (train.masterKeyOn && Math.abs(train.velocity) > 0.1) {
                const f = 60 + speedRatio * 320;
                motorOsc1.frequency.setTargetAtTime(f, ctx.currentTime, 0.08);
                motorOsc2.frequency.setTargetAtTime(f * 1.5, ctx.currentTime, 0.08);
                motorGain.gain.setTargetAtTime(0.02 + power * 0.12, ctx.currentTime, 0.08);
            } else {
                motorGain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.2);
            }
        }

        // Global Game State
        let scene, camera, renderer, trainGroup = null;
        let opposingTrainGroup = null;
        let cameraMode = 0; // 0: Cab, 1: Chase, 2: Window
        let driverCash = 1500;
        let passengerCount = 28;
        let wiperActive = false;
        let wiperAngle = 0;
        let wiperDirection = 1;

        // 3D Cab Dials & Needles
        let speedoNeedle = null;
        let brakeNeedle = null;
        let wiperMesh = null;

        const train = {
            distance: 0,
            velocity: 0,
            speedKMPH: 0,
            speedLimit: 75,
            powerNotch: 0.0,
            brakeNotch: 1.0,
            reverser: 1,
            masterKeyOn: false,
            doorsOpen: false,
            weight: 85000,
            acceleration: 320000
        };

        const opposingTrain = {
            distance: 5200,
            speed: 28,
            passed: false
        };

        const keys = { w: false, s: false };

        // Scenic Track Spline (Crossing over a River Viaduct & Mountain Pass)
        const trackPoints = [
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, 1000),
            new THREE.Vector3(60, 4, 2200),
            new THREE.Vector3(140, 8, 3800),
            new THREE.Vector3(80, 8, 5400),
            new THREE.Vector3(-100, 2, 7000),
            new THREE.Vector3(-40, 0, 8800),
            new THREE.Vector3(40, 0, 10500),
            new THREE.Vector3(0, 0, 12000)
        ];
        const trackSpline = new THREE.CatmullRomCurve3(trackPoints, false, 'catmullrom', 0.15);
        const TRACK_LENGTH = trackSpline.getLength();

        const stations = [
            { name: 'Penkarn Central', dist: 450 },
            { name: 'Arakkonam Viaduct', dist: 3800 },
            { name: 'Roseberry Junction', dist: 7200 },
            { name: 'Aan Hill Terminus', dist: 11500 }
        ];

        // Platform Passenger Entities
        const platformPassengers = [];

        // Build Realistic 3D Locomotive Cab (Matching Image Viewport)
        function buildCabCockpit() {
            const cabGroup = new THREE.Group();

            // Cockpit Frame / Dash Material
            const dashColor = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.6 });
            const bezelMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
            const dialFaceMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
            const needleMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

            // Curved Front Cockpit Desk Console
            const desk = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.0, 1.8), dashColor);
            desk.position.set(0, -0.65, -1.0);
            cabGroup.add(desk);

            // Left & Right Windshield Pillars (Framing the Front Viewport)
            const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.4, 0.2), dashColor);
            pillarL.position.set(-1.45, 0.4, -0.9);
            pillarL.rotation.z = -0.22;
            cabGroup.add(pillarL);

            const pillarR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.4, 0.2), dashColor);
            pillarR.position.set(1.45, 0.4, -0.9);
            pillarR.rotation.z = 0.22;
            cabGroup.add(pillarR);

            const roofBeam = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.3, 0.3), dashColor);
            roofBeam.position.set(0, 1.45, -0.9);
            cabGroup.add(roofBeam);

            // Working Analog Speedometer Dial
            const speedoBezel = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.08, 24), bezelMat);
            speedoBezel.rotation.x = Math.PI / 3;
            speedoBezel.position.set(-0.25, -0.15, -0.85);
            cabGroup.add(speedoBezel);

            const dialFace = new THREE.Mesh(new THREE.CircleGeometry(0.26, 24), dialFaceMat);
            dialFace.rotation.x = -Math.PI / 6;
            dialFace.position.set(-0.25, -0.12, -0.82);
            cabGroup.add(dialFace);

            // Rotating Needle for Speedometer
            speedoNeedle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.22, 0.02), needleMat);
            speedoNeedle.position.set(-0.25, -0.12, -0.81);
            cabGroup.add(speedoNeedle);

            // Working Brake Pressure Dial
            const brakeBezel = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.08, 24), bezelMat);
            brakeBezel.rotation.x = Math.PI / 3;
            brakeBezel.position.set(0.4, -0.15, -0.85);
            cabGroup.add(brakeBezel);

            brakeNeedle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.18, 0.02), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
            brakeNeedle.position.set(0.4, -0.12, -0.81);
            cabGroup.add(brakeNeedle);

            // Operational Windshield Wiper
            wiperMesh = new THREE.Mesh(new THREE.BoxGeometry(0.03, 1.1, 0.03), new THREE.MeshBasicMaterial({ color: 0x111827 }));
            wiperMesh.position.set(0.4, 0.2, -1.02);
            cabGroup.add(wiperMesh);

            return cabGroup;
        }

        // Build Realistic 3D Train Rig (Locomotive & Passenger Coaches)
        function buildPlayerTrain() {
            if (trainGroup) scene.remove(trainGroup);
            trainGroup = new THREE.Group();

            const bodyWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.35 });
            const stripeRed = new THREE.MeshStandardMaterial({ color: 0xdc2626 });
            const darkMetal = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.65 });

            // Aerodynamic Leading Locomotive
            const loco = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.9, 2.8, 19), bodyWhite);
            body.position.set(0, 2.1, 0);
            loco.add(body);

            const redStripe = new THREE.Mesh(new THREE.BoxGeometry(2.92, 0.45, 18.8), stripeRed);
            redStripe.position.set(0, 1.4, 0);
            loco.add(redStripe);

            // Curved Nose (+Z direction is forward)
            const nose = new THREE.Mesh(new THREE.BoxGeometry(2.9, 2.7, 2.4), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
            nose.position.set(0, 2.05, 10.2);
            loco.add(nose);

            // Front Windshield
            const screen = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 0.1), glassMat);
            screen.position.set(0, 2.5, 11.42);
            loco.add(screen);

            // Pantograph on Roof
            const panto = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.6, 2.0), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
            panto.position.set(0, 3.8, -4.0);
            loco.add(panto);

            trainGroup.add(loco);

            // Attach 3D Cab Cockpit (Active in Cab Mode)
            const cab = buildCabCockpit();
            cab.position.set(0, 2.5, 9.8);
            trainGroup.add(cab);

            // Trailing Coach
            const coach = new THREE.Mesh(new THREE.BoxGeometry(2.9, 2.8, 20), bodyWhite);
            coach.position.set(0, 2.1, -21);
            trainGroup.add(coach);

            scene.add(trainGroup);
        }

        // Oncoming Express AI Train (Track 2)
        function buildOpposingTrain() {
            if (opposingTrainGroup) scene.remove(opposingTrainGroup);
            opposingTrainGroup = new THREE.Group();

            const aiBody = new THREE.Mesh(new THREE.BoxGeometry(2.9, 2.8, 38), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
            aiBody.position.set(0, 2.1, 0);
            opposingTrainGroup.add(aiBody);

            const aiNose = new THREE.Mesh(new THREE.BoxGeometry(2.9, 2.7, 2.4), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
            aiNose.position.set(0, 2.05, -19.5);
            opposingTrainGroup.add(aiNose);

            scene.add(opposingTrainGroup);
        }

        // Build Scenery, Viaduct Bridge Over Water, Catenary Masts, and 3D Commuters
        function buildWorldEnvironment() {
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9 });
            const ballastMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.95 });
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.8 });
            const mastMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.8 });

            // River Water Body Under Viaduct (Between track points 3000m and 5500m)
            const river = new THREE.Mesh(new THREE.PlaneGeometry(16000, 3000), waterMat);
            river.rotation.x = -Math.PI / 2;
            river.position.set(0, -2.5, 4500);
            scene.add(river);

            const steps = 480;
            for (let i = 0; i < steps; i++) {
                const u1 = i / steps;
                const u2 = (i + 1) / steps;
                const p1 = trackSpline.getPointAt(u1);
                const p2 = trackSpline.getPointAt(u2);
                const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
                const segLen = p1.distanceTo(p2);

                // Ballasted Track Bed
                const ballast = new THREE.Mesh(new THREE.BoxGeometry(11.0, 0.4, segLen + 0.5), ballastMat);
                ballast.position.copy(mid);
                ballast.position.y += 0.2;
                ballast.lookAt(p2);
                scene.add(ballast);

                // Concrete Viaduct Bridge Piers when traversing over water
                if (p1.y >= 5.0 && i % 8 === 0) {
                    const pier = new THREE.Mesh(new THREE.BoxGeometry(3.0, p1.y + 4.0, 3.0), ballastMat);
                    pier.position.copy(p1);
                    pier.position.y = (p1.y - 2.5) / 2;
                    scene.add(pier);
                }

                // 4 Parallel Rails (Track 1 and Track 2)
                [-2.0, -0.6, 0.6, 2.0].forEach(rx => {
                    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.22, segLen + 0.5), trackMat);
                    rail.position.set(rx, 0.35, 0);
                    const rg = new THREE.Group();
                    rg.position.copy(mid);
                    rg.lookAt(p2);
                    rg.add(rail);
                    scene.add(rg);
                });

                // Overhead Catenary Electric Wires & Gantries (Every 16 segments)
                if (i % 16 === 0) {
                    const tan = trackSpline.getTangentAt(u1);
                    const gantry = new THREE.Group();

                    const postL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 6.5), mastMat);
                    postL.position.set(-4.5, 3.25, 0);
                    gantry.add(postL);

                    const postR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 6.5), mastMat);
                    postR.position.set(4.5, 3.25, 0);
                    gantry.add(postR);

                    const beam = new THREE.Mesh(new THREE.BoxGeometry(9.4, 0.2, 0.2), mastMat);
                    beam.position.set(0, 6.4, 0);
                    gantry.add(beam);

                    gantry.position.copy(p1);
                    gantry.lookAt(p1.clone().add(tan));
                    scene.add(gantry);
                }
            }

            // High-Detail Passenger Station Platforms
            stations.forEach(st => {
                const u = st.dist / TRACK_LENGTH;
                const pos = trackSpline.getPointAt(u);
                const tan = trackSpline.getTangentAt(u).normalize();
                const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

                const stGroup = new THREE.Group();

                // Platform Concrete Deck
                const plat = new THREE.Mesh(new THREE.BoxGeometry(5.5, 1.3, 190), new THREE.MeshStandardMaterial({ color: 0x334155 }));
                plat.position.set(0, 0.65, 0);
                stGroup.add(plat);

                // Tactile Yellow Boarding Edge
                const edge = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 190), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
                edge.position.set(-2.4, 1.32, 0);
                stGroup.add(edge);

                // Spawn 3D Commuters along the platform
                for (let j = -70; j <= 70; j += 18) {
                    const pax = createPassengerMesh();
                    pax.position.set(-1.8, 1.35, j);
                    stGroup.add(pax);
                    platformPassengers.push({ mesh: pax, stationDist: st.dist, boarded: false });
                }

                stGroup.position.copy(pos).addScaledVector(norm, -4.6);
                stGroup.lookAt(pos.clone().add(tan).addScaledVector(norm, -4.6));
                scene.add(stGroup);
            });
        }

        // Procedural 3D Commuter Figure
        function createPassengerMesh() {
            const pGroup = new THREE.Group();
            const skin = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const colors = [0xdc2626, 0x2563eb, 0x16a34a, 0xd97706, 0x7c3aed];
            const shirt = new THREE.MeshLambertMaterial({ color: colors[Math.floor(Math.random() * colors.length)] });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.65, 0.3), shirt);
            torso.position.y = 0.65;
            pGroup.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.28, 0.28), skin);
            head.position.y = 1.15;
            pGroup.add(head);

            return pGroup;
        }

        function init3D() {
            const container = document.getElementById("game-wrapper");
            const w = container.clientWidth;
            const h = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7dd3fc); // Atmospheric blue sky
            scene.fog = new THREE.FogExp2(0x7dd3fc, 0.00032);

            camera = new THREE.PerspectiveCamera(58, w / h, 0.1, 7500);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, canvas: document.getElementById("webgl-canvas") });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

            // Realistic Daylight & Sun Shadows
            const ambient = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xfffaed, 1.25);
            sun.position.set(400, 900, 300);
            scene.add(sun);

            // Rolling Countryside Green Hills
            const terrain = new THREE.Mesh(new THREE.PlaneGeometry(16000, 16000), new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.9 }));
            terrain.rotation.x = -Math.PI / 2;
            terrain.position.y = -0.1;
            scene.add(terrain);

            buildWorldEnvironment();
            buildPlayerTrain();
            buildOpposingTrain();

            window.addEventListener('resize', () => {
                const nw = container.clientWidth;
                const nh = container.clientHeight;
                camera.aspect = nw / nh;
                camera.updateProjectionMatrix();
                renderer.setSize(nw, nh);
            });
        }

        // Camera Tracking
        function updateCamera() {
            if (!trainGroup) return;
            trainGroup.updateMatrixWorld(true);

            if (cameraMode === 0) {
                // 1. DRIVER CAB VIEW (Placed inside looking directly forward through the windshield)
                const cabEye = trainGroup.localToWorld(new THREE.Vector3(0.35, 2.55, 9.6));
                const cabTarget = trainGroup.localToWorld(new THREE.Vector3(0.35, 2.55, 90.0));
                camera.position.copy(cabEye);
                camera.lookAt(cabTarget);
            } else if (cameraMode === 1) {
                // 2. 3RD PERSON CHASE CAM
                const chasePos = trainGroup.localToWorld(new THREE.Vector3(0, 8.5, -42.0));
                const chaseTarget = trainGroup.localToWorld(new THREE.Vector3(0, 2.0, 15.0));
                camera.position.lerp(chasePos, 0.18);
                camera.lookAt(chaseTarget);
            } else {
                // 3. PASSENGER WINDOW VIEW
                const winPos = trainGroup.localToWorld(new THREE.Vector3(-1.3, 2.2, -8.0));
                const winTarget = trainGroup.localToWorld(new THREE.Vector3(-35.0, 2.0, -8.0));
                camera.position.copy(winPos);
                camera.lookAt(winTarget);
            }
        }

        // Player Controls
        function toggleMasterKey() {
            getAudioContext();
            initTractionSound();
            train.masterKeyOn = !train.masterKeyOn;
            document.getElementById("val-key").innerText = train.masterKeyOn ? "ON" : "OFF";
            document.getElementById("btn-key").classList.toggle("active", train.masterKeyOn);
            playAirBrakeHiss();
        }

        function cycleReverser() {
            if (!train.masterKeyOn) return;
            if (Math.abs(train.velocity) > 0.5) return;
            train.reverser = train.reverser === 1 ? -1 : 1;
            document.getElementById("val-rev").innerText = train.reverser === 1 ? "FWD" : "REV";
        }

        // Passenger Boarding & Fare Collection System
        function toggleDoors() {
            if (Math.abs(train.velocity) > 0.5) return;
            train.doorsOpen = !train.doorsOpen;
            document.getElementById("val-doors").innerText = train.doorsOpen ? "OPEN" : "CLOSED";
            document.getElementById("btn-doors").classList.toggle("active", train.doorsOpen);

            if (train.doorsOpen) {
                playAirBrakeHiss();

                // Check for passengers at the current station platform
                let boardingCount = 0;
                platformPassengers.forEach(p => {
                    if (Math.abs(p.stationDist - train.distance) < 90 && !p.boarded) {
                        p.boarded = true;
                        boardingCount += 4;
                        // Animate walking towards train
                        p.mesh.position.x += 1.2;
                    }
                });

                if (boardingCount > 0) {
                    passengerCount += boardingCount;
                    const fareCollected = boardingCount * 45;
                    driverCash += fareCollected;

                    document.getElementById("cash-counter").innerText = driverCash.toLocaleString();
                    document.getElementById("pax-counter").innerText = passengerCount;

                    // Floating banner feedback
                    const fb = document.getElementById("fare-feedback");
                    fb.innerText = `+£${fareCollected} FARES COLLECTED (${boardingCount} PAX)`;
                    fb.style.transform = 'translateX(-50%) scale(1.15)';
                    setTimeout(() => { fb.style.transform = 'translateX(-50%) scale(0)'; }, 1400);
                }
            } else {
                playAirBrakeHiss();
            }
        }

        function toggleWiper() {
            wiperActive = !wiperActive;
            document.getElementById("val-wiper").innerText = wiperActive ? "ON" : "OFF";
            document.getElementById("btn-wiper").classList.toggle("active", wiperActive);
        }

        function soundHorn() {
            playHornSound();
        }

        function cycleCamera() {
            cameraMode = (cameraMode + 1) % 3;
            const names = ["CAB", "CHASE", "WINDOW"];
            document.getElementById("val-cam").innerText = names[cameraMode];
        }

        window.addEventListener("keydown", e => {
            const c = e.code;
            if (["KeyW","KeyS","KeyK","KeyR","KeyT","KeyV","KeyH","KeyC","ArrowUp","ArrowDown"].includes(c)) e.preventDefault();
            if (c === "KeyW" || c === "ArrowUp") keys.w = true;
            if (c === "KeyS" || c === "ArrowDown") keys.s = true;
            if (c === "KeyK") toggleMasterKey();
            if (c === "KeyR") cycleReverser();
            if (c === "KeyT") toggleDoors();
            if (c === "KeyV") toggleWiper();
            if (c === "KeyH") soundHorn();
            if (c === "KeyC") cycleCamera();
        });

        window.addEventListener("keyup", e => {
            if (e.code === "KeyW" || e.code === "ArrowUp") keys.w = false;
            if (e.code === "KeyS" || e.code === "ArrowDown") keys.s = false;
        });

        // Main Physics & Dashboard Needle Updates
        function updatePhysics(dt) {
            if (!trainGroup) return;

            if (train.masterKeyOn && !train.doorsOpen) {
                if (keys.w) {
                    train.powerNotch = Math.min(1.0, train.powerNotch + dt * 0.45);
                    train.brakeNotch = Math.max(0.0, train.brakeNotch - dt * 0.7);
                }
                if (keys.s) {
                    train.brakeNotch = Math.min(1.0, train.brakeNotch + dt * 0.45);
                    train.powerNotch = Math.max(0.0, train.powerNotch - dt * 0.7);
                }
            }

            const currentSpeed = Math.abs(train.velocity);
            const tractiveForce = (train.powerNotch * train.acceleration - train.brakeNotch * 220000) * train.reverser;
            const resistance = 0.0025 * train.weight * 9.81 + (0.0004 * currentSpeed * currentSpeed);

            const accel = (tractiveForce - Math.sign(train.velocity) * resistance) / train.weight;
            train.velocity += accel * dt;

            if (train.powerNotch === 0 && train.brakeNotch > 0.2 && currentSpeed < 0.25) {
                train.velocity = 0;
            }

            train.distance += train.velocity * dt;
            train.distance = Math.max(0, Math.min(TRACK_LENGTH, train.distance));
            train.speedKMPH = Math.round(Math.abs(train.velocity) * 3.6);

            // Rail Joint Sound Trigger every 35 meters
            if (Math.abs(train.distance - lastJointDistance) > 35 && currentSpeed > 3) {
                lastJointDistance = train.distance;
                playRailJointSound();
            }

            // Animate Physical Dashboard Gauges
            if (speedoNeedle && brakeNeedle) {
                speedoNeedle.rotation.z = -((train.speedKMPH / 160) * Math.PI * 1.4);
                brakeNeedle.rotation.z = -(train.brakeNotch * Math.PI * 1.2);
            }

            // Animate Windshield Wiper Sweep
            if (wiperMesh && wiperActive) {
                wiperAngle += wiperDirection * dt * 4.5;
                if (wiperAngle > 0.85) wiperDirection = -1;
                if (wiperAngle < -0.2) wiperDirection = 1;
                wiperMesh.rotation.z = wiperAngle;
            }

            // Position Train onto Spline
            const u = Math.min(1.0, Math.max(0.0, train.distance / TRACK_LENGTH));
            const trainPos = trackSpline.getPointAt(u);
            const trainTangent = trackSpline.getTangentAt(u).normalize();
            const norm = new THREE.Vector3(-trainTangent.z, 0, trainTangent.x).normalize();

            trainGroup.position.copy(trainPos).addScaledVector(norm, 1.3);
            trainGroup.lookAt(trainPos.clone().add(trainTangent).addScaledVector(norm, 1.3));

            // Oncoming Opposing AI Train (Track 2)
            if (opposingTrainGroup) {
                opposingTrain.distance -= opposingTrain.speed * dt;
                if (opposingTrain.distance < 0) opposingTrain.distance = TRACK_LENGTH;

                const aiU = opposingTrain.distance / TRACK_LENGTH;
                const aiPos = trackSpline.getPointAt(aiU);
                const aiTan = trackSpline.getTangentAt(aiU).normalize();

                opposingTrainGroup.position.copy(aiPos).addScaledVector(norm, -1.3);
                opposingTrainGroup.lookAt(aiPos.clone().sub(aiTan).addScaledVector(norm, -1.3));

                // Oncoming crossing horn
                if (Math.abs(train.distance - opposingTrain.distance) < 90 && !opposingTrain.passed) {
                    opposingTrain.passed = true;
                    playHornSound();
                }
                if (Math.abs(train.distance - opposingTrain.distance) > 160) opposingTrain.passed = false;
            }

            // HUD & Dashboard Updates
            document.getElementById("speed-val").innerText = train.speedKMPH;
            updateTractionSound(train.powerNotch, currentSpeed / 40);

            const nextSt = stations.find(s => s.dist > train.distance - 20) || stations[stations.length - 1];
            document.getElementById("next-station-title").innerText = nextSt.name.toUpperCase();
            document.getElementById("dist-counter").innerText = Math.max(0, Math.round(nextSt.dist - train.distance)) + " M";
        }

        function updateMinimap() {
            const canvas = document.getElementById("minimap-canvas");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "#334155";
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let i = 0; i <= 30; i++) {
                const p = trackSpline.getPointAt(i / 30);
                const mx = 35 + (p.x / 300) * 22;
                const my = 10 + (p.z / TRACK_LENGTH) * 50;
                if (i === 0) ctx.moveTo(mx, my); else ctx.lineTo(mx, my);
            }
            ctx.stroke();

            const curP = trackSpline.getPointAt(Math.min(1.0, train.distance / TRACK_LENGTH));
            ctx.fillStyle = "#00f3ff";
            ctx.beginPath();
            ctx.arc(35 + (curP.x / 300) * 22, 10 + (curP.z / TRACK_LENGTH) * 50, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        let lastTime = performance.now();
        function mainLoop(now) {
            requestAnimationFrame(mainLoop);
            const dt = Math.min((now - lastTime) / 1000, 0.02);
            lastTime = now;

            updatePhysics(dt);
            updateCamera();
            updateMinimap();
            renderer.render(scene, camera);
        }

        document.addEventListener("DOMContentLoaded", () => {
            init3D();
            requestAnimationFrame(mainLoop);
        });
    </script>
</body>
</html>
