<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Railways 3D - Pro Driver Simulator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #00f3ff;
            --gold: #facc15;
            --emerald: #10b981;
            --amber: #f59e0b;
            --danger: #ef4444;
            --card: rgba(11, 19, 41, 0.94);
        }
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body {
            background: #030712;
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: none;
        }

        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #7dd3fc;
        }
        #webgl-canvas { width: 100% !important; height: 100% !important; display: block; }

        /* Top Bar Overlay */
        .hud-top {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 16px;
            pointer-events: none;
            z-index: 20;
        }

        .hud-card {
            background: var(--card);
            border: 1.5px solid rgba(0, 243, 255, 0.4);
            border-radius: 10px;
            padding: 8px 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            pointer-events: auto;
            backdrop-filter: blur(8px);
        }

        .station-hud {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .station-tag { font-size: 0.65rem; color: #94a3b8; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; }
        .station-title { font-size: 1.3rem; font-weight: 900; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
        .station-sub { font-size: 0.75rem; color: var(--gold); font-family: monospace; font-weight: bold; }

        .speed-hud {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .speed-val { font-size: 2.2rem; font-weight: 900; line-height: 1; color: #fff; font-family: monospace; }
        .speed-unit { font-size: 0.65rem; color: #94a3b8; font-weight: bold; }
        .limit-pill {
            background: var(--gold);
            color: #000;
            font-weight: 900;
            font-size: 0.78rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            font-family: monospace;
        }

        /* Left Signals Alerts */
        .signal-alerts {
            position: absolute;
            top: 90px;
            left: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 20;
        }
        .alert-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: bold;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        }
        .alert-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 900;
        }

        /* Tactical Right Throttle Lever (iPad & Desktop Slider) */
        #throttle-container {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 58px;
            height: 220px;
            background: rgba(15, 23, 42, 0.88);
            border: 2px solid #334155;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            z-index: 30;
            box-shadow: 0 8px 32px rgba(0,0,0,0.7);
            touch-action: none;
        }
        #throttle-track {
            position: relative;
            width: 12px;
            height: 150px;
            background: #020617;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #throttle-handle {
            position: absolute;
            left: 50%;
            bottom: 0px;
            transform: translateX(-50%);
            width: 48px;
            height: 38px;
            background: linear-gradient(180deg, #475569, #1e293b);
            border: 2px solid var(--primary);
            border-radius: 10px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 243, 255, 0.4);
        }
        #throttle-handle::after {
            content: '';
            width: 20px;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* Bottom Driver Console Desk */
        .hud-bottom {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(11, 19, 41, 0.95);
            border: 1.5px solid rgba(0, 243, 255, 0.3);
            border-radius: 14px;
            padding: 6px 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 25;
            max-width: 95vw;
            overflow-x: auto;
        }
        .desk-btn {
            background: #1e293b;
            border: 1.5px solid #334155;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            min-width: 58px;
            transition: all 0.1s;
        }
        .desk-btn:active, .desk-btn.active {
            background: var(--primary);
            color: #000;
            border-color: #fff;
            transform: scale(0.95);
        }
        .desk-btn.danger { border-color: var(--danger); color: var(--danger); }
        .desk-btn.danger:active { background: var(--danger); color: #fff; }

        /* Floating Passenger Fare Popups */
        .fare-popup {
            position: absolute;
            color: var(--gold);
            font-size: 1.4rem;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.8), 2px 2px #000;
            pointer-events: none;
            z-index: 50;
            animation: floatUp 1.2s forwards cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translate(-50%, 0) scale(0.6); }
            30% { opacity: 1; transform: translate(-50%, -25px) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
        }

        #dialogue-box {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 19, 41, 0.96);
            border: 2px solid var(--gold);
            color: #fff;
            padding: 8px 24px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: bold;
            display: none;
            z-index: 40;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        /* Modals */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 18, 0.94);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }
        .modal-card {
            background: var(--card);
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 20px;
            max-width: 680px;
            width: 90%;
            text-align: left;
        }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 14px; }
        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="webgl-canvas"></canvas>

        <div class="hud-top">
            <div class="hud-card" style="display:flex; align-items:center; gap:10px;">
                <button class="btn" style="padding:4px 10px; font-size:0.75rem;" onclick="toggleModal('map-modal', true)">🗺️ Territory</button>
                <button class="btn" style="padding:4px 10px; font-size:0.75rem;" onclick="toggleModal('depot-modal', true)">🚆 Fleet</button>
                <span style="font-size:0.85rem; font-weight:bold; color:var(--gold);">💷 £<span id="cash-count">2,500</span></span>
            </div>

            <div class="station-hud">
                <span class="station-tag">Next Stop</span>
                <span class="station-title" id="station-name-hud">ARAKKONAM VIADUCT</span>
                <span class="station-sub" id="station-dist-hud">450 M</span>
            </div>

            <div class="speed-hud">
                <span class="speed-val" id="speed-display">0</span>
                <span class="speed-unit">KMPH</span>
                <div class="limit-pill" id="limit-display">LIMIT: 70</div>
            </div>
        </div>

        <div class="signal-alerts">
            <div class="alert-pill">
                <div class="alert-icon" style="background:#22c55e;">●</div>
                <span>LINE CLEAR (ASPECT: GREEN)</span>
            </div>
            <div class="alert-pill">
                <div class="alert-icon" style="background:var(--amber);">⚠️</div>
                <span id="curve-warning-text">TRACK SPEED 70 KMPH</span>
            </div>
        </div>

        <div id="throttle-container">
            <span style="font-size:0.6rem; font-weight:900; color:#94a3b8;">PWR</span>
            <div id="throttle-track">
                <div id="throttle-handle"></div>
            </div>
            <span style="font-size:0.6rem; font-weight:900; color:#94a3b8;">BRK</span>
        </div>

        <div id="dialogue-box"></div>

        <!-- Hotbar Console -->
        <div class="hud-bottom">
            <button class="desk-btn danger" onclick="applyEmergencyBrake()">🛑<br>E-STOP</button>
            <button class="desk-btn" id="btn-master" onclick="toggleMasterKey()">🔑<br>KEY</button>
            <button class="desk-btn" id="btn-reverser" onclick="cycleReverser()">🔄<br>FWD</button>
            <button class="desk-btn" id="btn-doors" onclick="toggleDoors()">🚪<br>DOORS</button>
            <button class="desk-btn" onclick="soundHorn()">📯<br>HORN</button>
            <button class="desk-btn" id="btn-wiper" onclick="toggleWiper()">🌧️<br>WIPER</button>
            <button class="desk-btn" onclick="cycleCamera()">🎥<br>CAM</button>
            <button class="desk-btn" onclick="acknowledgeAWS()">⚠️<br>AWS</button>
        </div>

        <!-- Fleet Modal -->
        <div id="depot-modal" class="modal">
            <div class="modal-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="color:var(--primary); margin:0;">🚆 INTERNATIONAL FLEET DEPOT</h2>
                    <button class="btn" style="padding:4px 8px;" onclick="toggleModal('depot-modal', false)">✕</button>
                </div>
                <div class="btn-grid">
                    <button class="btn" onclick="selectTrain('WAP7')">🇮🇳 WAP-7 High-Speed Electric<br><small>140 KMPH Express | FREE</small></button>
                    <button class="btn" onclick="selectTrain('Class142')">🇬🇧 BR Class 142 Pacer<br><small>Regional Commuter | FREE</small></button>
                    <button class="btn" onclick="selectTrain('Shinkansen')">🇯🇵 Shinkansen N700S<br><small>285 KMPH Bullet Train | £12,000</small></button>
                </div>
            </div>
        </div>

        <!-- Map Modal -->
        <div id="map-modal" class="modal">
            <div class="modal-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="color:var(--gold); margin:0;">🗺️ TERRITORY SELECTOR</h2>
                    <button class="btn" style="padding:4px 8px;" onclick="toggleModal('map-modal', false)">✕</button>
                </div>
                <div class="btn-grid">
                    <button class="btn" onclick="selectMap('IN')">🇮🇳 Arakkonam Lake Viaduct<br><small>Deep Water Bridges, Distant Peaks & Oncoming Freight</small></button>
                    <button class="btn" onclick="selectMap('UK')">🇬🇧 British Pennine Line<br><small>Rolling Hills, Double Ballast & Stone Archways</small></button>
                    <button class="btn" onclick="selectMap('JP')">🇯🇵 Tokaido Coastal Line<br><small>Elevated High Speed Slabs & Blossom Valleys</small></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // High-Fidelity Web Audio Synthesizer (Motor, Air Brakes, Track Joints, Horn)
        let audioCtx = null;
        let motorGain = null, motorOsc = null;
        let brakeNoiseNode = null;
        let lastJointDistance = 0;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function initTractionAcoustics() {
            try {
                const ctx = getAudioContext();
                if (!ctx || motorGain) return;

                motorGain = ctx.createGain();
                motorGain.gain.setValueAtTime(0.001, ctx.currentTime);
                motorGain.connect(ctx.destination);

                motorOsc = ctx.createOscillator();
                motorOsc.type = 'sawtooth';
                motorOsc.frequency.value = 45;
                motorOsc.connect(motorGain);
                motorOsc.start();
            } catch(e){}
        }

        function updateMotorSound(speedRatio, throttleRatio) {
            if (!motorGain) return;
            const ctx = getAudioContext();
            if (train.masterKeyOn && !train.doorsOpen) {
                const targetFreq = 42 + (speedRatio * 180) + (throttleRatio * 95);
                motorOsc.frequency.setTargetAtTime(targetFreq, ctx.currentTime, 0.08);
                motorGain.gain.setTargetAtTime(0.015 + (throttleRatio * 0.06), ctx.currentTime, 0.08);
            } else {
                motorGain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.15);
            }
        }

        function playAirBrakeHiss() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const bufferSize = ctx.sampleRate * 0.45;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1600;

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

                noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
                noise.start();
            } catch(e){}
        }

        function playRailJointClatter() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                [0, 0.07].forEach(del => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(80, ctx.currentTime + del);
                    osc.frequency.exponentialRampToValueAtTime(28, ctx.currentTime + del + 0.05);
                    g.gain.setValueAtTime(0.12, ctx.currentTime + del);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + del + 0.05);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(ctx.currentTime + del);
                    osc.stop(ctx.currentTime + del + 0.05);
                });
            } catch(e){}
        }

        function playDualAirHorn() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                [293.66, 369.99].forEach(f => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(f, ctx.currentTime);
                    g.gain.setValueAtTime(0.18, ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.7);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.7);
                });
            } catch(e){}
        }

        function playCoinChime() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, ctx.currentTime);
                osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.08);
                g.gain.setValueAtTime(0.2, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                osc.connect(g); g.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.4);
            } catch(e){}
        }

        // 3D Scene Architecture & Materials
        let scene, camera, renderer;
        let trainRig = null, opposingTrainRig = null;
        let cabInteriorGroup = null;
        let wiperMeshL = null, wiperMeshR = null;
        let speedNeedle = null;
        let animatedPassengers = [];

        let currentMap = 'IN';
        let currentTrain = 'WAP7';
        let driverFares = 2500;
        let cameraMode = 0; // 0: Cab View, 1: Nose Buffer, 2: 3rd Person Follow, 3: Window View
        let wiperActive = false;

        const train = {
            distance: 0,
            velocity: 0,
            speedKMPH: 0,
            speedLimitKMPH: 70,
            powerNotch: 0.0,
            brakeNotch: 1.0,
            reverser: 1, // 1 = FWD, -1 = REV
            masterKeyOn: false,
            doorsOpen: false,
            weight: 120000,
            maxSpeedKMPH: 140,
            tractionForce: 360000
        };

        const opposingAI = {
            distance: 3800,
            speed: 22 // Opposing train traveling ~80 KMPH
        };

        // Curved Spline over Water Viaduct
        const trackPoints = [
            new THREE.Vector3(0, 5, 0),
            new THREE.Vector3(0, 5, 1200),
            new THREE.Vector3(120, 5, 2600),
            new THREE.Vector3(240, 5, 4200),
            new THREE.Vector3(180, 5, 6000),
            new THREE.Vector3(-140, 5, 7800),
            new THREE.Vector3(-60, 5, 9600),
            new THREE.Vector3(0, 5, 12000)
        ];
        const spline = new THREE.CatmullRomCurve3(trackPoints, false, 'catmullrom', 0.15);
        const TRACK_LENGTH = spline.getLength();

        const STATIONS = {
            'IN': [
                { name: 'ARAKKONAM VIADUCT', dist: 450, limit: 70 },
                { name: 'KATPADI JUNCTION', dist: 3500, limit: 110 },
                { name: 'JOLARPETTAI EXPRESS', dist: 7400, limit: 130 },
                { name: 'SALEM CENTRAL TERMINUS', dist: 11500, limit: 60 }
            ],
            'UK': [
                { name: 'PENKARN MEADOWS', dist: 450, limit: 75 },
                { name: 'MILLBRIDGE RIDGE', dist: 3500, limit: 90 },
                { name: 'BRIMMOUTH VALLEY', dist: 7400, limit: 125 },
                { name: 'AAN HILL TERMINUS', dist: 11500, limit: 45 }
            ],
            'JP': [
                { name: 'SHIN-YOKOHAMA BAY', dist: 450, limit: 110 },
                { name: 'ODAWARA EXPRESSWAY', dist: 3500, limit: 210 },
                { name: 'SHIZUOKA COAST', dist: 7400, limit: 285 },
                { name: 'NAGOYA TERMINAL', dist: 11500, limit: 90 }
            ]
        };

        function showDialogue(text) {
            const el = document.getElementById("dialogue-box");
            el.innerText = text;
            el.style.display = "block";
            setTimeout(() => { el.style.display = "none"; }, 3500);
        }

        function toggleModal(id, open) {
            document.getElementById(id).style.display = open ? 'flex' : 'none';
        }

        function spawnFarePopups(count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const el = document.createElement("div");
                    el.className = "fare-popup";
                    el.innerText = `+£35 🪙`;
                    el.style.left = `${45 + (Math.random() * 10)}%`;
                    el.style.top = `${55 + (Math.random() * 10)}%`;
                    document.getElementById("game-wrapper").appendChild(el);
                    playCoinChime();
                    setTimeout(() => el.remove(), 1200);
                }, i * 160);
            }
        }

        // Build Realistic 3D Locomotive Cab (Matches Screenshot)
        function buildCabCockpit() {
            if (cabInteriorGroup) camera.remove(cabInteriorGroup);
            cabInteriorGroup = new THREE.Group();

            const frameMat = new THREE.MeshStandardMaterial({ color: 0x2e3842, roughness: 0.8 });
            const deskMat = new THREE.MeshStandardMaterial({ color: 0x486571, roughness: 0.6 }); // Teal-green Indian/British desk
            const blackConsole = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.7 });

            // Dashboard Console Base
            const desk = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.9, 1.8), deskMat);
            desk.position.set(0, -0.65, -1.3);
            cabInteriorGroup.add(desk);

            // Left & Right MFD Display Screens
            [-1.15, 1.15].forEach(x => {
                const screen = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.55, 0.05), blackConsole);
                screen.position.set(x, -0.38, -1.05);
                screen.rotation.x = -0.35;
                cabInteriorGroup.add(screen);
            });

            // Center Speedometer Gauge Housing
            const dialHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.06, 24), blackConsole);
            dialHousing.rotation.x = Math.PI / 2 - 0.35;
            dialHousing.position.set(-0.35, -0.36, -1.02);
            cabInteriorGroup.add(dialHousing);

            // 3D Moving Speedometer Needle
            speedNeedle = new THREE.Mesh(
                new THREE.BoxGeometry(0.015, 0.16, 0.01),
                new THREE.MeshBasicMaterial({ color: 0xef4444 })
            );
            speedNeedle.position.set(-0.35, -0.36, -1.0);
            cabInteriorGroup.add(speedNeedle);

            // Center Brake Pressure Gauge
            const brakeGauge = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.05, 20), blackConsole);
            brakeGauge.rotation.x = Math.PI / 2 - 0.35;
            brakeGauge.position.set(0.25, -0.36, -1.02);
            cabInteriorGroup.add(brakeGauge);

            // Big Red Emergency Stop Button
            const eStopBtn = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.09, 0.06, 16),
                new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.3 })
            );
            eStopBtn.rotation.x = -0.35;
            eStopBtn.position.set(-0.65, -0.48, -0.9);
            cabInteriorGroup.add(eStopBtn);

            // Angled Windshield Outer Structural Frame (Pillars & Roof)
            const pillarL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.2, 0.18), frameMat);
            pillarL.position.set(-1.65, 0.35, -1.15);
            pillarL.rotation.z = -0.15;
            cabInteriorGroup.add(pillarL);

            const pillarR = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.2, 0.18), frameMat);
            pillarR.position.set(1.65, 0.35, -1.15);
            pillarR.rotation.z = 0.15;
            cabInteriorGroup.add(pillarR);

            const roofBeam = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.4, 0.3), frameMat);
            roofBeam.position.set(0, 1.25, -1.15);
            cabInteriorGroup.add(roofBeam);

            // Functional Animated Windshield Wipers
            const wiperMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 });
            wiperMeshL = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.85, 0.02), wiperMat);
            wiperMeshL.position.set(-0.7, 0.4, -1.18);
            cabInteriorGroup.add(wiperMeshL);

            wiperMeshR = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.85, 0.02), wiperMat);
            wiperMeshR.position.set(0.7, 0.4, -1.18);
            cabInteriorGroup.add(wiperMeshR);

            camera.add(cabInteriorGroup);
        }

        // Build Realistic Player Train Models
        function buildPlayerTrain() {
            if (trainRig) scene.remove(trainRig);
            trainRig = new THREE.Group();

            const glassMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.65 });
            const darkMetal = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });

            if (currentTrain === 'WAP7') {
                // Indian WAP-7 High Horsepower Electric Locomotive
                const wapWhite = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.3 });
                const redBand = new THREE.MeshStandardMaterial({ color: 0xb91c1c });

                const body = new THREE.Mesh(new THREE.BoxGeometry(3.0, 3.2, 21), wapWhite);
                body.position.set(0, 2.2, 0);
                trainRig.add(body);

                const stripe = new THREE.Mesh(new THREE.BoxGeometry(3.02, 0.45, 20.8), redBand);
                stripe.position.set(0, 1.6, 0);
                trainRig.add(stripe);

                // Distinct Slanted Nose Cab
                const nose = new THREE.Mesh(new THREE.BoxGeometry(2.95, 2.8, 2.2), wapWhite);
                nose.position.set(0, 2.1, 11.2);
                trainRig.add(nose);
            } else if (currentTrain === 'Class142') {
                // British Rail Regional Railways
                const bodyWhite = new THREE.MeshStandardMaterial({ color: 0xf8fafc });
                const railBlue = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
                const warnYellow = new THREE.MeshStandardMaterial({ color: 0xfacc15 });

                const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.7, 18), bodyWhite);
                body.position.set(0, 2.0, 0);
                trainRig.add(body);

                const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.82, 0.5, 17.8), railBlue);
                stripe.position.set(0, 1.4, 0);
                trainRig.add(stripe);

                const nose = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.68, 2.0), warnYellow);
                nose.position.set(0, 2.0, 9.8);
                trainRig.add(nose);
            } else {
                // Japanese Shinkansen N700S
                const bulletWhite = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
                const jrBlue = new THREE.MeshStandardMaterial({ color: 0x1d4ed8 });

                const body = new THREE.Mesh(new THREE.BoxGeometry(2.9, 2.7, 22), bulletWhite);
                body.position.set(0, 2.0, 0);
                trainRig.add(body);

                const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.92, 0.35, 21.8), jrBlue);
                stripe.position.set(0, 1.4, 0);
                trainRig.add(stripe);

                const nose = new THREE.Mesh(new THREE.ConeGeometry(1.4, 5.5, 16), bulletWhite);
                nose.rotation.x = Math.PI / 2;
                nose.position.set(0, 1.8, 13.5);
                trainRig.add(nose);
            }

            // Dual Headlight Beams (Front at Z = 11.5)
            [-0.9, 0.9].forEach(x => {
                const light = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.1, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                light.rotation.x = Math.PI / 2;
                light.position.set(x, 1.25, 11.5);
                trainRig.add(light);
            });

            // Bogies
            [-6.5, 6.5].forEach(z => {
                const bogie = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 4.0), darkMetal);
                bogie.position.set(0, 0.5, z);
                trainRig.add(bogie);
            });

            scene.add(trainRig);
        }

        // Build Opposing Oncoming AI Train (As Seen in Screenshot!)
        function buildOpposingTrain() {
            if (opposingTrainRig) scene.remove(opposingTrainRig);
            opposingTrainRig = new THREE.Group();

            const wapBody = new THREE.Mesh(new THREE.BoxGeometry(3.0, 3.2, 22), new THREE.MeshStandardMaterial({ color: 0xf1f5f9 }));
            wapBody.position.set(0, 2.2, 0);
            opposingTrainRig.add(wapBody);

            const redStripe = new THREE.Mesh(new THREE.BoxGeometry(3.02, 0.45, 21.8), new THREE.MeshStandardMaterial({ color: 0xb91c1c }));
            redStripe.position.set(0, 1.6, 0);
            opposingTrainRig.add(redStripe);

            // Trailing Passenger Coaches
            for (let c = 1; c <= 4; c++) {
                const coach = new THREE.Mesh(new THREE.BoxGeometry(2.9, 3.1, 24), new THREE.MeshStandardMaterial({ color: 0x1d4ed8 }));
                coach.position.set(0, 2.2, c * 25.5);
                opposingTrainRig.add(coach);
            }

            scene.add(opposingTrainRig);
        }

        // Detailed Map & Scenery (Water Viaduct, Mountains, Platforms & Passengers)
        function buildTerritoryMap() {
            const toRemove = [];
            scene.traverse(obj => { if (obj.userData && obj.userData.isMap) toRemove.push(obj); });
            toRemove.forEach(obj => scene.remove(obj));
            animatedPassengers = [];

            // 1. Deep Blue Water Body Beneath Viaduct
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, metalness: 0.8 });
            const water = new THREE.Mesh(new THREE.PlaneGeometry(16000, 16000), waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -0.5;
            water.userData.isMap = true;
            scene.add(water);

            // 2. Distant Mountain Ranges (Screenshot Aesthetics)
            const mtnMat = new THREE.MeshStandardMaterial({ color: 0x1e3a29, roughness: 0.95 });
            for (let m = 0; m < 16; m++) {
                const height = 400 + Math.random() * 600;
                const mtn = new THREE.Mesh(new THREE.ConeGeometry(500 + Math.random() * 300, height, 7), mtnMat);
                const ang = (m / 16) * Math.PI * 2;
                mtn.position.set(Math.cos(ang) * 4800, height / 2, Math.sin(ang) * 4800);
                mtn.userData.isMap = true;
                scene.add(mtn);
            }

            // 3. Double-Track Viaduct Bridge Deck & Concrete Railings
            const steps = 400;
            const pierMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.8 });
            const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9 });
            const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x334155 });

            for (let i = 0; i < steps; i++) {
                const u1 = i / steps;
                const u2 = (i + 1) / steps;
                const p1 = spline.getPointAt(u1);
                const p2 = spline.getPointAt(u2);
                const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
                const len = p1.distanceTo(p2);
                const tan = spline.getTangentAt(u1).normalize();
                const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

                // Solid Viaduct Deck
                const deck = new THREE.Mesh(new THREE.BoxGeometry(11.0, 1.2, len + 0.6), pierMat);
                deck.position.copy(mid);
                deck.position.y = p1.y - 0.6;
                deck.lookAt(p2);
                deck.userData.isMap = true;
                scene.add(deck);

                // Concrete Piers into Water
                if (i % 8 === 0) {
                    const pier = new THREE.Mesh(new THREE.BoxGeometry(3.5, 12, 3.5), pierMat);
                    pier.position.copy(p1);
                    pier.position.y = -1;
                    pier.userData.isMap = true;
                    scene.add(pier);

                    // Overhead Electric Catenary Masts
                    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 7.5), pierMat);
                    mast.position.copy(p1).addScaledVector(norm, 5.2);
                    mast.position.y = 8.5;
                    mast.userData.isMap = true;
                    scene.add(mast);
                }

                // Viaduct Safety Railings
                [-5.4, 5.4].forEach(offset => {
                    const railing = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.9, len + 0.4), pierMat);
                    railing.position.copy(mid).addScaledVector(norm, offset);
                    railing.position.y = p1.y + 0.45;
                    railing.lookAt(p2.clone().addScaledVector(norm, offset));
                    railing.userData.isMap = true;
                    scene.add(railing);
                });

                // 4 Parallel Steel Rails (Track 1 Player, Track 2 Oncoming AI)
                [-2.2, -0.8, 0.8, 2.2].forEach(rx => {
                    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.22, len + 0.4), railMat);
                    rail.position.set(rx, 0.35, 0);
                    const rg = new THREE.Group();
                    rg.position.copy(mid);
                    rg.lookAt(p2);
                    rg.add(rail);
                    rg.userData.isMap = true;
                    scene.add(rg);
                });
            }

            // 4. Stations & 3D Interactive Passengers
            const stationsList = STATIONS[currentMap];
            stationsList.forEach(st => {
                const u = st.dist / TRACK_LENGTH;
                const pos = spline.getPointAt(u);
                const tan = spline.getTangentAt(u).normalize();
                const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

                const stGroup = new THREE.Group();
                const platform = new THREE.Mesh(new THREE.BoxGeometry(5.5, 1.4, 180), new THREE.MeshStandardMaterial({ color: 0x475569 }));
                platform.position.set(0, 0.7, 0);
                stGroup.add(platform);

                // Waiting 3D Passengers
                for (let p = -70; p <= 70; p += 16) {
                    const pax = create3DPassenger();
                    pax.position.set(-1.0 + (Math.random() - 0.5) * 1.5, 1.4, p);
                    pax.rotation.y = Math.PI / 2;
                    stGroup.add(pax);
                    animatedPassengers.push(pax);
                }

                stGroup.position.copy(pos).addScaledVector(norm, -5.2);
                stGroup.lookAt(pos.clone().add(tan).addScaledVector(norm, -5.2));
                stGroup.userData.isMap = true;
                scene.add(stGroup);
            });
        }

        function create3DPassenger() {
            const p = new THREE.Group();
            const skin = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const shirt = new THREE.MeshLambertMaterial({ color: [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b][Math.floor(Math.random()*4)] });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.6, 0.3), shirt);
            torso.position.y = 0.6;
            p.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), skin);
            head.position.y = 1.05;
            p.add(head);

            return p;
        }

        function init3D() {
            const container = document.getElementById("game-wrapper");
            const w = container.clientWidth;
            const h = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x93c5fd);
            scene.fog = new THREE.FogExp2(0x93c5fd, 0.00032);

            camera = new THREE.PerspectiveCamera(56, w / h, 0.1, 8000);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.domElement.id = "webgl-canvas";
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.88);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xfffaed, 1.3);
            sun.position.set(400, 900, 350);
            scene.add(sun);

            buildTerritoryMap();
            buildPlayerTrain();
            buildOpposingTrain();
            buildCabCockpit();
            setupTouchSlider();

            window.addEventListener('resize', () => {
                const nw = container.clientWidth;
                const nh = container.clientHeight;
                camera.aspect = nw / nh;
                camera.updateProjectionMatrix();
                renderer.setSize(nw, nh);
            });
        }

        // iPad / Mobile Touch Throttle Slider Drag Logic
        function setupTouchSlider() {
            const track = document.getElementById("throttle-track");
            const handle = document.getElementById("throttle-handle");
            let isDragging = false;

            function updateSlider(clientY) {
                const rect = track.getBoundingClientRect();
                let ratio = 1 - ((clientY - rect.top) / rect.height);
                ratio = Math.max(0, Math.min(1, ratio));

                handle.style.bottom = `${ratio * (rect.height - 38)}px`;

                if (ratio > 0.55) {
                    train.powerNotch = (ratio - 0.55) / 0.45;
                    train.brakeNotch = 0;
                } else if (ratio < 0.45) {
                    train.brakeNotch = (0.45 - ratio) / 0.45;
                    train.powerNotch = 0;
                    if (train.brakeNotch > 0.3) playAirBrakeHiss();
                } else {
                    train.powerNotch = 0;
                    train.brakeNotch = 0;
                }
            }

            track.parentElement.addEventListener("touchstart", e => {
                isDragging = true;
                getAudioContext();
                initTractionAcoustics();
                updateSlider(e.touches[0].clientY);
            }, { passive: false });

            window.addEventListener("touchmove", e => {
                if (isDragging) updateSlider(e.touches[0].clientY);
            }, { passive: false });

            window.addEventListener("touchend", () => { isDragging = false; });
        }

        // Driver Controls
        function toggleMasterKey() {
            getAudioContext();
            initTractionAcoustics();
            train.masterKeyOn = !train.masterKeyOn;
            const btn = document.getElementById("btn-master");
            btn.classList.toggle("active", train.masterKeyOn);
            showDialogue(train.masterKeyOn ? "🔑 Master Key Inserted! Throttle Enabled." : "🛑 Desk Isolated.");
        }

        function cycleReverser() {
            if (!train.masterKeyOn) return showDialogue("⚠️ Insert Master Key first!");
            if (Math.abs(train.velocity) > 0.5) return showDialogue("⚠️ Full stop required to reverse!");

            train.reverser = train.reverser === 1 ? -1 : 1;
            document.getElementById("btn-reverser").innerHTML = `🔄<br>${train.reverser === 1 ? 'FWD' : 'REV'}`;
            showDialogue(`🔄 Reverser: ${train.reverser === 1 ? 'FORWARD' : 'REVERSE'}`);
        }

        function toggleDoors() {
            if (Math.abs(train.velocity) > 0.5) return showDialogue("⚠️ Train must be halted to open doors!");
            train.doorsOpen = !train.doorsOpen;
            document.getElementById("btn-doors").classList.toggle("active", train.doorsOpen);

            if (train.doorsOpen) {
                showDialogue("🚪 Passenger Doors Open! Fares Collecting...");
                spawnFarePopups(6);
                driverFares += 350;
                document.getElementById("cash-count").innerText = driverFares.toLocaleString();
            } else {
                showDialogue("🚪 Doors Closed & Interlocked.");
            }
        }

        function applyEmergencyBrake() {
            train.powerNotch = 0;
            train.brakeNotch = 1.0;
            playAirBrakeHiss();
            document.getElementById("throttle-handle").style.bottom = "0px";
            showDialogue("🛑 EMERGENCY BRAKE APPLIED!");
        }

        function soundHorn() { playDualAirHorn(); }

        function toggleWiper() {
            wiperActive = !wiperActive;
            document.getElementById("btn-wiper").classList.toggle("active", wiperActive);
            showDialogue(wiperActive ? "🌧️ Wipers Active" : "Wipers Off");
        }

        function cycleCamera() {
            cameraMode = (cameraMode + 1) % 4;
            const names = ["CAB COCKPIT", "NOSE BUFFER", "3RD PERSON CHASE", "WINDOW VIEW"];
            showDialogue(`🎥 ${names[cameraMode]}`);
        }

        function acknowledgeAWS() {
            showDialogue("⚠️ AWS Acknowledged.");
        }

        function selectTrain(name) {
            currentTrain = name;
            buildPlayerTrain();
            toggleModal("depot-modal", false);
            showDialogue(`🚆 Selected ${name}`);
        }

        function selectMap(code) {
            currentMap = code;
            train.distance = 0;
            train.velocity = 0;
            buildTerritoryMap();
            buildPlayerTrain();
            buildOpposingTrain();
            toggleModal("map-modal", false);
            showDialogue(`🗺️ Loaded Map: ${code}`);
        }

        // Keyboard Binds
        window.addEventListener("keydown", e => {
            const c = e.code;
            if (["KeyW","KeyS","KeyA","KeyD","KeyK","KeyR","KeyT","KeyH","KeyC","KeyV","Space","ArrowUp","ArrowDown"].includes(c)) e.preventDefault();
            if (c === "KeyW" || c === "ArrowUp") {
                train.powerNotch = Math.min(1.0, train.powerNotch + 0.1);
                train.brakeNotch = 0;
            }
            if (c === "KeyS" || c === "ArrowDown") {
                train.brakeNotch = Math.min(1.0, train.brakeNotch + 0.15);
                train.powerNotch = 0;
                if (train.brakeNotch > 0.4) playAirBrakeHiss();
            }
            if (c === "KeyK") toggleMasterKey();
            if (c === "KeyR") cycleReverser();
            if (c === "KeyT") toggleDoors();
            if (c === "KeyH" || c === "Space") soundHorn();
            if (c === "KeyV") toggleWiper();
            if (c === "KeyC") cycleCamera();
        });

        // Main Loop
        function updatePhysics(dt) {
            if (!trainRig) return;

            const currentSpeed = Math.abs(train.velocity);
            const accelForce = (train.powerNotch * train.tractionForce - train.brakeNotch * 240000) * train.reverser;
            const resistance = 0.0028 * train.weight * 9.81 + (0.00045 * currentSpeed * currentSpeed);

            let accel = (accelForce - Math.sign(train.velocity) * resistance) / train.weight;
            train.velocity += accel * dt;

            if (train.powerNotch === 0 && train.brakeNotch > 0.2 && currentSpeed < 0.25) {
                train.velocity = 0;
            }

            train.distance += train.velocity * dt;
            train.distance = Math.max(0, Math.min(TRACK_LENGTH, train.distance));
            train.speedKMPH = Math.round(Math.abs(train.velocity) * 3.6);

            // Rail Joint Sound Trigger
            if (Math.abs(train.distance - lastJointDistance) > 30 && currentSpeed > 3) {
                lastJointDistance = train.distance;
                playRailJointClatter();
            }

            // Move Player Train on Track
            const u = Math.min(1.0, Math.max(0.0, train.distance / TRACK_LENGTH));
            const pos = spline.getPointAt(u);
            const tan = spline.getTangentAt(u).normalize();
            const norm = new THREE.Vector3(-tan.z, 0, tan.x).normalize();

            trainRig.position.copy(pos).addScaledVector(norm, 1.5);
            trainRig.lookAt(pos.clone().add(tan).addScaledVector(norm, 1.5));

            // Move Opposing AI Train (On Track 2)
            if (opposingTrainRig) {
                opposingAI.distance -= opposingAI.speed * dt;
                if (opposingAI.distance < 0) opposingAI.distance = TRACK_LENGTH;

                const aiU = Math.min(1.0, Math.max(0.0, opposingAI.distance / TRACK_LENGTH));
                const aiPos = spline.getPointAt(aiU);
                const aiTan = spline.getTangentAt(aiU).normalize();

                opposingTrainRig.position.copy(aiPos).addScaledVector(norm, -1.5);
                opposingTrainRig.lookAt(aiPos.clone().sub(aiTan).addScaledVector(norm, -1.5));

                if (Math.abs(train.distance - opposingAI.distance) < 90 && Math.abs(train.distance - opposingAI.distance) > 70) {
                    playDualAirHorn();
                }
            }

            // Animate Wipers & Speed Needle
            if (wiperActive && wiperMeshL && wiperMeshR) {
                const ang = Math.sin(performance.now() * 0.008) * 0.7;
                wiperMeshL.rotation.z = ang;
                wiperMeshR.rotation.z = ang;
            }
            if (speedNeedle) {
                speedNeedle.rotation.z = -(train.speedKMPH / train.maxSpeedKMPH) * Math.PI * 1.2;
            }

            // Update Engine Pitch
            updateMotorSound(currentSpeed / 40, train.powerNotch);

            // Update HUD
            document.getElementById("speed-display").innerText = train.speedKMPH;
            const currentStations = STATIONS[currentMap];
            const nextSt = currentStations.find(s => s.dist > train.distance - 20) || currentStations[currentStations.length - 1];
            document.getElementById("station-name-hud").innerText = nextSt.name;
            document.getElementById("station-dist-hud").innerText = `${Math.max(0, Math.round(nextSt.dist - train.distance))} M`;
            document.getElementById("limit-display").innerText = `LIMIT: ${nextSt.limit}`;
        }

        function updateCamera() {
            if (!trainRig) return;
            trainRig.updateMatrixWorld(true);

            if (cameraMode === 0) {
                // 1. Realistic Cab Interior View (Cockpit frame visible)
                if (cabInteriorGroup) cabInteriorGroup.visible = true;
                const eye = trainRig.localToWorld(new THREE.Vector3(0.45, 2.55, 9.4));
                const target = trainRig.localToWorld(new THREE.Vector3(0.45, 2.55, 80.0));
                camera.position.copy(eye);
                camera.lookAt(target);
            } else if (cameraMode === 1) {
                // 2. Buffer Nose Cam
                if (cabInteriorGroup) cabInteriorGroup.visible = false;
                const eye = trainRig.localToWorld(new THREE.Vector3(0, 1.8, 12.5));
                const target = trainRig.localToWorld(new THREE.Vector3(0, 1.8, 80.0));
                camera.position.copy(eye);
                camera.lookAt(target);
            } else if (cameraMode === 2) {
                // 3. 3rd Person Follow Chase
                if (cabInteriorGroup) cabInteriorGroup.visible = false;
                const eye = trainRig.localToWorld(new THREE.Vector3(0, 7.5, -34.0));
                const target = trainRig.localToWorld(new THREE.Vector3(0, 2.0, 10.0));
                camera.position.lerp(eye, 0.18);
                camera.lookAt(target);
            } else {
                // 4. Passenger Window View
                if (cabInteriorGroup) cabInteriorGroup.visible = false;
                const eye = trainRig.localToWorld(new THREE.Vector3(-1.3, 2.2, -4.0));
                const target = trainRig.localToWorld(new THREE.Vector3(-30.0, 2.0, -4.0));
                camera.position.copy(eye);
                camera.lookAt(target);
            }
        }

        let lastTime = performance.now();
        function loop(now) {
            requestAnimationFrame(loop);
            const dt = Math.min((now - lastTime) / 1000, 0.02);
            lastTime = now;

            updatePhysics(dt);
            updateCamera();
            renderer.render(scene, camera);
        }

        document.addEventListener("DOMContentLoaded", () => {
            init3D();
            requestAnimationFrame(loop);
        });
    </script>
