<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Nights in the Forest</title>
    <script src="arcade.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --primary: #00f3ff; --accent: #ff007f; --bg: #0b0f19; --card: #151e2e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; user-select: none; }
        
        header { width: 100%; max-width: 950px; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px 20px; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 8px; box-sizing: border-box; }
        .stats { font-size: 1.1rem; font-weight: bold; color: #facc15; }
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; }
        
        #game-container { width: 100%; max-width: 950px; height: 520px; border: 3px solid var(--primary); border-radius: 12px; box-shadow: 0 0 25px rgba(0, 243, 255, 0.2); position: relative; overflow: hidden; }
        canvas { width: 100% !important; height: 100% !important; display: block; }
        
        /* Tactical Survival HUD */
        .hud-overlay { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
        .hud-box { background: rgba(15, 23, 42, 0.9); border: 2px solid var(--primary); border-radius: 8px; padding: 8px 12px; text-align: left; font-size: 0.85rem; }
        .hud-bar { height: 8px; width: 90px; background: #334155; border-radius: 4px; overflow: hidden; margin-top: 3px; }
        .hud-fill { height: 100%; width: 100%; transition: width 0.2s; }
        
        #action-prompt { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(0, 243, 255, 0.95); color: #000; font-weight: bold; padding: 10px 22px; border-radius: 20px; font-size: 1rem; display: none; box-shadow: 0 0 15px #00f3ff; }
        
        #dialogue-box { position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.95); border: 2px solid #facc15; color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 0.95rem; max-width: 600px; display: none; }
        
        .controls-info { margin-top: 8px; font-size: 0.85rem; color: #94a3b8; max-width: 950px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div>🌲 <strong>99 NIGHTS</strong> | Night: <span id="night-count" style="color:var(--accent); font-size:1.2rem;">0</span> / 99</div>
        <div class="stats">🪙 Gold: <span id="coin-count">0</span></div>
    </header>

    <div id="game-container">
        <div class="hud-overlay">
            <div class="hud-box">
                <div>❤️ HP <div class="hud-bar"><div id="hp-fill" class="hud-fill" style="background:#ef4444;"></div></div></div>
                <div style="margin-top:4px;">🍖 Hunger <div class="hud-bar"><div id="food-fill" class="hud-fill" style="background:#facc15;"></div></div></div>
            </div>
            
            <div class="hud-box">
                <div>🔥 Fire Fuel: <span id="fuel-text" style="color:#fb923c;">100%</span></div>
                <div>🎒 Sack: <span id="sack-count">0</span>/<span id="sack-cap">15</span></div>
                <div>🪵 <span id="wood-val">0</span> | ⚙️ <span id="scrap-val">0</span> | 🌸 <span id="flower-val">0</span> | 🥩 <span id="meat-val">2</span></div>
            </div>

            <div class="hud-box" style="text-align: right;">
                <div id="cycle-text" style="color:#facc15; font-weight:bold;">☀️ DAY TIME</div>
                <div id="cycle-timer" style="color:#94a3b8; font-size:0.8rem;">Night in: 35s</div>
                <div style="margin-top:4px;">👶 Rescued: <span id="kids-count" style="color:#38bdf8; font-weight:bold;">0/4</span></div>
            </div>
        </div>

        <div id="dialogue-box"></div>
        <div id="action-prompt">Press [E] to Interact</div>
    </div>

    <div class="controls-info">
        <strong>WASD / Arrows:</strong> Move & Turn | <strong>E / SPACE:</strong> Chop Trees, Grind Scrap, Feed Fire, Rescue Kids & Trade | <strong>F:</strong> Eat Meat
    </div>

    <script>
        let scene, camera, renderer, playerGroup, campfireLight, deerMesh;
        let gameActive = true;
        
        // Game & Resource Stats
        let night = 0;
        let timeOfDay = 0; // 0-40 Day, 40-45 Dusk, 45-80 Night
        let hp = 100, hunger = 100, fireFuel = 100;
        let wood = 0, scrap = 0, flowers = 0, meat = 2, gold = 0;
        let sackCap = 15;
        let axeLevel = 1;
        let deerActive = false;

        const player = { x: 0, z: 8, rot: 0, speed: 0.38 };
        const keys = { w: false, s: false, a: false, d: false };

        // Entities
        let trees = [];
        let scraps = [];
        let flowerNodes = [];
        let npcs = {};
        let caves = [];
        let missingKids = [];

        function updateWallet() {
            gold = parseInt(localStorage.getItem('arcade_coins')) || 0;
            document.getElementById('coin-count').innerText = gold.toLocaleString();
        }

        function addCoins(amt) {
            gold += amt;
            localStorage.setItem('arcade_coins', gold);
            updateWallet();
        }

        window.addEventListener("keydown", e => {
            if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyW","KeyA","KeyS","KeyD","Space","KeyE","KeyF"].includes(e.code)) {
                e.preventDefault();
            }
            if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.w = true;
            if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") keys.s = true;
            if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") keys.a = true;
            if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") keys.d = true;
            if (e.key === "e" || e.key === "E" || e.key === " " || e.code === "Space") handleInteraction();
            if (e.key === "f" || e.key === "F") eatFood();
        }, { passive: false });

        window.addEventListener("keyup", e => {
            if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.w = false;
            if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") keys.s = false;
            if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") keys.a = false;
            if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") keys.d = false;
        });

        function init3D() {
            const container = document.getElementById("game-container");
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x132213);
            scene.fog = new THREE.FogExp2(0x132213, 0.025);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // Lighting
            hemiLight = new THREE.HemisphereLight(0xdff0d8, 0x142614, 0.7);
            scene.add(hemiLight);

            sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
            sunLight.position.set(40, 80, 40);
            scene.add(sunLight);

            // Ground
            const groundGeo = new THREE.PlaneGeometry(350, 350);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x1e381e });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            buildCampsite();
            buildTheDeer();
            buildNPCs();
            buildLockedCavesAndKids();
            spawnForestResources();
            buildPlayer();
        }

        function buildCampsite() {
            // Campfire Pit & Light
            const pitGeo = new THREE.CylinderGeometry(1.6, 1.8, 0.4, 8);
            const pitMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
            const pit = new THREE.Mesh(pitGeo, pitMat);
            pit.position.set(0, 0.2, 0);
            scene.add(pit);

            campfireLight = new THREE.PointLight(0xff6600, 2.5, 30);
            campfireLight.position.set(0, 1.8, 0);
            scene.add(campfireLight);

            // Crafting Bench
            const benchGeo = new THREE.BoxGeometry(3, 1.4, 1.8);
            const benchMat = new THREE.MeshLambertMaterial({ color: 0x6b4423 });
            const bench = new THREE.Mesh(benchGeo, benchMat);
            bench.position.set(-6, 0.7, -4);
            scene.add(bench);

            // Scrap Grinder
            const grinderGeo = new THREE.CylinderGeometry(1.2, 1.4, 2, 8);
            const grinderMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
            const grinder = new THREE.Mesh(grinderGeo, grinderMat);
            grinder.position.set(6, 1, -4);
            scene.add(grinder);
        }

        function buildTheDeer() {
            // Unyielding Stalker Entity (The Deer)
            const deerGroup = new THREE.Group();
            
            // Slender body
            const bodyGeo = new THREE.BoxGeometry(1.8, 4, 1.2);
            const bodyMat = new THREE.MeshLambertMaterial({ color: 0x050505 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 3.5;
            deerGroup.add(body);

            // Antlered Head
            const headGeo = new THREE.BoxGeometry(1.2, 1.2, 1.4);
            const head = new THREE.Mesh(headGeo, bodyMat);
            head.position.set(0, 5.8, 0.4);
            deerGroup.add(head);

            // Glowing Red Eyes
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), eyeMat);
            eyeL.position.set(-0.35, 6, 1.1);
            const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), eyeMat);
            eyeR.position.set(0.35, 6, 1.1);
            deerGroup.add(eyeL);
            deerGroup.add(eyeR);

            // Antlers
            const antlerMat = new THREE.MeshLambertMaterial({ color: 0x221105 });
            const antL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 0.2), antlerMat);
            antL.position.set(-0.8, 7.2, 0.2);
            antL.rotation.z = -0.4;
            const antR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 0.2), antlerMat);
            antR.position.set(0.8, 7.2, 0.2);
            antR.rotation.z = 0.4;
            deerGroup.add(antL);
            deerGroup.add(antR);

            deerGroup.position.set(0, 0, -80);
            deerGroup.visible = false;
            scene.add(deerGroup);
            deerMesh = deerGroup;
        }

        function buildNPCs() {
            // 1. Furniture Trader & Horse with Wagon
            const furnGroup = new THREE.Group();
            const traderBody = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.2, 1), new THREE.MeshLambertMaterial({ color: 0x1d4ed8 })); // Denim overalls
            traderBody.position.y = 1.1;
            furnGroup.add(traderBody);
            // Straw hat
            const hat = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.3, 8), new THREE.MeshLambertMaterial({ color: 0xfacc15 }));
            hat.position.y = 2.4;
            furnGroup.add(hat);
            // Wooden Cart Wagon
            const wagon = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 5), new THREE.MeshLambertMaterial({ color: 0x78350f }));
            wagon.position.set(-4, 1, 0);
            furnGroup.add(wagon);
            // Horse
            const horse = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.5, 4.5), new THREE.MeshLambertMaterial({ color: 0x543d2b }));
            horse.position.set(-8, 1.3, 0);
            furnGroup.add(horse);
            furnGroup.position.set(-15, 0, 8);
            scene.add(furnGroup);
            npcs.furniture = { group: furnGroup, pos: new THREE.Vector2(-15, 8) };

            // 2. Blacksmith / Tool Trader (Soot-streaked, leather apron)
            const smithGroup = new THREE.Group();
            const smithBody = new THREE.Mesh(new THREE.BoxGeometry(1.6, 2.4, 1.2), new THREE.MeshLambertMaterial({ color: 0x292524 }));
            smithBody.position.y = 1.2;
            smithGroup.add(smithBody);
            smithGroup.position.set(12, 0, 6);
            scene.add(smithGroup);
            npcs.blacksmith = { group: smithGroup, pos: new THREE.Vector2(12, 6) };

            // 3. Fairy & Fairy House (Glowing sprite near woodland edge)
            const fairyGroup = new THREE.Group();
            const fairyBody = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
            fairyBody.position.y = 1.8;
            fairyGroup.add(fairyBody);
            const fairyLight = new THREE.PointLight(0x38bdf8, 1.5, 10);
            fairyLight.position.y = 1.8;
            fairyGroup.add(fairyLight);
            // Tiny fairy house
            const fHouse = new THREE.Mesh(new THREE.ConeGeometry(1.8, 2.8, 6), new THREE.MeshLambertMaterial({ color: 0xbe185d }));
            fHouse.position.set(2.5, 1.4, 0);
            fairyGroup.add(fHouse);
            fairyGroup.position.set(22, 0, -20);
            scene.add(fairyGroup);
            npcs.fairy = { group: fairyGroup, pos: new THREE.Vector2(22, -20) };

            // 4. Pelt Trader (Spawns Night 2+ near campfire)
            const peltGroup = new THREE.Group();
            const peltBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.2, 1.4), new THREE.MeshLambertMaterial({ color: 0x713f12 }));
            peltBody.position.y = 1.1;
            peltGroup.add(peltBody);
            peltGroup.position.set(-6, 0, 4);
            peltGroup.visible = false;
            scene.add(peltGroup);
            npcs.pelt = { group: peltGroup, pos: new THREE.Vector2(-6, 4) };
        }

        function buildLockedCavesAndKids() {
            const caveConfigs = [
                { name: "Dino Kid", color: 0xef4444, x: -75, z: -65, kidColor: 0x22c55e }, // Red Cave / Green Dino
                { name: "Kraken Kid", color: 0x3b82f6, x: 75, z: -70, kidColor: 0x0284c7 },  // Blue Cave
                { name: "Squid Kid", color: 0xeab308, x: -80, z: 65, kidColor: 0xf59e0b },   // Yellow Cave
                { name: "Koala Kid", color: 0x64748b, x: 80, z: 70, kidColor: 0x94a3b8 }     // Grey Cave
            ];

            caveConfigs.forEach(cfg => {
                // Cave Shell
                const caveGeo = new THREE.ConeGeometry(8, 8, 5);
                const caveMat = new THREE.MeshLambertMaterial({ color: cfg.color });
                const caveMesh = new THREE.Mesh(caveGeo, caveMat);
                caveMesh.position.set(cfg.x, 4, cfg.z);
                scene.add(caveMesh);

                // Sobbing Kid inside
                const kidMat = new THREE.MeshLambertMaterial({ color: cfg.kidColor });
                const kidMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.2, 6), kidMat);
                kidMesh.position.set(cfg.x, 0.6, cfg.z + 2);
                scene.add(kidMesh);

                missingKids.push({
                    name: cfg.name,
                    mesh: kidMesh,
                    x: cfg.x,
                    z: cfg.z + 2,
                    rescued: false,
                    inSack: false
                });
            });
        }

        function spawnForestResources() {
            // Procedural Trees
            for (let i = 0; i < 75; i++) {
                let x = (Math.random() - 0.5) * 260;
                let z = (Math.random() - 0.5) * 260;
                if (Math.hypot(x, z) < 18) continue; // Camp clearing

                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 4, 6), new THREE.MeshLambertMaterial({ color: 0x3d2314 }));
                trunk.position.set(x, 2, z);
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.8, 6, 6), new THREE.MeshLambertMaterial({ color: 0x164e23 }));
                leaves.position.set(x, 6, z);
                scene.add(trunk);
                scene.add(leaves);
                trees.push({ trunk, leaves, x, z, hp: 3 });
            }

            // Scrap Metal piles
            for (let i = 0; i < 20; i++) {
                let x = (Math.random() - 0.5) * 240;
                let z = (Math.random() - 0.5) * 240;
                if (Math.hypot(x, z) < 15) continue;
                const scrapMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 1.2), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
                scrapMesh.position.set(x, 0.4, z);
                scene.add(scrapMesh);
                scraps.push({ mesh: scrapMesh, x, z, active: true });
            }

            // Forest Flowers
            for (let i = 0; i < 25; i++) {
                let x = (Math.random() - 0.5) * 230;
                let z = (Math.random() - 0.5) * 230;
                if (Math.hypot(x, z) < 15) continue;
                const flower = new THREE.Mesh(new THREE.SphereGeometry(0.4, 6, 6), new THREE.MeshBasicMaterial({ color: 0xf43f5e }));
                flower.position.set(x, 0.4, z);
                scene.add(flower);
                flowerNodes.push({ mesh: flower, x, z, active: true });
            }
        }

        function buildPlayer() {
            playerGroup = new THREE.Group();
            
            // Blocky Character Body
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1.8, 8), new THREE.MeshLambertMaterial({ color: 0x00f3ff }));
            body.position.y = 0.9;
            playerGroup.add(body);

            // Head
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
            head.position.y = 2.1;
            playerGroup.add(head);

            // Starting Axe in hand
            const axe = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1, 0.4), new THREE.MeshLambertMaterial({ color: 0x94a3b8 }));
            axe.position.set(0.6, 1.2, 0.4);
            playerGroup.add(axe);

            playerGroup.position.set(player.x, 0, player.z);
            scene.add(playerGroup);
        }

        function showDialogue(text) {
            const d = document.getElementById("dialogue-box");
            d.innerText = text;
            d.style.display = "block";
            setTimeout(() => { d.style.display = "none"; }, 3500);
        }

        function handleInteraction() {
            const pVec = new THREE.Vector2(player.x, player.z);

            // 1. Campfire Refuel
            if (pVec.distanceTo(new THREE.Vector2(0, 0)) < 4.5) {
                if (wood > 0) {
                    wood--;
                    fireFuel = Math.min(100, fireFuel + 25);
                    showDialogue("🔥 Fed 1 Wood to Campfire! Fuel restored.");
                    return;
                }
            }

            // 2. Scrap Grinder
            if (pVec.distanceTo(new THREE.Vector2(6, -4)) < 3.5) {
                if (scrap > 0) {
                    let coinsEarned = scrap * 5;
                    addCoins(coinsEarned);
                    showDialogue(`⚙️ Ground ${scrap} Scrap into +${coinsEarned} Gold Coins!`);
                    scrap = 0;
                    return;
                }
            }

            // 3. Fairy Trading
            if (pVec.distanceTo(npcs.fairy.pos) < 4) {
                if (flowers >= 3) {
                    flowers -= 3;
                    addCoins(10);
                    meat += 2;
                    showDialogue("🧚 Fairy: 'Thank you for the sweet flowers!' Received seeds & +10 Gold!");
                } else {
                    showDialogue("🧚 Fairy: 'Bring me 3 forest flowers to trade!'");
                }
                return;
            }

            // 4. Blacksmith Tool Upgrades
            if (pVec.distanceTo(npcs.blacksmith.pos) < 4) {
                if (gold >= 30 && axeLevel === 1) {
                    addCoins(-30);
                    axeLevel = 2;
                    showDialogue("⚒️ Blacksmith: 'Upgraded your Axe to Steel! Trees chop 2x faster!'");
                } else {
                    showDialogue("⚒️ Blacksmith: 'Need 30 Gold Coins to forge a Steel Axe upgrade.'");
                }
                return;
            }

            // 5. Furniture Trader Sack Upgrade
            if (pVec.distanceTo(npcs.furniture.pos) < 4) {
                if (gold >= 25 && sackCap === 15) {
                    addCoins(-25);
                    sackCap = 30;
                    document.getElementById("sack-cap").innerText = sackCap;
                    showDialogue("🤠 Furniture Trader: 'Upgraded your Sack Capacity to 30 items!'");
                } else {
                    showDialogue("🤠 Furniture Trader: 'Need 25 Gold Coins for an expanded leather sack.'");
                }
                return;
            }

            // 6. Missing Children Rescue & Deposit
            for (let kid of missingKids) {
                if (!kid.rescued && !kid.inSack && pVec.distanceTo(new THREE.Vector2(kid.x, kid.z)) < 4.5) {
                    kid.inSack = true;
                    kid.mesh.visible = false;
                    showDialogue(`👶 Rescued ${kid.name} into your sack! Bring them back to Campfire!`);
                    return;
                }
            }

            // Returning rescued kid to campfire
            if (pVec.distanceTo(new THREE.Vector2(0, 0)) < 5) {
                missingKids.forEach(kid => {
                    if (kid.inSack && !kid.rescued) {
                        kid.inSack = false;
                        kid.rescued = true;
                        addCoins(50);
                        let rescuedTotal = missingKids.filter(k => k.rescued).length;
                        document.getElementById("kids-count").innerText = `${rescuedTotal}/4`;
                        showDialogue(`🎉 ${kid.name} safely returned to camp! +50 Gold Coins!`);
                    }
                });
            }

            // 7. Resource Harvesting (Trees, Scrap, Flowers)
            let currentSack = wood + scrap + flowers;
            if (currentSack < sackCap) {
                // Chop Tree
                for (let i = 0; i < trees.length; i++) {
                    let t = trees[i];
                    if (pVec.distanceTo(new THREE.Vector2(t.x, t.z)) < 4) {
                        t.hp -= (axeLevel === 2 ? 2 : 1);
                        if (t.hp <= 0) {
                            scene.remove(t.trunk);
                            scene.remove(t.leaves);
                            trees.splice(i, 1);
                            wood += 2;
                        }
                        return;
                    }
                }

                // Gather Scrap
                scraps.forEach(s => {
                    if (s.active && pVec.distanceTo(new THREE.Vector2(s.x, s.z)) < 3) {
                        s.active = false;
                        scene.remove(s.mesh);
                        scrap++;
                    }
                });

                // Gather Flower
                flowerNodes.forEach(f => {
                    if (f.active && pVec.distanceTo(new THREE.Vector2(f.x, f.z)) < 3) {
                        f.active = false;
                        scene.remove(f.mesh);
                        flowers++;
                    }
                });
            }
        }

        function eatFood() {
            if (meat > 0 && hunger < 100) {
                meat--;
                hunger = Math.min(100, hunger + 30);
                hp = Math.min(100, hp + 20);
                showDialogue("🍖 Ate cooked meat (+30 Hunger, +20 HP)");
            }
        }

        function updateEnvironment() {
            timeOfDay += 0.05;
            let cycleText = document.getElementById("cycle-text");
            let cycleTimer = document.getElementById("cycle-timer");

            // Day / Night Cycle Phases
            if (timeOfDay < 40) { // Day
                cycleText.innerText = "☀️ DAY TIME";
                cycleText.style.color = "#facc15";
                cycleTimer.innerText = `Night in: ${Math.round(40 - timeOfDay)}s`;
                scene.background.setHex(0x132213);
                scene.fog.color.setHex(0x132213);
                sunLight.intensity = 0.8;
                deerMesh.visible = false;
                deerActive = false;
            } else if (timeOfDay < 45) { // Dusk
                cycleText.innerText = "🌅 DUSK (Return to Camp!)";
                cycleText.style.color = "#fb923c";
                cycleTimer.innerText = `Night in: ${Math.round(45 - timeOfDay)}s`;
                scene.background.setHex(0x281308);
                scene.fog.color.setHex(0x281308);
                sunLight.intensity = 0.25;
            } else if (timeOfDay < 85) { // Night - The Deer Awakens
                cycleText.innerText = "🦌 THE DEER IS HUNTING";
                cycleText.style.color = "#ff007f";
                cycleTimer.innerText = `Dawn in: ${Math.round(85 - timeOfDay)}s`;
                scene.background.setHex(0x020509);
                scene.fog.color.setHex(0x020509);
                sunLight.intensity = 0.02;

                deerMesh.visible = true;
                deerActive = true;
            } else {
                // Night Survived
                timeOfDay = 0;
                night++;
                addCoins(15);
                document.getElementById("night-count").innerText = night;
                
                // Pelt trader appears night 2+
                if (night >= 2) npcs.pelt.group.visible = true;

                if (night >= 99) {
                    gameActive = false;
                    alert("🏆 CONGRATULATIONS! You survived all 99 Nights in the Forest!");
                }
            }

            // Campfire depletion
            if (fireFuel > 0) fireFuel -= 0.035;
            campfireLight.intensity = (fireFuel / 100) * 3;
            document.getElementById("fuel-text").innerText = `${Math.round(fireFuel)}%`;

            // Hunger depletion
            hunger -= 0.015;
            if (hunger <= 0) { hunger = 0; hp -= 0.06; }

            // UI Refresh
            document.getElementById("hp-fill").style.width = `${Math.max(0, hp)}%`;
            document.getElementById("food-fill").style.width = `${Math.max(0, hunger)}%`;
            document.getElementById("wood-val").innerText = wood;
            document.getElementById("scrap-val").innerText = scrap;
            document.getElementById("flower-val").innerText = flowers;
            document.getElementById("meat-val").innerText = meat;
            document.getElementById("sack-count").innerText = (wood + scrap + flowers);

            if (hp <= 0 && gameActive) {
                gameActive = false;
                alert(`💀 THE DEER CAUGHT YOU. Survived ${night} Nights.`);
                location.reload();
            }
        }

        function updateTheDeerStalker() {
            if (!deerActive) return;

            const pPos = new THREE.Vector3(player.x, 0, player.z);
            const distToFire = Math.hypot(player.x, player.z);

            // If player is outside campfire light, The Deer stalks rapidly
            if (distToFire > 9 || fireFuel <= 5) {
                deerMesh.lookAt(pPos);
                deerMesh.translateZ(0.32); // Lethal stalker speed

                let distToDeer = deerMesh.position.distanceTo(pPos);
                if (distToDeer < 3.2) {
                    hp -= 1.2; // Massive damage from The Deer
                    showDialogue("⚠️ THE DEER IS ATTACKING! RUN TO THE CAMPFIRE!");
                }
            } else {
                // Campfire light repels The Deer
                deerMesh.lookAt(new THREE.Vector3(0, 0, 0));
                deerMesh.translateZ(-0.2);
            }
        }

        function update() {
            if (!gameActive) return;

            // Movement & Camera
            if (keys.a) player.rot += 0.04;
            if (keys.d) player.rot -= 0.04;

            if (keys.w) {
                player.x -= Math.sin(player.rot) * player.speed;
                player.z -= Math.cos(player.rot) * player.speed;
            }
            if (keys.s) {
                player.x += Math.sin(player.rot) * (player.speed * 0.6);
                player.z += Math.cos(player.rot) * (player.speed * 0.6);
            }

            playerGroup.position.set(player.x, 0, player.z);
            playerGroup.rotation.y = player.rot;

            camera.position.x = player.x + Math.sin(player.rot) * 9;
            camera.position.y = 5.5;
            camera.position.z = player.z + Math.cos(player.rot) * 9;
            camera.lookAt(player.x, 1.8, player.z);

            // Action Prompt Detector
            const pVec = new THREE.Vector2(player.x, player.z);
            let prompt = document.getElementById("action-prompt");
            let near = false;

            if (pVec.distanceTo(new THREE.Vector2(0, 0)) < 4.5 && wood > 0) { prompt.innerText = "[E] Feed Wood to Fire"; near = true; }
            else if (pVec.distanceTo(new THREE.Vector2(6, -4)) < 3.5 && scrap > 0) { prompt.innerText = "[E] Grind Scrap into Gold"; near = true; }
            else if (pVec.distanceTo(npcs.fairy.pos) < 4) { prompt.innerText = "[E] Trade with Fairy"; near = true; }
            else if (pVec.distanceTo(npcs.blacksmith.pos) < 4) { prompt.innerText = "[E] Blacksmith: Upgrade Axe (30 Gold)"; near = true; }
            else if (pVec.distanceTo(npcs.furniture.pos) < 4) { prompt.innerText = "[E] Furniture Trader: Upgrade Sack (25 Gold)"; near = true; }
            else {
                for (let kid of missingKids) {
                    if (!kid.rescued && !kid.inSack && pVec.distanceTo(new THREE.Vector2(kid.x, kid.z)) < 4.5) {
                        prompt.innerText = `[E] Rescue ${kid.name} into Sack!`;
                        near = true;
                        break;
                    }
                }
            }

            prompt.style.display = near ? "block" : "none";

            updateEnvironment();
            updateTheDeerStalker();
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        document.addEventListener("DOMContentLoaded", () => {
            init3D();
            updateWallet();
            animate();
        });
    </script>
</body>
</html>
