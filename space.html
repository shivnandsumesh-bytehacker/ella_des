<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Invaders - Arcade Edition</title>
    <script src="arcade.js"></script>
    <style>
        :root { --primary: #00f3ff; --accent: #ff007f; --bg: #0f172a; --card: #1e293b; --gold: #facc15; }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box; 
            touch-action: none; 
            overflow: hidden; 
        }
        
        header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 8px 16px; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 6px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,243,255,0.2); flex-shrink: 0; }
        .stats { font-size: 1rem; font-weight: bold; color: var(--gold); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; max-width: 600px; margin-bottom: 6px; font-weight: bold; font-size: 1.1rem; flex-shrink: 0; }
        .player-hud { display: flex; flex-direction: column; text-align: left; }
        .player-hud.right { text-align: right; }
        .hud-name { font-size: 0.8rem; text-transform: uppercase; margin-bottom: 2px; }
        .hud-score { font-family: monospace; font-size: 1.2rem; }
        
        /* Rigid Flex Container ensures the canvas shrinks on iPads */
        #game-container { position: relative; max-width: 100%; width: 100%; display: flex; justify-content: center; align-items: center; flex: 1 1 0; min-height: 0; }
        
        canvas { background: #020617; border: 3px solid var(--primary); border-radius: 12px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); max-width: 100%; max-height: 100%; aspect-ratio: 540 / 600; display: block; object-fit: contain; }
        
        #boss-hp-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 70%; height: 12px; background: rgba(0,0,0,0.8); border: 2px solid var(--accent); border-radius: 6px; display: none; overflow: hidden; z-index: 5;}
        #boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ef4444, var(--accent)); transition: width 0.1s; }

        #announcement { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 2rem; font-weight: 900; color: var(--gold); text-shadow: 0 4px 10px #000; pointer-events: none; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10; width: 100%; text-align: center; letter-spacing: 1px;}
        #cutscene-warning { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.2rem; font-weight: 900; color: #ef4444; text-shadow: 0 0 15px #ef4444; pointer-events: none; z-index: 10; width: 100%; text-align: center; display: none; animation: flashWarning 0.5s infinite; }

        @keyframes flashWarning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .touch-controls { width: 100%; max-width: 500px; display: flex; justify-content: space-between; margin-top: 8px; gap: 10px; flex-shrink: 0; }
        .touch-group { display: flex; gap: 10px; }
        .ctrl-btn { width: 60px; height: 60px; background: rgba(30, 41, 59, 0.9); border: 2px solid var(--primary); border-radius: 12px; color: white; font-size: 1.5rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: transform 0.1s; }
        .ctrl-btn:active { background: var(--primary); color: #000; transform: scale(0.92); }
        .ctrl-btn.fire { border-color: var(--accent); width: 85px; color: var(--accent); }
        .ctrl-btn.fire:active { background: var(--accent); color: #fff; }

        /* Modals & UI */
        .modal { position: absolute; inset: 0; background: rgba(3, 7, 18, 0.94); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; padding: 20px; backdrop-filter: blur(8px); border-radius: 12px;}
        .modal-card { background: rgba(11, 19, 41, 0.85); border: 2px solid var(--primary); border-radius: 16px; padding: 25px; max-width: 400px; width: 95%; text-align: center; box-shadow: 0 8px 32px rgba(0, 243, 255, 0.25); backdrop-filter: blur(12px); }
        
        .title { font-size: 2.5rem; color: var(--primary); text-shadow: 0 0 15px var(--primary-glow); margin: 0 0 15px 0; letter-spacing: 2px; line-height: 1.1; font-family: 'Impact', sans-serif;}
        
        .mode-btn { background: rgba(30, 41, 59, 0.8); border: 2px solid #334155; color: #fff; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin-bottom: 10px; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; }
        .mode-btn span { font-size: 0.75rem; color: #94a3b8; font-weight: normal; margin-top: 4px; }
        .mode-btn:hover { transform: translateY(-3px); }
        .mode-btn.easy:hover { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .mode-btn.normal:hover { border-color: #facc15; background: rgba(250, 204, 21, 0.2); box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
        .mode-btn.hard:hover { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .mode-btn.coop { border-color: #a855f7; }
        .mode-btn.coop:hover { border-color: #d946ef; background: rgba(217, 70, 239, 0.2); box-shadow: 0 0 15px rgba(217, 70, 239, 0.4); }

        .btn-restart { background: var(--primary); color: #000; border: none; padding: 8px 16px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 0 #0284c7; margin-top: 6px; margin-bottom: 4px; flex-shrink: 0; }
        .btn-restart:active { transform: translateY(2px); box-shadow: 0 2px 0 #0284c7; }
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div class="stats">🪙 Gold: <span id="coin-count">0</span></div>
    </header>

    <div class="status-bar">
        <div class="player-hud" id="hud-p1" style="color:var(--primary)">
            <div class="hud-name">PLAYER 1</div>
            <div id="p1-powerup" style="font-size:0.6rem; color:var(--gold); font-weight:bold; height:12px;"></div>
            <div id="p1-lives">❤️❤️❤️</div>
            <div class="hud-score" id="p1-score">00000</div>
        </div>
        
        <div style="text-align: center;">
            <div style="font-size:0.8rem; color:#94a3b8; text-transform:uppercase;">Wave</div>
            <div id="wave" style="color:var(--gold); font-size:1.8rem; line-height:1;">1</div>
        </div>

        <div class="player-hud right" id="hud-p2" style="color:var(--accent); display:none;">
            <div class="hud-name">PLAYER 2</div>
            <div id="p2-powerup" style="font-size:0.6rem; color:var(--gold); font-weight:bold; height:12px;"></div>
            <div id="p2-lives">❤️❤️❤️</div>
            <div class="hud-score" id="p2-score">00000</div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="spaceCanvas" width="540" height="600"></canvas>
        <div id="boss-hp-container"><div id="boss-hp-fill"></div></div>
        <div id="announcement">WAVE 1</div>
        <div id="cutscene-warning">WARNING<br>MOTHERSHIP DETECTED</div>

        <!-- Start Menu Modal -->
        <div id="start-modal" class="modal">
            <div class="modal-card">
                <h1 class="title">GALACTIC<br><span style="color: #fff;">DEFENDER</span></h1>
                <p style="color:#94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Select your mission deployment.</p>
                
                <button class="mode-btn easy" onclick="startGame('EASY')">
                    🟢 CASUAL (EASY)
                    <span>5 Lives • Slower Enemies • Weak Bosses</span>
                </button>
                <button class="mode-btn normal" onclick="startGame('NORMAL')">
                    🟡 ARCADE (NORMAL)
                    <span>3 Lives • Balanced Difficulty</span>
                </button>
                <button class="mode-btn coop" onclick="startGame('COOP')">
                    👥 2-PLAYER LOCAL CO-OP
                    <span>Share keyboard • Bosses have 200% HP</span>
                </button>
                <button class="mode-btn hard" onclick="startGame('HARD')">
                    🔴 IRONMAN (HARD)
                    <span>1 Life • Fast Enemies • Bullet Hell</span>
                </button>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="end-modal" class="modal" style="display: none;">
            <div class="modal-card">
                <h1 class="title" style="color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.5);">EARTH FALLS</h1>
                <p style="color:#94a3b8; font-size: 1.1rem; margin-bottom: 5px;">Total Score: <span id="final-score" style="color:var(--gold); font-weight:bold;">0</span></p>
                <p style="color:#94a3b8; font-size: 1.1rem; margin-bottom: 20px;">Waves Cleared: <span id="final-wave" style="color:var(--primary); font-weight:bold;">0</span></p>
                <button class="mode-btn normal" onclick="openMenu()">🔄 RETURN TO MENU</button>
            </div>
        </div>
    </div>

    <div class="touch-controls" id="touch-ui">
        <div class="touch-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="ctrl-btn fire" id="btn-shoot">🔥</div>
    </div>

    <button class="btn-restart" onclick="openMenu()">Abort Mission</button>

    <script>
        // --- Audio Engine ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext(); if (!ctx) return;
                const t = ctx.currentTime; const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);

                if (type === 'shoot') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(880, t); osc.frequency.exponentialRampToValueAtTime(110, t + 0.1);
                    gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                } else if (type === 'shoot2') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(1100, t); osc.frequency.exponentialRampToValueAtTime(150, t + 0.1);
                    gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                } else if (type === 'boom') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(20, t + 0.3);
                    gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                    osc.start(t); osc.stop(t + 0.3);
                } else if (type === 'player_hit') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(10, t + 0.6);
                    gain.gain.setValueAtTime(0.6, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
                    osc.start(t); osc.stop(t + 0.6);
                } else if (type === 'powerup') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, t); osc.frequency.setValueAtTime(554, t + 0.1); osc.frequency.setValueAtTime(659, t + 0.2); osc.frequency.setValueAtTime(880, t + 0.3);
                    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                    osc.start(t); osc.stop(t + 0.4);
                } else if (type === 'siren') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(500, t + 0.5); osc.frequency.linearRampToValueAtTime(300, t + 1.0);
                    gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.001, t + 1.0);
                    osc.start(t); osc.stop(t + 1.0);
                }
            } catch(e) {}
        }

        // --- Game Setup ---
        const canvas = document.getElementById("spaceCanvas");
        const ctx = canvas.getContext("2d");

        let wave = 1, gameActive = false, screenShake = 0, isCoop = false, isCutscene = false, cutsceneTimer = 0;
        let difficulty = { speed: 1.0, fireRate: 1.0, bossHp: 1.0, startLives: 3 };
        
        let p1 = { id: 1, x: 220, y: 550, w: 40, h: 20, speed: 6.5, cooldown: 0, rapidTimer: 0, dualTimer: 0, invulnTimer: 0, lives: 3, score: 0, color: '#00f3ff', keys: { left: false, right: false, shoot: false } };
        let p2 = { id: 2, x: 280, y: 550, w: 40, h: 20, speed: 6.5, cooldown: 0, rapidTimer: 0, dualTimer: 0, invulnTimer: 0, lives: 3, score: 0, color: '#ff007f', keys: { left: false, right: false, shoot: false } };
        
        let bullets = [], alienBullets = [], aliens = [], particles = [], stars = [], bunkers = [], powerups = [];
        let alienDir = 1, alienSpeed = 1, bossMode = false;
        let boss = { active: false, x: 200, y: -100, w: 100, h: 60, hp: 0, maxHp: 0, speed: 2, dir: 1, timer: 0 };

        // --- Initialization ---
        function applyGlobalTheme() {
            const savedTheme = localStorage.getItem('arcade_theme') || 'neon';
            const themes = { neon: { primary: '#00f3ff', accent: '#ff007f', bg: '#0f172a', card: '#1e293b' } };
            const active = themes[savedTheme] || themes.neon;
            document.documentElement.style.setProperty('--primary', active.primary);
            document.documentElement.style.setProperty('--accent', active.accent);
        }

        function updateWallet() {
            const coins = parseInt(localStorage.getItem('arcade_coins')) || 0;
            document.getElementById('coin-count').innerText = coins.toLocaleString();
        }

        function addCoins(amount) {
            let current = parseInt(localStorage.getItem('arcade_coins')) || 0;
            localStorage.setItem('arcade_coins', current + amount);
            updateWallet();
        }

        function announce(text, duration = 1500) {
            const el = document.getElementById("announcement");
            el.innerText = text;
            el.style.transform = "translate(-50%, -50%) scale(1)";
            setTimeout(() => el.style.transform = "translate(-50%, -50%) scale(0)", duration);
        }

        function updateHUD() {
            let h1 = ""; for (let i = 0; i < p1.lives; i++) h1 += "❤️"; if (p1.lives <= 0) h1 = "💀";
            document.getElementById("p1-lives").innerText = h1;
            document.getElementById("p1-score").innerText = String(p1.score).padStart(5, '0');
            
            let p1pw = [];
            if (p1.dualTimer > 0) p1pw.push("DUAL");
            if (p1.rapidTimer > 0) p1pw.push("RAPID");
            document.getElementById("p1-powerup").innerText = p1pw.join(" + ");

            if (isCoop) {
                let h2 = ""; for (let i = 0; i < p2.lives; i++) h2 += "❤️"; if (p2.lives <= 0) h2 = "💀";
                document.getElementById("p2-lives").innerText = h2;
                document.getElementById("p2-score").innerText = String(p2.score).padStart(5, '0');
                
                let p2pw = [];
                if (p2.dualTimer > 0) p2pw.push("DUAL");
                if (p2.rapidTimer > 0) p2pw.push("RAPID");
                document.getElementById("p2-powerup").innerText = p2pw.join(" + ");
            }
        }

        function initStars() {
            stars = [];
            for(let i=0; i<80; i++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2.5, speed: Math.random() * 1.5 + 0.5 });
        }

        function initBunkers() {
            bunkers = [];
            for (let i = 0; i < 4; i++) {
                let bx = 65 + i * 115;
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (r === 0 && (c === 0 || c === 3)) continue;
                        if (r === 2 && (c === 1 || c === 2)) continue;
                        bunkers.push({ x: bx + c * 14, y: 460 + r * 14, w: 14, h: 14, alive: true, hp: 2 });
                    }
                }
            }
        }

        function spawnAliens() {
            aliens = []; alienBullets = []; powerups = [];
            [p1, p2].forEach(p => { p.rapidTimer = 0; p.dualTimer = 0; });
            updateHUD();

            if (wave % 5 === 0) {
                bossMode = true; boss.active = true;
                boss.maxHp = Math.round((80 + (wave * 20)) * difficulty.bossHp * (isCoop ? 2.0 : 1.0));
                boss.hp = boss.maxHp;
                boss.y = -80; // Start off screen
                boss.x = canvas.width/2 - boss.w/2;
                
                // Trigger Cutscene
                isCutscene = true;
                cutsceneTimer = 180; // 3 seconds at 60fps
                document.getElementById('cutscene-warning').style.display = 'block';
                playSound('siren'); setTimeout(() => playSound('siren'), 1000); setTimeout(() => playSound('siren'), 2000);
            } else {
                bossMode = false; boss.active = false;
                document.getElementById('boss-hp-container').style.display = 'none';
                const rows = Math.min(5, 3 + Math.floor(wave / 3));
                const cols = 8;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        aliens.push({
                            x: 45 + c * 55, y: 50 + r * 40, w: 32, h: 24, alive: true,
                            color: r === 0 ? "#ff007f" : (r < 2 ? "#a855f7" : "#00f3ff")
                        });
                    }
                }
                alienSpeed = (1 + (wave - 1) * 0.35) * difficulty.speed;
                announce(`WAVE ${wave}`);
            }
            if (wave === 1) initBunkers();
        }

        function createExplosion(x, y, color) {
            playSound('boom'); screenShake = 5;
            for(let i=0; i<12; i++){
                const angle = Math.random() * Math.PI * 2; const spd = Math.random() * 4 + 1;
                particles.push({ x: x+16, y: y+12, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 1.0, color });
            }
        }

        function playerHit(p) {
            if (p.invulnTimer > 0 || p.lives <= 0) return;

            p.lives--;
            createExplosion(p.x, p.y, p.color);
            p.rapidTimer = 0; p.dualTimer = 0; 
            updateHUD();
            playSound('player_hit');
            screenShake = 15;

            if (p.lives > 0) {
                p.x = p.id === 1 ? 220 : 280;
                p.invulnTimer = 120;
            }

            if (p1.lives <= 0 && (!isCoop || p2.lives <= 0)) {
                gameOver();
            }
        }

        function openMenu() {
            gameActive = false;
            document.getElementById("start-modal").style.display = "flex";
            document.getElementById("end-modal").style.display = "none";
        }

        function startGame(mode) {
            isCoop = (mode === 'COOP');
            if (mode === 'EASY') difficulty = { speed: 0.75, fireRate: 0.5, bossHp: 0.6, startLives: 5 };
            else if (mode === 'COOP') difficulty = { speed: 1.0, fireRate: 1.5, bossHp: 2.0, startLives: 3 };
            else if (mode === 'NORMAL') difficulty = { speed: 1.0, fireRate: 1.0, bossHp: 1.0, startLives: 3 };
            else if (mode === 'HARD') difficulty = { speed: 1.3, fireRate: 1.6, bossHp: 1.5, startLives: 1 };

            document.getElementById("start-modal").style.display = "none";
            document.getElementById("end-modal").style.display = "none";
            document.getElementById("hud-p2").style.display = isCoop ? "flex" : "none";
            document.getElementById("touch-ui").style.display = isCoop ? "none" : "flex"; 
            
            wave = 1; gameActive = true; isCutscene = false;
            bullets = []; alienBullets = []; particles = []; powerups = [];
            
            p1.lives = difficulty.startLives; p1.score = 0; p1.x = isCoop ? 180 : 250; p1.rapidTimer = 0; p1.dualTimer = 0; p1.invulnTimer = 0;
            p2.lives = difficulty.startLives; p2.score = 0; p2.x = 320; p2.rapidTimer = 0; p2.dualTimer = 0; p2.invulnTimer = 0;
            if(!isCoop) p2.lives = 0;

            document.getElementById("wave").innerText = 1;
            document.getElementById('announcement').style.transform = "translate(-50%, -50%) scale(0)";
            document.getElementById('cutscene-warning').style.display = 'none';
            document.getElementById('boss-hp-container').style.display = 'none';
            
            updateHUD();
            initBunkers();
            spawnAliens();
        }

        // --- Controls ---
        window.addEventListener("keydown", e => {
            if (["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD","KeyW","a","d","w","A","D","W"," "].includes(e.key) || e.code === "Space") e.preventDefault();
            
            if (e.key === "a" || e.key === "A") p1.keys.left = true;
            if (e.key === "d" || e.key === "D") p1.keys.right = true;
            if (e.key === " " || e.code === "Space" || e.key === "w" || e.key === "W") p1.keys.shoot = true;

            if (e.key === "ArrowLeft") p2.keys.left = true;
            if (e.key === "ArrowRight") p2.keys.right = true;
            if (e.key === "ArrowUp" || e.key === "Enter") p2.keys.shoot = true;
        }, { passive: false });

        window.addEventListener("keyup", e => {
            if (e.key === "a" || e.key === "A") p1.keys.left = false;
            if (e.key === "d" || e.key === "D") p1.keys.right = false;
            if (e.key === " " || e.code === "Space" || e.key === "w" || e.key === "W") p1.keys.shoot = false;

            if (e.key === "ArrowLeft") p2.keys.left = false;
            if (e.key === "ArrowRight") p2.keys.right = false;
            if (e.key === "ArrowUp" || e.key === "Enter") p2.keys.shoot = false;
        });

        const bindTouch = (id, field) => {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener("touchstart", e => { e.preventDefault(); getAudioContext(); p1.keys[field] = true; }, { passive: false });
            el.addEventListener("touchend", e => { e.preventDefault(); p1.keys[field] = false; }, { passive: false });
        };
        bindTouch("btn-left", "left"); bindTouch("btn-right", "right"); bindTouch("btn-shoot", "shoot");

        // --- Logic Update ---
        function updatePlayer(p) {
            if (p.lives <= 0) return;

            if (p.invulnTimer > 0) p.invulnTimer--;

            if (p.keys.left) p.x -= p.speed;
            if (p.keys.right) p.x += p.speed;
            p.x = Math.max(10, Math.min(canvas.width - 10 - p.w, p.x));

            let updateHudFlag = false;
            if (p.rapidTimer > 0) { p.rapidTimer--; if (p.rapidTimer === 0) updateHudFlag = true; }
            if (p.dualTimer > 0) { p.dualTimer--; if (p.dualTimer === 0) updateHudFlag = true; }
            if (updateHudFlag) updateHUD();

            if (p.cooldown > 0) p.cooldown--;
            if (p.keys.shoot && p.cooldown === 0) {
                playSound(p.id === 1 ? 'shoot' : 'shoot2');
                
                const speed = p.rapidTimer > 0 ? 13 : 9;
                p.cooldown = p.rapidTimer > 0 ? 6 : 14;

                if (p.dualTimer > 0) {
                    bullets.push({ x: p.x, y: p.y, w: 6, h: 14, speed: speed, color: p.color, owner: p });
                    bullets.push({ x: p.x + p.w - 6, y: p.y, w: 6, h: 14, speed: speed, color: p.color, owner: p });
                } else {
                    bullets.push({ x: p.x + p.w / 2 - 3, y: p.y, w: 6, h: 14, speed: speed, color: p.color, owner: p });
                }
            }
        }

        function update() {
            if (!gameActive) {
                stars.forEach(s => { s.y += s.speed; if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; } });
                return;
            }

            stars.forEach(s => { s.y += s.speed; if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; } });

            [p1, p2].forEach(p => updatePlayer(p));

            if (isCutscene) {
                cutsceneTimer--;
                boss.y += 0.6; // Boss descends slowly
                
                if (cutsceneTimer <= 0) {
                    isCutscene = false;
                    document.getElementById('cutscene-warning').style.display = 'none';
                    document.getElementById('boss-hp-container').style.display = 'block';
                    document.getElementById('boss-hp-fill').style.width = '100%';
                }
                
                // Allow players to move during cutscene but bullets are handled below
            }

            // Powerups
            powerups.forEach((pw, idx) => {
                pw.y += pw.speed;
                [p1, p2].forEach(p => {
                    if (p.lives > 0 && p.invulnTimer <= 0 && pw.x < p.x + p.w && pw.x + 16 > p.x && pw.y < p.y + p.h && pw.y + 16 > p.y) {
                        if (pw.type === 'dual') p.dualTimer = 600;
                        if (pw.type === 'rapid') p.rapidTimer = 600;
                        updateHUD();
                        playSound('powerup');
                        addCoins(2);
                        powerups.splice(idx, 1);
                    }
                });
                if (pw.y > canvas.height) powerups.splice(idx, 1);
            });

            // Player Bullets
            bullets.forEach((b, bIdx) => {
                b.y -= b.speed;
                
                bunkers.forEach(bk => {
                    if (bk.alive && b.x < bk.x + bk.w && b.x + b.w > bk.x && b.y < bk.y + bk.h && b.y + b.h > bk.y) {
                        bk.hp--; if(bk.hp<=0) bk.alive = false;
                        b.y = -100;
                    }
                });

                if (bossMode && boss.active && !isCutscene) {
                    if (b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
                        boss.hp--;
                        b.y = -100;
                        document.getElementById('boss-hp-fill').style.width = `${(boss.hp / boss.maxHp) * 100}%`;
                        
                        // Boss drops powerups when taking damage
                        if (Math.random() < 0.02) {
                            powerups.push({ x: boss.x + boss.w/2, y: boss.y + boss.h, speed: 2.5, type: Math.random() > 0.5 ? 'dual' : 'rapid' });
                        }

                        if (boss.hp <= 0) {
                            boss.active = false;
                            createExplosion(boss.x + boss.w/2, boss.y + boss.h/2, '#ff007f');
                            createExplosion(boss.x, boss.y, '#facc15');
                            createExplosion(boss.x + boss.w, boss.y, '#00f3ff');
                            b.owner.score += 500; updateHUD();
                            addCoins(50);
                            announce("BOSS DESTROYED! +50 GOLD");
                            setTimeout(() => { wave++; spawnAliens(); }, 2000);
                        }
                    }
                } else if (!bossMode) {
                    aliens.forEach(a => {
                        if (a.alive && b.x < a.x + a.w && b.x + b.w > a.x && b.y < a.y + a.h && b.y + b.h > a.y) {
                            a.alive = false;
                            b.y = -100;
                            b.owner.score += 10; updateHUD();
                            addCoins(1);
                            createExplosion(a.x, a.y, a.color);
                            
                            if (Math.random() < 0.08) {
                                powerups.push({ x: a.x + 8, y: a.y, speed: 2.5, type: Math.random() > 0.5 ? 'dual' : 'rapid' });
                            }
                        }
                    });
                }
            });
            bullets = bullets.filter(b => b.y > 0);

            // Enemies
            if (bossMode && boss.active && !isCutscene) {
                boss.x += boss.speed * boss.dir * difficulty.speed;
                if (boss.x <= 10 || boss.x + boss.w >= canvas.width - 10) boss.dir *= -1;
                
                boss.timer++;
                if (boss.timer > 45 / difficulty.fireRate) {
                    boss.timer = 0;
                    alienBullets.push({ x: boss.x + 20, y: boss.y + boss.h, w: 8, h: 16, speed: 5, color: '#ff007f' });
                    alienBullets.push({ x: boss.x + boss.w - 20, y: boss.y + boss.h, w: 8, h: 16, speed: 5, color: '#ff007f' });
                    if (boss.hp < boss.maxHp / 2) {
                        alienBullets.push({ x: boss.x + boss.w/2, y: boss.y + boss.h, w: 12, h: 16, speed: 6, color: '#facc15' });
                    }
                }
            } else if (!bossMode) {
                let activeAliens = aliens.filter(a => a.alive);
                if (activeAliens.length === 0) {
                    wave++;
                    addCoins(10);
                    document.getElementById("wave").innerText = wave;
                    spawnAliens();
                    return;
                }

                let edgeHit = false;
                activeAliens.forEach(a => {
                    a.x += alienSpeed * alienDir;
                    if (a.x <= 10 || a.x + a.w >= canvas.width - 10) edgeHit = true;
                    
                    if (Math.random() < 0.0015 * wave * difficulty.fireRate) {
                        alienBullets.push({ x: a.x + a.w / 2, y: a.y + a.h, w: 4, h: 12, speed: 4, color: '#ff007f' });
                    }
                    
                    [p1, p2].forEach(p => {
                        if (p.lives > 0 && p.invulnTimer <= 0 && a.y + a.h >= p.y && a.y <= p.y + p.h && a.x + a.w >= p.x && a.x <= p.x + p.w) {
                            playerHit(p);
                        }
                    });

                    if (a.y + a.h >= canvas.height - 20) {
                        p1.lives = 0; p2.lives = 0; updateHUD(); gameOver();
                    }
                });

                if (edgeHit) {
                    alienDir = -alienDir;
                    activeAliens.forEach(a => a.y += 20);
                }
            }

            alienBullets.forEach(ab => {
                ab.y += ab.speed;
                bunkers.forEach(bk => {
                    if (bk.alive && ab.x < bk.x + bk.w && ab.x + ab.w > bk.x && ab.y < bk.y + bk.h && ab.y + ab.h > bk.y) {
                        bk.hp--; if(bk.hp<=0) bk.alive = false; ab.y = canvas.height + 100;
                    }
                });

                [p1, p2].forEach(p => {
                    if (p.lives > 0 && p.invulnTimer <= 0 && ab.x < p.x + p.w && ab.x + ab.w > p.x && ab.y < p.y + p.h && ab.y + ab.h > p.y) {
                        ab.y = canvas.height + 100;
                        playerHit(p);
                    }
                });
            });
            alienBullets = alienBullets.filter(ab => ab.y < canvas.height);

            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
            particles = particles.filter(p => p.life > 0);
        }

        function drawPlayer(p) {
            if (p.lives <= 0) return;
            if (p.invulnTimer === 0 || Math.floor(p.invulnTimer / 6) % 2 === 0) {
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10; ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillRect(p.x + 14, p.y - 10, 12, 10);
                if (p.dualTimer > 0) {
                    ctx.fillStyle = p.color; ctx.fillRect(p.x - 4, p.y + 4, 8, 16); ctx.fillRect(p.x + p.w - 4, p.y + 4, 8, 16);
                }
                if (p.rapidTimer > 0) {
                    ctx.fillStyle = "#facc15"; ctx.fillRect(p.x + 14, p.y - 4, 12, 4); // Visual indicator for rapid fire
                }
                ctx.shadowBlur = 0;
            }
        }

        function render() {
            ctx.save();
            if (screenShake > 0.5) {
                ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
                screenShake *= 0.85;
            }
            
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            stars.forEach(s => { ctx.fillRect(s.x, s.y, s.size, s.size); });

            if (gameActive || p1.invulnTimer > 0 || p2.invulnTimer > 0) {
                drawPlayer(p1);
                if (isCoop) drawPlayer(p2);
            }

            powerups.forEach(p => {
                ctx.fillStyle = p.type === 'dual' ? '#a855f7' : '#facc15';
                ctx.shadowBlur = 8; ctx.shadowColor = ctx.fillStyle;
                ctx.beginPath(); ctx.arc(p.x + 8, p.y + 8, 8, 0, Math.PI*2); ctx.fill();
            });

            ctx.shadowBlur = 5; ctx.shadowColor = "#10b981";
            bunkers.forEach(bk => {
                if (bk.alive) {
                    ctx.fillStyle = bk.hp === 2 ? "#10b981" : "#059669";
                    ctx.fillRect(bk.x, bk.y, bk.w-1, bk.h-1);
                }
            });
            ctx.shadowBlur = 0;

            bullets.forEach(b => { ctx.fillStyle = b.color; ctx.shadowBlur = 8; ctx.shadowColor = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); });
            alienBullets.forEach(ab => { ctx.fillStyle = ab.color; ctx.shadowBlur = 8; ctx.shadowColor = ab.color; ctx.fillRect(ab.x, ab.y, ab.w, ab.h); });
            ctx.shadowBlur = 0;

            if (bossMode && boss.active) {
                // Flash warning overlay during cutscene
                if (isCutscene) {
                    ctx.fillStyle = "rgba(239, 68, 68, 0.2)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
                ctx.fillStyle = "#ff007f";
                ctx.shadowBlur = 15; ctx.shadowColor = "#ff007f";
                ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                ctx.fillStyle = "#000";
                ctx.fillRect(boss.x + 20, boss.y + 20, 15, 15);
                ctx.fillRect(boss.x + boss.w - 35, boss.y + 20, 15, 15);
                ctx.fillStyle = "#facc15";
                ctx.fillRect(boss.x + boss.w/2 - 10, boss.y + boss.h - 10, 20, 10);
            } else {
                aliens.forEach(a => {
                    if (a.alive) {
                        ctx.fillStyle = a.color;
                        ctx.shadowBlur = 8; ctx.shadowColor = a.color;
                        ctx.fillRect(a.x, a.y, a.w, a.h);
                        ctx.fillStyle = "#000"; 
                        ctx.fillRect(a.x + 6, a.y + 6, 6, 6);
                        ctx.fillRect(a.x + a.w - 12, a.y + 6, 6, 6);
                    }
                });
            }
            ctx.shadowBlur = 0;

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // --- Start Game ---
        applyGlobalTheme();
        updateWallet();
        initStars();
        gameLoop(); 
        openMenu();
    </script>
</body>
</html>
