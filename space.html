<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Space Invaders - Arcade Edition</title>
    <script src="arcade.js"></script>
    <style>
        :root { --primary: #00f3ff; --accent: #ff007f; --bg: #0f172a; --card: #1e293b; --gold: #facc15; }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start; 
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box; 
            touch-action: none; 
            overflow: hidden; 
        }
        
        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 10px 20px; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 10px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,243,255,0.2); flex-shrink: 0; }
        .stats { font-size: 1.1rem; font-weight: bold; color: var(--gold); }
        
        .status-bar { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; max-width: 800px; margin-bottom: 10px; font-weight: bold; font-size: 1.2rem; flex-shrink: 0; }
        .player-hud { display: flex; flex-direction: column; text-align: left; }
        .player-hud.right { text-align: right; }
        .hud-name { font-size: 0.9rem; text-transform: uppercase; margin-bottom: 4px; }
        .hud-score { font-family: monospace; font-size: 1.4rem; }
        
        .play-area {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            flex: 1 1 0;
            min-height: 0;
        }

        .touch-group-side { display: flex; gap: 15px; flex-shrink: 0; }
        
        #game-container { position: relative; height: 100%; display: flex; justify-content: center; align-items: center; flex: 1 1 0; min-height: 0; }
        
        canvas { background: #020617; border: 3px solid var(--primary); border-radius: 12px; box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); max-width: 100%; height: 100%; aspect-ratio: 540 / 600; display: block; object-fit: contain; }
        
        #boss-ui { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 75%; display: none; flex-direction: column; align-items: center; z-index: 5; }
        #boss-name-label { font-size: 0.85rem; font-weight: 900; color: var(--gold); text-shadow: 0 2px 4px #000; margin-bottom: 3px; letter-spacing: 1px; }
        #boss-hp-container { width: 100%; height: 12px; background: rgba(0,0,0,0.85); border: 2px solid var(--accent); border-radius: 6px; overflow: hidden; }
        #boss-hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ef4444, var(--accent)); transition: width 0.1s; }

        #announcement { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 2.2rem; font-weight: 900; color: var(--gold); text-shadow: 0 4px 10px #000; pointer-events: none; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10; width: 100%; text-align: center; letter-spacing: 1px;}
        #cutscene-warning { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.2rem; font-weight: 900; color: #ef4444; text-shadow: 0 0 15px #ef4444; pointer-events: none; z-index: 10; width: 100%; text-align: center; display: none; animation: flashWarning 0.5s infinite; }

        @keyframes flashWarning {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .ctrl-btn { width: 75px; height: 75px; background: rgba(30, 41, 59, 0.9); border: 2px solid var(--primary); border-radius: 16px; color: white; font-size: 2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; transition: transform 0.1s; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .ctrl-btn:active { background: var(--primary); color: #000; transform: scale(0.92); }
        .ctrl-btn.fire { border-color: var(--accent); width: 90px; color: var(--accent); font-size: 2.5rem; }
        .ctrl-btn.fire:active { background: var(--accent); color: #fff; }

        .modal { position: fixed; inset: 0; background: rgba(3, 7, 18, 0.94); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(8px);}
        .modal-card { background: rgba(11, 19, 41, 0.85); border: 2px solid var(--primary); border-radius: 16px; padding: 35px 25px; max-width: 450px; width: 95%; text-align: center; box-shadow: 0 8px 40px rgba(0, 243, 255, 0.3); backdrop-filter: blur(12px); }
        
        .title { font-size: 3rem; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); margin: 0 0 20px 0; letter-spacing: 2px; line-height: 1.1; font-family: 'Impact', sans-serif;}
        
        .mode-btn { background: rgba(30, 41, 59, 0.8); border: 2px solid #334155; color: #fff; padding: 15px; width: 100%; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 1.2rem; margin-bottom: 12px; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .mode-btn span { font-size: 0.8rem; color: #94a3b8; font-weight: normal; margin-top: 6px; }
        .mode-btn:hover { transform: translateY(-3px); }
        .mode-btn.easy:hover { border-color: #22c55e; background: rgba(34, 197, 94, 0.2); box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
        .mode-btn.normal:hover { border-color: #facc15; background: rgba(250, 204, 21, 0.2); box-shadow: 0 0 20px rgba(250, 204, 21, 0.4); }
        .mode-btn.hard:hover { border-color: #ef4444; background: rgba(239, 68, 68, 0.2); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
        .mode-btn.coop { border-color: #a855f7; }
        .mode-btn.coop:hover { border-color: #d946ef; background: rgba(217, 70, 239, 0.2); box-shadow: 0 0 20px rgba(217, 70, 239, 0.4); }

        .btn-restart { background: var(--primary); color: #000; border: none; padding: 10px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 5px 0 #0284c7; margin-top: 15px; margin-bottom: 5px; flex-shrink: 0; }
        .btn-restart:active { transform: translateY(3px); box-shadow: 0 2px 0 #0284c7; }
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 1.1rem;}
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div class="stats">🪙 Gold: <span id="coin-count">0</span></div>
    </header>

    <div class="status-bar">
        <div class="player-hud" id="hud-p1" style="color:var(--primary)">
            <div class="hud-name">PLAYER 1</div>
            <div id="p1-powerup" style="font-size:0.65rem; color:var(--gold); font-weight:bold; height:14px;"></div>
            <div id="p1-lives">❤️❤️❤️</div>
            <div class="hud-score" id="p1-score">00000</div>
        </div>
        
        <div style="text-align: center;">
            <div style="font-size:0.9rem; color:#94a3b8; text-transform:uppercase;">Wave</div>
            <div id="wave" style="color:var(--gold); font-size:2.2rem; line-height:1;">1</div>
        </div>

        <div class="player-hud right" id="hud-p2" style="color:var(--accent); display:none;">
            <div class="hud-name">PLAYER 2</div>
            <div id="p2-powerup" style="font-size:0.65rem; color:var(--gold); font-weight:bold; height:14px;"></div>
            <div id="p2-lives">❤️❤️❤️</div>
            <div class="hud-score" id="p2-score">00000</div>
        </div>
    </div>

    <div class="play-area">
        <div class="touch-group-side" id="touch-left-wrap">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>

        <div id="game-container">
            <canvas id="spaceCanvas" width="540" height="600"></canvas>
            <div id="boss-ui">
                <div id="boss-name-label">BOSS: SHIVNAND</div>
                <div id="boss-hp-container"><div id="boss-hp-fill"></div></div>
            </div>
            <div id="announcement">WAVE 1</div>
            <div id="cutscene-warning">WARNING<br>BOSS DETECTED</div>
        </div>

        <div class="touch-group-side" id="touch-right-wrap">
            <div class="ctrl-btn fire" id="btn-shoot">🔥</div>
        </div>
    </div>

    <button class="btn-restart" onclick="openMenu()">Abort Mission</button>

    <div id="start-modal" class="modal">
        <div class="modal-card">
            <h1 class="title">GALACTIC<br><span style="color: #fff;">DEFENDER</span></h1>
            <p style="color:#94a3b8; font-size: 1rem; margin-bottom: 25px;">Select your mission deployment.</p>
            
            <button class="mode-btn easy" onclick="startGame('EASY')">
                🟢 CASUAL (EASY)
                <span>5 Lives • Slower Enemies • Weak Bosses</span>
            </button>
            <button class="mode-btn normal" onclick="startGame('NORMAL')">
                🟡 ARCADE (NORMAL)
                <span>3 Lives • Balanced Difficulty</span>
            </button>
            <button class="mode-btn coop" onclick="startGame('COOP')">
                👥 2-PLAYER LOCAL CO-OP
                <span>Share keyboard • Bosses have 200% HP</span>
            </button>
            <button class="mode-btn hard" onclick="startGame('HARD')">
                🔴 IRONMAN (HARD)
                <span>1 Life • Fast Enemies • Bullet Hell</span>
            </button>
        </div>
    </div>

    <div id="end-modal" class="modal" style="display: none;">
        <div class="modal-card">
            <h1 class="title" style="color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.6);">EARTH FALLS</h1>
            <p style="color:#94a3b8; font-size: 1.2rem; margin-bottom: 5px;">Total Score: <span id="final-score" style="color:var(--gold); font-weight:bold;">0</span></p>
            <p style="color:#94a3b8; font-size: 1.2rem; margin-bottom: 25px;">Waves Cleared: <span id="final-wave" style="color:var(--primary); font-weight:bold;">0</span></p>
            <button class="mode-btn normal" onclick="openMenu()">🔄 RETURN TO MENU</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext(); if (!ctx) return;
                const t = ctx.currentTime; const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);

                if (type === 'shoot') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(880, t); osc.frequency.exponentialRampToValueAtTime(110, t + 0.1);
                    gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                } else if (type === 'shoot2') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(1100, t); osc.frequency.exponentialRampToValueAtTime(150, t + 0.1);
                    gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                } else if (type === 'boom') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(20, t + 0.3);
                    gain.gain.setValueAtTime(0.3, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
                    osc.start(t); osc.stop(t + 0.3);
                } else if (type === 'player_hit') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(10, t + 0.6);
                    gain.gain.setValueAtTime(0.6, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
                    osc.start(t); osc.stop(t + 0.6);
                } else if (type === 'powerup') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, t); osc.frequency.setValueAtTime(554, t + 0.1); osc.frequency.setValueAtTime(659, t + 0.2); osc.frequency.setValueAtTime(880, t + 0.3);
                    gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                    osc.start(t); osc.stop(t + 0.4);
                } else if (type === 'siren') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, t); osc.frequency.linearRampToValueAtTime(500, t + 0.5); osc.frequency.linearRampToValueAtTime(300, t + 1.0);
                    gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0.001, t + 1.0);
                    osc.start(t); osc.stop(t + 1.0);
                }
            } catch(e) {}
        }

        const canvas = document.getElementById("spaceCanvas");
        const ctx = canvas.getContext("2d");

        let wave = 1, gameActive = false, screenShake = 0, isCoop = false, isCutscene = false, cutsceneTimer = 0;
        let difficulty = { speed: 1.0, fireRate: 1.0, bossHp: 1.0, startLives: 3 };
        
        function createPlayerObj(id, x, color) {
            return {
                id, x, y: 550, w: 40, h: 20, speed: 6.5, cooldown: 0,
                rapidTimer: 0, dualTimer: 0, spreadTimer: 0, plasmaTimer: 0, omegaTimer: 0,
                invulnTimer: 0, lives: 3, score: 0, color,
                keys: { left: false, right: false, shoot: false }
            };
        }

        let p1 = createPlayerObj(1, 220, '#00f3ff');
        let p2 = createPlayerObj(2, 280, '#ff007f');
        
        let bullets = [], alienBullets = [], aliens = [], particles = [], stars = [], bunkers = [], powerups = [];
        let alienDir = 1, alienSpeed = 1, bossMode = false;
        
        let boss = { 
            active: false, type: 'SHIVNAND', name: 'SHIVNAND', color: '#10b981', reward: 10000,
            x: 200, y: -100, w: 110, h: 65, hp: 0, maxHp: 0, speed: 2, dir: 1, timer: 0, dropTimer: 0 
        };

        const POWERUP_META = {
            dual:   { color: '#a855f7', label: 'DUAL' },
            rapid:  { color: '#facc15', label: 'RAPID' },
            spread: { color: '#10b981', label: '3-WAY' },
            heal:   { color: '#22c55e', label: '+1❤️' },
            plasma: { color: '#ec4899', label: 'PLASMA' },
            shield: { color: '#38bdf8', label: 'SHIELD' },
            omega:  { color: '#ef4444', label: 'OMEGA' },
            emp:    { color: '#ffffff', label: 'EMP' }
        };

        function applyGlobalTheme() {
            const savedTheme = localStorage.getItem('arcade_theme') || 'neon';
            const themes = { neon: { primary: '#00f3ff', accent: '#ff007f', bg: '#0f172a', card: '#1e293b' } };
            const active = themes[savedTheme] || themes.neon;
            document.documentElement.style.setProperty('--primary', active.primary);
            document.documentElement.style.setProperty('--accent', active.accent);
        }

        function updateWallet() {
            const coins = parseInt(localStorage.getItem('arcade_coins')) || 0;
            document.getElementById('coin-count').innerText = coins.toLocaleString();
        }

        function addCoins(amount) {
            let current = parseInt(localStorage.getItem('arcade_coins')) || 0;
            localStorage.setItem('arcade_coins', current + amount);
            updateWallet();
        }

        function announce(text, duration = 1800) {
            const el = document.getElementById("announcement");
            el.innerText = text;
            el.style.transform = "translate(-50%, -50%) scale(1)";
            setTimeout(() => el.style.transform = "translate(-50%, -50%) scale(0)", duration);
        }

        function getActivePowerupsText(p) {
            let list = [];
            if (p.omegaTimer > 0) list.push("OMEGA");
            if (p.plasmaTimer > 0) list.push("PLASMA");
            if (p.spreadTimer > 0) list.push("3-WAY");
            if (p.dualTimer > 0) list.push("DUAL");
            if (p.rapidTimer > 0) list.push("RAPID");
            return list.join(" + ");
        }

        function updateHUD() {
            let h1 = ""; for (let i = 0; i < p1.lives; i++) h1 += "❤️"; if (p1.lives <= 0) h1 = "💀";
            document.getElementById("p1-lives").innerText = h1;
            document.getElementById("p1-score").innerText = String(p1.score).padStart(5, '0');
            document.getElementById("p1-powerup").innerText = getActivePowerupsText(p1);

            if (isCoop) {
                let h2 = ""; for (let i = 0; i < p2.lives; i++) h2 += "❤️"; if (p2.lives <= 0) h2 = "💀";
                document.getElementById("p2-lives").innerText = h2;
                document.getElementById("p2-score").innerText = String(p2.score).padStart(5, '0');
                document.getElementById("p2-powerup").innerText = getActivePowerupsText(p2);
            }
        }

        function initStars() {
            stars = [];
            for(let i=0; i<80; i++) stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2.5, speed: Math.random() * 1.5 + 0.5 });
        }

        function initBunkers() {
            bunkers = [];
            for (let i = 0; i < 4; i++) {
                let bx = 65 + i * 115;
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (r === 0 && (c === 0 || c === 3)) continue;
                        if (r === 2 && (c === 1 || c === 2)) continue;
                        bunkers.push({ x: bx + c * 14, y: 460 + r * 14, w: 14, h: 14, alive: true, hp: 2 });
                    }
                }
            }
        }

        function spawnBossDrop(x, y) {
            let pool = ['rapid', 'dual'];
            if (boss.type === 'SHIVNAND') pool = ['spread', 'spread', 'heal', 'rapid', 'dual'];
            else if (boss.type === 'CANMING') pool = ['plasma', 'plasma', 'shield', 'spread', 'rapid'];
            else if (boss.type === 'YONGHAO') pool = ['omega', 'omega', 'emp', 'plasma', 'shield', 'heal'];
            
            const chosen = pool[Math.floor(Math.random() * pool.length)];
            powerups.push({ x, y, speed: 2.3, type: chosen });
        }

        function spawnAliens() {
            aliens = []; alienBullets = []; powerups = [];
            updateHUD();

            if (wave % 5 === 0) {
                bossMode = true; boss.active = true;
                
                // Roll Boss Rarity: Shivnand (60%), Can Ming (30%), Yong Hao (10%)
                const roll = Math.random();
                const baseHp = (75 + (wave * 20)) * difficulty.bossHp * (isCoop ? 1.8 : 1.0);

                if (roll < 0.60) {
                    boss.type = 'SHIVNAND';
                    boss.name = 'BOSS: SHIVNAND (10,000 🪙)';
                    boss.color = '#10b981';
                    boss.maxHp = Math.round(baseHp);
                    boss.speed = 2.0;
                    boss.reward = 10000;
                } else if (roll < 0.90) {
                    boss.type = 'CANMING';
                    boss.name = 'BOSS: CAN MING (25,000 🪙)';
                    boss.color = '#a855f7';
                    boss.maxHp = Math.round(baseHp * 1.8);
                    boss.speed = 2.8;
                    boss.reward = 25000;
                } else {
                    boss.type = 'YONGHAO';
                    boss.name = '🔥 MYTHIC BOSS: YONG HAO (1,000,000 🪙)';
                    boss.color = '#ef4444';
                    boss.maxHp = Math.round(baseHp * 3.2);
                    boss.speed = 3.6;
                    boss.reward = 1000000;
                }

                boss.hp = boss.maxHp;
                boss.y = -80;
                boss.x = canvas.width/2 - boss.w/2;
                boss.dropTimer = 0;
                
                isCutscene = true;
                cutsceneTimer = 180;
                const warnEl = document.getElementById('cutscene-warning');
                warnEl.innerHTML = `⚠️ WARNING ⚠️<br>${boss.type} APPROACHING`;
                warnEl.style.color = boss.color;
                warnEl.style.display = 'block';
                document.getElementById('boss-name-label').innerText = boss.name;
                document.getElementById('boss-name-label').style.color = boss.color;
                
                playSound('siren'); setTimeout(() => playSound('siren'), 1000); setTimeout(() => playSound('siren'), 2000);
            } else {
                bossMode = false; boss.active = false;
                document.getElementById('boss-ui').style.display = 'none';
                const rows = Math.min(5, 3 + Math.floor(wave / 3));
                const cols = 8;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        aliens.push({
                            x: 45 + c * 55, y: 50 + r * 40, w: 32, h: 24, alive: true,
                            color: r === 0 ? "#ff007f" : (r < 2 ? "#a855f7" : "#00f3ff")
                        });
                    }
                }
                alienSpeed = (1 + (wave - 1) * 0.35) * difficulty.speed;
                announce(`WAVE ${wave}`);
            }
            if (wave === 1) initBunkers();
        }

        function createExplosion(x, y, color) {
            playSound('boom'); screenShake = 5;
            for(let i=0; i<12; i++){
                const angle = Math.random() * Math.PI * 2; const spd = Math.random() * 4 + 1;
                particles.push({ x: x+16, y: y+12, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 1.0, color });
            }
        }

        function playerHit(p) {
            if (p.invulnTimer > 0 || p.lives <= 0) return;

            p.lives--;
            createExplosion(p.x, p.y, p.color);
            p.rapidTimer = 0; p.dualTimer = 0; p.spreadTimer = 0; p.plasmaTimer = 0; p.omegaTimer = 0;
            updateHUD();
            playSound('player_hit');
            screenShake = 15;

            if (p.lives > 0) {
                p.x = p.id === 1 ? 220 : 280;
                p.invulnTimer = 120;
            }

            if (p1.lives <= 0 && (!isCoop || p2.lives <= 0)) {
                gameOver();
            }
        }

        function openMenu() {
            gameActive = false;
            document.getElementById("start-modal").style.display = "flex";
            document.getElementById("end-modal").style.display = "none";
        }

        function startGame(mode) {
            isCoop = (mode === 'COOP');
            if (mode === 'EASY') difficulty = { speed: 0.75, fireRate: 0.5, bossHp: 0.6, startLives: 5 };
            else if (mode === 'COOP') difficulty = { speed: 1.0, fireRate: 1.5, bossHp: 2.0, startLives: 3 };
            else if (mode === 'NORMAL') difficulty = { speed: 1.0, fireRate: 1.0, bossHp: 1.0, startLives: 3 };
            else if (mode === 'HARD') difficulty = { speed: 1.3, fireRate: 1.6, bossHp: 1.5, startLives: 1 };

            document.getElementById("start-modal").style.display = "none";
            document.getElementById("end-modal").style.display = "none";
            document.getElementById("hud-p2").style.display = isCoop ? "flex" : "none";
            
            document.getElementById("touch-left-wrap").style.display = isCoop ? "none" : "flex";
            document.getElementById("touch-right-wrap").style.display = isCoop ? "none" : "flex";
            
            wave = 1; gameActive = true; isCutscene = false;
            bullets = []; alienBullets = []; particles = []; powerups = [];
            
            [p1, p2].forEach(p => {
                p.lives = difficulty.startLives; p.score = 0;
                p.rapidTimer = 0; p.dualTimer = 0; p.spreadTimer = 0; p.plasmaTimer = 0; p.omegaTimer = 0; p.invulnTimer = 0;
            });
            p1.x = isCoop ? 180 : 250; p2.x = 320;
            if(!isCoop) p2.lives = 0;

            document.getElementById("wave").innerText = 1;
            document.getElementById('announcement').style.transform = "translate(-50%, -50%) scale(0)";
            document.getElementById('cutscene-warning').style.display = 'none';
            document.getElementById('boss-ui').style.display = 'none';
            
            updateHUD();
            initBunkers();
            spawnAliens();
        }

        window.addEventListener("keydown", e => {
            if (["ArrowLeft","ArrowRight","ArrowUp","Space","KeyA","KeyD","KeyW","a","d","w","A","D","W"," "].includes(e.key) || e.code === "Space") e.preventDefault();
            
            if (e.key === "a" || e.key === "A") p1.keys.left = true;
            if (e.key === "d" || e.key === "D") p1.keys.right = true;
            if (e.key === " " || e.code === "Space" || e.key === "w" || e.key === "W") p1.keys.shoot = true;

            if (e.key === "ArrowLeft") p2.keys.left = true;
            if (e.key === "ArrowRight") p2.keys.right = true;
            if (e.key === "ArrowUp" || e.key === "Enter") p2.keys.shoot = true;
        }, { passive: false });

        window.addEventListener("keyup", e => {
            if (e.key === "a" || e.key === "A") p1.keys.left = false;
            if (e.key === "d" || e.key === "D") p1.keys.right = false;
            if (e.key === " " || e.code === "Space" || e.key === "w" || e.key === "W") p1.keys.shoot = false;

            if (e.key === "ArrowLeft") p2.keys.left = false;
            if (e.key === "ArrowRight") p2.keys.right = false;
            if (e.key === "ArrowUp" || e.key === "Enter") p2.keys.shoot = false;
        });

        const bindTouch = (id, field) => {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener("touchstart", e => { e.preventDefault(); getAudioContext(); p1.keys[field] = true; }, { passive: false });
            el.addEventListener("touchend", e => { e.preventDefault(); p1.keys[field] = false; }, { passive: false });
        };
        bindTouch("btn-left", "left"); bindTouch("btn-right", "right"); bindTouch("btn-shoot", "shoot");

        function fireBullet(p, x, y, vx, vy, dmg, w, h, color) {
            bullets.push({ x, y, vx, vy, dmg, w, h, color, owner: p });
        }

        function updatePlayer(p) {
            if (p.lives <= 0) return;
            if (p.invulnTimer > 0) p.invulnTimer--;

            if (p.keys.left) p.x -= p.speed;
            if (p.keys.right) p.x += p.speed;
            p.x = Math.max(10, Math.min(canvas.width - 10 - p.w, p.x));

            let updateHudFlag = false;
            ['rapidTimer', 'dualTimer', 'spreadTimer', 'plasmaTimer', 'omegaTimer'].forEach(t => {
                if (p[t] > 0) { p[t]--; if (p[t] === 0) updateHudFlag = true; }
            });
            if (updateHudFlag) updateHUD();

            if (p.cooldown > 0) p.cooldown--;
            if (p.keys.shoot && p.cooldown === 0) {
                playSound(p.id === 1 ? 'shoot' : 'shoot2');
                
                const speed = (p.rapidTimer > 0 || p.omegaTimer > 0) ? 13 : 9;
                p.cooldown = (p.rapidTimer > 0 || p.omegaTimer > 0) ? 5 : 13;

                const isPlasma = p.plasmaTimer > 0;
                const dmg = isPlasma ? 4 : 1;
                const bw = isPlasma ? 12 : 6;
                const bh = isPlasma ? 22 : 14;
                const bColor = isPlasma ? '#ec4899' : (p.omegaTimer > 0 ? '#ef4444' : p.color);

                if (p.omegaTimer > 0) {
                    [-4, -2, 0, 2, 4].forEach(vx => fireBullet(p, p.x + p.w/2 - bw/2, p.y, vx, -speed, dmg, bw, bh, bColor));
                } else if (p.spreadTimer > 0) {
                    [-2.5, 0, 2.5].forEach(vx => fireBullet(p, p.x + p.w/2 - bw/2, p.y, vx, -speed, dmg, bw, bh, '#10b981'));
                } else if (p.dualTimer > 0) {
                    fireBullet(p, p.x, p.y, 0, -speed, dmg, bw, bh, bColor);
                    fireBullet(p, p.x + p.w - bw, p.y, 0, -speed, dmg, bw, bh, bColor);
                } else {
                    fireBullet(p, p.x + p.w/2 - bw/2, p.y, 0, -speed, dmg, bw, bh, bColor);
                }
            }
        }

        function applyPowerup(p, type) {
            if (type === 'dual') p.dualTimer = 500;
            else if (type === 'rapid') p.rapidTimer = 500;
            else if (type === 'spread') p.spreadTimer = 480;
            else if (type === 'plasma') p.plasmaTimer = 450;
            else if (type === 'omega') p.omegaTimer = 400;
            else if (type === 'heal') { p.lives = Math.min(6, p.lives + 1); announce("+1 LIFE RESTORED! ❤️", 1000); }
            else if (type === 'shield') { p.invulnTimer = 360; announce("PHASE SHIELD ACTIVE! 🛡️", 1000); }
            else if (type === 'emp') {
                alienBullets = [];
                if (bossMode && boss.active) {
                    boss.hp = Math.max(1, boss.hp - 25);
                    document.getElementById('boss-hp-fill').style.width = `${(boss.hp / boss.maxHp) * 100}%`;
                }
                screenShake = 20;
                announce("⚡ EMP BLAST! ⚡", 1000);
            }
            updateHUD();
            playSound('powerup');
            addCoins(5);
        }

        function update() {
            if (!gameActive) {
                stars.forEach(s => { s.y += s.speed; if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; } });
                return;
            }

            stars.forEach(s => { s.y += s.speed; if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; } });

            [p1, p2].forEach(p => updatePlayer(p));

            if (isCutscene) {
                cutsceneTimer--;
                boss.y += 0.7; 
                if (cutsceneTimer <= 0) {
                    isCutscene = false;
                    document.getElementById('cutscene-warning').style.display = 'none';
                    document.getElementById('boss-ui').style.display = 'flex';
                    document.getElementById('boss-hp-fill').style.width = '100%';
                }
            }

            // Powerups Collection
            for (let idx = powerups.length - 1; idx >= 0; idx--) {
                const pw = powerups[idx];
                pw.y += pw.speed;
                let collected = false;
                [p1, p2].forEach(p => {
                    if (!collected && p.lives > 0 && pw.x < p.x + p.w && pw.x + 20 > p.x && pw.y < p.y + p.h && pw.y + 20 > p.y) {
                        applyPowerup(p, pw.type);
                        collected = true;
                    }
                });
                if (collected || pw.y > canvas.height) powerups.splice(idx, 1);
            }

            // Player Bullets
            bullets.forEach(b => {
                b.x += (b.vx || 0);
                b.y += b.vy;
                
                bunkers.forEach(bk => {
                    if (bk.alive && b.x < bk.x + bk.w && b.x + b.w > bk.x && b.y < bk.y + bk.h && b.y + b.h > bk.y) {
                        bk.hp--; if(bk.hp<=0) bk.alive = false;
                        b.y = -100;
                    }
                });

                if (bossMode && boss.active && !isCutscene) {
                    if (b.x < boss.x + boss.w && b.x + b.w > boss.x && b.y < boss.y + boss.h && b.y + b.h > boss.y) {
                        boss.hp -= b.dmg;
                        b.y = -100;
                        document.getElementById('boss-hp-fill').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
                        
                        // 5% chance per hit to drop boss powerup
                        if (Math.random() < 0.05) {
                            spawnBossDrop(boss.x + Math.random() * boss.w, boss.y + boss.h);
                        }

                        if (boss.hp <= 0) {
                            boss.active = false;
                            createExplosion(boss.x + boss.w/2, boss.y + boss.h/2, boss.color);
                            createExplosion(boss.x, boss.y, '#facc15');
                            createExplosion(boss.x + boss.w, boss.y, '#00f3ff');
                            b.owner.score += 1000; updateHUD();
                            addCoins(boss.reward);
                            announce(`${boss.type} DEFEATED!\n+${boss.reward.toLocaleString()} GOLD!`, 2800);
                            setTimeout(() => { wave++; document.getElementById("wave").innerText = wave; spawnAliens(); }, 3000);
                        }
                    }
                } else if (!bossMode) {
                    aliens.forEach(a => {
                        if (a.alive && b.x < a.x + a.w && b.x + b.w > a.x && b.y < a.y + a.h && b.y + b.h > a.y) {
                            a.alive = false;
                            b.y = -100;
                            b.owner.score += 10; updateHUD();
                            addCoins(1);
                            createExplosion(a.x, a.y, a.color);
                            
                            if (Math.random() < 0.09) {
                                const types = ['dual', 'rapid', 'spread'];
                                powerups.push({ x: a.x + 8, y: a.y, speed: 2.3, type: types[Math.floor(Math.random()*types.length)] });
                            }
                        }
                    });
                }
            });
            bullets = bullets.filter(b => b.y > 0 && b.x > 0 && b.x < canvas.width);

            // Boss Behavior & Attacks
            if (bossMode && boss.active && !isCutscene) {
                boss.x += boss.speed * boss.dir * difficulty.speed;
                if (boss.x <= 10 || boss.x + boss.w >= canvas.width - 10) boss.dir *= -1;
                
                // Guaranteed periodic powerup supply drop every ~3.5 seconds during boss fights
                boss.dropTimer++;
                if (boss.dropTimer > 210) {
                    boss.dropTimer = 0;
                    spawnBossDrop(boss.x + boss.w/2, boss.y + boss.h);
                }

                boss.timer++;
                const fireInterval = (boss.type === 'YONGHAO' ? 32 : (boss.type === 'CANMING' ? 40 : 48)) / difficulty.fireRate;
                if (boss.timer > fireInterval) {
                    boss.timer = 0;
                    if (boss.type === 'SHIVNAND') {
                        alienBullets.push({ x: boss.x + 20, y: boss.y + boss.h, vx: 0, vy: 5, w: 8, h: 16, color: '#10b981' });
                        alienBullets.push({ x: boss.x + boss.w - 20, y: boss.y + boss.h, vx: 0, vy: 5, w: 8, h: 16, color: '#10b981' });
                    } else if (boss.type === 'CANMING') {
                        [-1.5, 0, 1.5].forEach(vx => {
                            alienBullets.push({ x: boss.x + boss.w/2, y: boss.y + boss.h, vx, vy: 5.5, w: 9, h: 16, color: '#a855f7' });
                        });
                    } else if (boss.type === 'YONGHAO') {
                        [-3, -1.5, 0, 1.5, 3].forEach(vx => {
                            alienBullets.push({ x: boss.x + boss.w/2, y: boss.y + boss.h, vx, vy: 6.0, w: 10, h: 18, color: '#ef4444' });
                        });
                    }
                }
            } else if (!bossMode) {
                let activeAliens = aliens.filter(a => a.alive);
                if (activeAliens.length === 0) {
                    wave++;
                    addCoins(10);
                    document.getElementById("wave").innerText = wave;
                    spawnAliens();
                    return;
                }

                let edgeHit = false;
                activeAliens.forEach(a => {
                    a.x += alienSpeed * alienDir;
                    if (a.x <= 10 || a.x + a.w >= canvas.width - 10) edgeHit = true;
                    
                    if (Math.random() < 0.0015 * wave * difficulty.fireRate) {
                        alienBullets.push({ x: a.x + a.w / 2, y: a.y + a.h, vx: 0, vy: 4, w: 4, h: 12, color: '#ff007f' });
                    }
                    
                    [p1, p2].forEach(p => {
                        if (p.lives > 0 && p.invulnTimer <= 0 && a.y + a.h >= p.y && a.y <= p.y + p.h && a.x + a.w >= p.x && a.x <= p.x + p.w) {
                            playerHit(p);
                        }
                    });

                    if (a.y + a.h >= canvas.height - 20) {
                        p1.lives = 0; p2.lives = 0; updateHUD(); gameOver();
                    }
                });

                if (edgeHit) {
                    alienDir = -alienDir;
                    activeAliens.forEach(a => a.y += 20);
                }
            }

            alienBullets.forEach(ab => {
                ab.x += (ab.vx || 0);
                ab.y += ab.vy;
                bunkers.forEach(bk => {
                    if (bk.alive && ab.x < bk.x + bk.w && ab.x + ab.w > bk.x && ab.y < bk.y + bk.h && ab.y + ab.h > bk.y) {
                        bk.hp--; if(bk.hp<=0) bk.alive = false; ab.y = canvas.height + 100;
                    }
                });

                [p1, p2].forEach(p => {
                    if (p.lives > 0 && p.invulnTimer <= 0 && ab.x < p.x + p.w && ab.x + ab.w > p.x && ab.y < p.y + p.h && ab.y + ab.h > p.y) {
                        ab.y = canvas.height + 100;
                        playerHit(p);
                    }
                });
            });
            alienBullets = alienBullets.filter(ab => ab.y < canvas.height && ab.x > 0 && ab.x < canvas.width);

            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.04; });
            particles = particles.filter(p => p.life > 0);
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('boss-ui').style.display = 'none';
            document.getElementById('announcement').style.transform = "translate(-50%, -50%) scale(0)";
            
            setTimeout(() => {
                document.getElementById('end-modal').style.display = "flex";
                document.getElementById('final-score').innerText = p1.score + (isCoop ? p2.score : 0);
                document.getElementById('final-wave').innerText = wave;
            }, 1000);
        }

        function drawPlayer(p) {
            if (p.lives <= 0) return;
            if (p.invulnTimer === 0 || Math.floor(p.invulnTimer / 5) % 2 === 0) {
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10; ctx.shadowColor = p.color;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillRect(p.x + 14, p.y - 10, 12, 10);
                if (p.dualTimer > 0 || p.omegaTimer > 0) {
                    ctx.fillStyle = p.omegaTimer > 0 ? "#ef4444" : p.color;
                    ctx.fillRect(p.x - 4, p.y + 4, 8, 16); ctx.fillRect(p.x + p.w - 4, p.y + 4, 8, 16);
                }
                if (p.invulnTimer > 120) {
                    ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(p.x + p.w/2, p.y + p.h/2, 30, 0, Math.PI*2); ctx.stroke();
                }
                ctx.shadowBlur = 0;
            }
        }

        function render() {
            ctx.save();
            if (screenShake > 0.5) {
                ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
                screenShake *= 0.85;
            }
            
            ctx.fillStyle = "#020617";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
            stars.forEach(s => { ctx.fillRect(s.x, s.y, s.size, s.size); });

            if (gameActive || p1.invulnTimer > 0 || p2.invulnTimer > 0) {
                drawPlayer(p1);
                if (isCoop) drawPlayer(p2);
            }

            // Render Creative Powerups with Labels
            powerups.forEach(p => {
                const meta = POWERUP_META[p.type] || { color: '#facc15', label: 'PWR' };
                ctx.fillStyle = meta.color;
                ctx.shadowBlur = 10; ctx.shadowColor = meta.color;
                ctx.beginPath(); ctx.arc(p.x + 10, p.y + 10, 10, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = "#fff";
                ctx.font = "bold 9px sans-serif";
                ctx.fillText(meta.label, p.x + 10 - ctx.measureText(meta.label).width/2, p.y - 4);
            });

            ctx.shadowBlur = 5; ctx.shadowColor = "#10b981";
            bunkers.forEach(bk => {
                if (bk.alive) {
                    ctx.fillStyle = bk.hp === 2 ? "#10b981" : "#059669";
                    ctx.fillRect(bk.x, bk.y, bk.w-1, bk.h-1);
                }
            });
            ctx.shadowBlur = 0;

            bullets.forEach(b => { ctx.fillStyle = b.color; ctx.shadowBlur = 8; ctx.shadowColor = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); });
            alienBullets.forEach(ab => { ctx.fillStyle = ab.color; ctx.shadowBlur = 8; ctx.shadowColor = ab.color; ctx.fillRect(ab.x, ab.y, ab.w, ab.h); });
            ctx.shadowBlur = 0;

            if (bossMode && boss.active) {
                if (isCutscene) {
                    ctx.fillStyle = "rgba(239, 68, 68, 0.18)";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
                ctx.fillStyle = boss.color;
                ctx.shadowBlur = 18; ctx.shadowColor = boss.color;
                ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                
                // Boss Crown / Details for higher tiers
                if (boss.type === 'CANMING' || boss.type === 'YONGHAO') {
                    ctx.fillStyle = "#facc15";
                    ctx.fillRect(boss.x + 15, boss.y - 10, boss.w - 30, 10);
                }
                ctx.fillStyle = "#000";
                ctx.fillRect(boss.x + 22, boss.y + 20, 16, 16);
                ctx.fillRect(boss.x + boss.w - 38, boss.y + 20, 16, 16);
                ctx.fillStyle = "#facc15";
                ctx.fillRect(boss.x + boss.w/2 - 14, boss.y + boss.h - 12, 28, 10);
            } else {
                aliens.forEach(a => {
                    if (a.alive) {
                        ctx.fillStyle = a.color;
                        ctx.shadowBlur = 8; ctx.shadowColor = a.color;
                        ctx.fillRect(a.x, a.y, a.w, a.h);
                        ctx.fillStyle = "#000"; 
                        ctx.fillRect(a.x + 6, a.y + 6, 6, 6);
                        ctx.fillRect(a.x + a.w - 12, a.y + 6, 6, 6);
                    }
                });
            }
            ctx.shadowBlur = 0;

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI*2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;
            ctx.restore();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        applyGlobalTheme();
        updateWallet();
        initStars();
        gameLoop(); 
        openMenu();
    </script>
</body>
</html>
