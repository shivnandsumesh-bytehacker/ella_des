<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Flight Simulator</title>
    <script src="arcade.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --primary: #00f3ff; --accent: #ff007f; --bg: #0f172a; --card: #1e293b; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; overflow-x: hidden; }
        
        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 20px; border-radius: 12px; border: 2px solid var(--primary); margin-bottom: 12px; box-sizing: border-box; }
        .stats { font-size: 1.1rem; font-weight: bold; color: #facc15; }
        .status { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: var(--primary); min-height: 26px; }
        
        #canvas-container { width: 100%; max-width: 800px; height: 420px; border: 3px solid var(--primary); border-radius: 12px; box-shadow: 0 0 25px rgba(0, 243, 255, 0.25); overflow: hidden; position: relative; }
        canvas { width: 100% !important; height: 100% !important; display: block; }
        
        .hud-panel { display: flex; gap: 10px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { background: var(--primary); color: #000; border: none; padding: 10px 18px; font-size: 0.95rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div>Stage: <span id="stage-text" style="color:var(--primary)">1 - BOARDING</span></div>
        <div class="stats">🪙 Wallet: <span id="coin-count">0</span></div>
    </header>

    <div class="status" id="status">Steer to Passengers (A/D or Arrows)!</div>

    <div id="canvas-container"></div>

    <div class="hud-panel">
        <button class="btn" onclick="resetFlight()">Restart Flight</button>
    </div>

    <script>
        let scene, camera, renderer, planeGroup;
        let stage = "BOARDING"; 
        let gameActive = true;
        let passengersCollected = 0;
        let ringsPassed = 0;

        let passengers3D = [];
        let rings3D = [];

        const planePos = { x: 0, y: 1.5, z: 0, speed: 0.8, pitch: 0, roll: 0 };
        const keys = { W: false, S: false, A: false, D: false };

        function updateWallet() {
            const coins = parseInt(localStorage.getItem('arcade_coins')) || 0;
            document.getElementById('coin-count').innerText = coins.toLocaleString();
        }

        function addCoins(amount) {
            let coins = parseInt(localStorage.getItem('arcade_coins')) || 0;
            localStorage.setItem('arcade_coins', coins + amount);
            updateWallet();
        }

        // Window Controls & Lock Scroll
        window.addEventListener("keydown", e => {
            if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","KeyW","KeyA","KeyS","KeyD","Space"].includes(e.code)) {
                e.preventDefault();
            }
            if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.W = true;
            if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") keys.S = true;
            if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") keys.A = true;
            if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") keys.D = true;
        }, { passive: false });

        window.addEventListener("keyup", e => {
            if (e.key === "w" || e.key === "W" || e.key === "ArrowUp") keys.W = false;
            if (e.key === "s" || e.key === "S" || e.key === "ArrowDown") keys.S = false;
            if (e.key === "a" || e.key === "A" || e.key === "ArrowLeft") keys.A = false;
            if (e.key === "d" || e.key === "D" || e.key === "ArrowRight") keys.D = false;
        });

        function init3D() {
            const container = document.getElementById("canvas-container");
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.003);

            camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            // 3D Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0x00f3ff, 0.8);
            sun.position.set(50, 100, 50);
            scene.add(sun);

            // 3D Runway & Ground Terrain
            const groundGeo = new THREE.PlaneGeometry(1000, 1000);
            const groundMat = new THREE.MeshPhongMaterial({ color: 0x1e293b, side: THREE.DoubleSide });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = Math.PI / 2;
            scene.add(ground);

            const runwayGeo = new THREE.PlaneGeometry(30, 800);
            const runwayMat = new THREE.MeshBasicMaterial({ color: 0x334155 });
            const runway = new THREE.Mesh(runwayGeo, runwayMat);
            runway.rotation.x = Math.PI / 2;
            runway.position.set(0, 0.1, -300);
            scene.add(runway);

            // Construct 3D Airplane Model
            planeGroup = new THREE.Group();

            const bodyGeo = new THREE.ConeGeometry(1.2, 7, 8);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x00f3ff });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 2;
            planeGroup.add(body);

            const wingGeo = new THREE.BoxGeometry(10, 0.2, 2);
            const wingMat = new THREE.MeshPhongMaterial({ color: 0xff007f });
            const wing = new THREE.Mesh(wingGeo, wingMat);
            wing.position.set(0, 0, 0);
            planeGroup.add(wing);

            scene.add(planeGroup);

            spawnPassengers();
            spawnRings();
        }

        function spawnPassengers() {
            for (let i = 0; i < 5; i++) {
                const geo = new THREE.SphereGeometry(1.2, 16, 16);
                const mat = new THREE.MeshPhongMaterial({ color: 0xfacc15, emissive: 0xfacc15, emissiveIntensity: 0.5 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set((Math.random() - 0.5) * 20, 1.2, -50 - i * 80);
                scene.add(mesh);
                passengers3D.push({ mesh, collected: false });
            }
        }

        function spawnRings() {
            for (let i = 0; i < 8; i++) {
                const geo = new THREE.TorusGeometry(8, 0.8, 16, 32);
                const mat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
                const ring = new THREE.Mesh(geo, mat);
                ring.position.set((Math.random() - 0.5) * 60, 20 + Math.random() * 30, -500 - i * 120);
                scene.add(ring);
                rings3D.push({ mesh: ring, passed: false });
            }
        }

        function updatePhysics() {
            if (!gameActive) return;

            // Move Plane Forward
            planePos.z -= planePos.speed;

            if (stage === "BOARDING") {
                if (keys.A) planePos.x -= 0.3;
                if (keys.D) planePos.x += 0.3;
                planePos.roll = keys.A ? 0.2 : (keys.D ? -0.2 : 0);

                passengers3D.forEach(p => {
                    if (!p.collected && Math.hypot(planePos.x - p.mesh.position.x, planePos.z - p.mesh.position.z) < 4) {
                        p.collected = true;
                        p.mesh.visible = false;
                        passengersCollected++;
                        addCoins(2);
                        document.getElementById("status").innerText = `Passengers Boarded: ${passengersCollected}/5`;
                    }
                });

                if (passengersCollected >= 5) {
                    stage = "TAKEOFF";
                    document.getElementById("stage-text").innerText = "2 - TAKEOFF";
                    document.getElementById("status").innerText = "Pull Up (W or Up Arrow) to Take Off!";
                }
            } 
            else if (stage === "TAKEOFF") {
                if (keys.W) {
                    planePos.y += 0.4;
                    planePos.pitch = -0.3;
                }
                if (planePos.y >= 20) {
                    stage = "FLIGHT";
                    document.getElementById("stage-text").innerText = "3 - SKY RINGS";
                    document.getElementById("status").innerText = "Fly through the 3D Sky Rings!";
                }
            } 
            else if (stage === "FLIGHT") {
                if (keys.W) planePos.y += 0.4;
                if (keys.S) planePos.y -= 0.4;
                if (keys.A) planePos.x -= 0.4;
                if (keys.D) planePos.x += 0.4;

                planePos.pitch = keys.W ? -0.2 : (keys.S ? 0.2 : 0);
                planePos.roll = keys.A ? 0.3 : (keys.D ? -0.3 : 0);

                rings3D.forEach(r => {
                    if (!r.passed && Math.hypot(planePos.x - r.mesh.position.x, planePos.y - r.mesh.position.y, planePos.z - r.mesh.position.z) < 9) {
                        r.passed = true;
                        r.mesh.material.color.setHex(0xff007f);
                        ringsPassed++;
                        addCoins(3);
                        document.getElementById("status").innerText = `Rings Cleared: ${ringsPassed}/8`;
                    }
                });

                if (ringsPassed >= 8) {
                    gameActive = false;
                    addCoins(20);
                    document.getElementById("status").innerText = "🏆 MISSION COMPLETE! +20 Bonus Coins!";
                }
            }

            // Sync 3D Plane Mesh
            planeGroup.position.set(planePos.x, planePos.y, planePos.z);
            planeGroup.rotation.set(planePos.pitch, 0, planePos.roll);

            // Follow Camera
            camera.position.set(planePos.x, planePos.y + 6, planePos.z + 20);
            camera.lookAt(planePos.x, planePos.y + 2, planePos.z - 20);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            renderer.render(scene, camera);
        }

        function resetFlight() {
            planePos.x = 0; planePos.y = 1.5; planePos.z = 0;
            passengersCollected = 0; ringsPassed = 0;
            stage = "BOARDING"; gameActive = true;

            document.getElementById("stage-text").innerText = "1 - BOARDING";
            document.getElementById("status").innerText = "Steer to Passengers (A/D or Arrows)!";

            passengers3D.forEach(p => { p.collected = false; p.mesh.visible = true; });
            rings3D.forEach(r => { r.passed = false; r.mesh.material.color.setHex(0x00f3ff); });
            updateWallet();
        }

        document.addEventListener("DOMContentLoaded", () => {
            init3D();
            updateWallet();
            animate();
        });
    </script>
</body>
</html>
