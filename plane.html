<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Sky Striker - Arcade Flight</title>
    <script src="arcade.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #00f3ff;
            --primary-glow: rgba(0, 243, 255, 0.4);
            --accent: #ff007f;
            --gold: #facc15;
            --emerald: #10b981;
            --bg: #030712;
            --card: #0b1329;
            --panel-bg: rgba(11, 19, 41, 0.92);
        }
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 6px 20px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            margin-bottom: 4px;
            box-shadow: 0 0 18px var(--primary-glow);
        }
        .stats { font-size: 1.05rem; font-weight: bold; color: var(--gold); }
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; }
        a.nav:hover { text-shadow: 0 0 8px var(--primary); }

        #game-wrapper {
            width: 100%;
            max-width: 1200px;
            height: calc(100vh - 82px);
            max-height: 720px;
            border: 3px solid var(--primary);
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25);
            position: relative;
            overflow: hidden;
            background: #38bdf8;
            touch-action: none;
        }
        #webgl-canvas { width: 100% !important; height: 100% !important; display: block; touch-action: none; }

        .hud-panel {
            background: var(--panel-bg);
            border: 1.5px solid rgba(0, 243, 255, 0.4);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.82rem;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            pointer-events: auto;
        }

        .hud-top-left {
            position: absolute;
            top: 12px;
            left: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 15;
            pointer-events: none;
        }
        .hud-top-right {
            position: absolute;
            top: 12px;
            right: 14px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            z-index: 15;
            pointer-events: none;
        }

        #boost-hud {
            position: absolute;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            pointer-events: none;
            z-index: 15;
        }
        .boost-bar-frame {
            width: 170px;
            height: 10px;
            background: #1e293b;
            border: 1.5px solid var(--primary);
            border-radius: 6px;
            overflow: hidden;
        }
        .boost-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #ff007f);
            transition: width 0.1s linear;
        }

        #banner-msg {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: #000;
            font-weight: 900;
            padding: 8px 24px;
            border-radius: 20px;
            font-size: 1.15rem;
            display: none;
            pointer-events: none;
            box-shadow: 0 0 25px var(--primary);
            z-index: 25;
        }

        .touch-zone {
            position: absolute;
            bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
            touch-action: none;
        }
        #touch-left { left: 14px; }
        #touch-right { right: 14px; }

        .ctrl-btn {
            width: 50px;
            height: 50px;
            background: var(--panel-bg);
            border: 1.5px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-size: 0.82rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn:active { background: var(--primary); color: #000; }
        .ctrl-btn.boost-btn { border-color: var(--accent); color: var(--accent); }
        .ctrl-btn.boost-btn:active { background: var(--accent); color: #fff; }

        .hud-bottom {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 15;
        }
        .slot {
            background: var(--panel-bg);
            border: 1.5px solid #334155;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .slot:hover { border-color: var(--primary); }

        .controls-info { margin-top: 4px; font-size: 0.76rem; color: #94a3b8; max-width: 1200px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div>✈️ <strong>3D SKY STRIKER</strong> | Ring: <span id="ring-count" style="color:var(--primary); font-weight:bold;">0</span> / 20</div>
        <div class="stats">🪙 Gold: <span id="coin-count">0</span> | Score: <span id="score-display">0</span></div>
    </header>

    <div id="game-wrapper">
        <canvas id="webgl-canvas"></canvas>

        <div class="hud-top-left">
            <div class="hud-panel">
                <div style="font-weight:bold; color:var(--primary);">AIRSPEED</div>
                <div id="spd-display" style="font-size:1.2rem; font-weight:900; color:#fff;">160 KM/H</div>
            </div>
        </div>

        <div class="hud-top-right">
            <div class="hud-panel" style="text-align:right;">
                <div style="font-weight:bold; color:var(--gold);">ALTITUDE</div>
                <div id="alt-display" style="font-size:1.2rem; font-weight:900; color:#fff;">85 M</div>
            </div>
        </div>

        <div id="boost-hud">
            <div class="boost-bar-frame"><div class="boost-bar-fill" id="boost-fill"></div></div>
            <span style="font-size:0.65rem; color:#cbd5e1; font-weight:bold; letter-spacing:1px;">AFTERBURNER [SHIFT]</span>
        </div>

        <div id="banner-msg">RING CLEARED! +50</div>

        <div class="touch-zone" id="touch-left">
            <div class="ctrl-btn" id="btn-touch-left">◀</div>
            <div style="display:flex; flex-direction:column; gap:6px;">
                <div class="ctrl-btn" id="btn-touch-up">▲</div>
                <div class="ctrl-btn" id="btn-touch-down">▼</div>
            </div>
            <div class="ctrl-btn" id="btn-touch-right">▶</div>
        </div>

        <div class="touch-zone" id="touch-right">
            <div class="ctrl-btn boost-btn" id="btn-touch-boost">⚡<br><small>BOOST</small></div>
            <div class="ctrl-btn" id="btn-touch-cam">🎥<br><small>CAM</small></div>
        </div>

        <div class="hud-bottom">
            <div class="slot" onclick="cycleCamera()">[C] Camera</div>
            <div class="slot" onclick="resetFlight()" style="color:var(--accent);">[R] Respawn</div>
        </div>
    </div>

    <div class="controls-info">
        <strong>Steer:</strong> [A]/[D] &nbsp;|&nbsp; <strong>Pitch Up/Down:</strong> [S]/[W] &nbsp;|&nbsp; <strong>Afterburner:</strong> [Shift] &nbsp;|&nbsp; <strong>Camera:</strong> [C] &nbsp;|&nbsp; <strong>Reset:</strong> [R]
    </div>

    <script>
        let audioCtx = null;
        let engineOsc = null, engineGain = null;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function initAudio() {
            try {
                const ctx = getAudioContext();
                if (!ctx || engineGain) return;

                engineGain = ctx.createGain();
                engineGain.gain.setValueAtTime(0.02, ctx.currentTime);
                engineGain.connect(ctx.destination);

                engineOsc = ctx.createOscillator();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.value = 90;
                engineOsc.connect(engineGain);
                engineOsc.start();
            } catch(e){}
        }

        function updateAudioPitch(ratio, isBoost) {
            if (!engineGain || !engineOsc) return;
            const ctx = getAudioContext();
            const f = 75 + ratio * (isBoost ? 180 : 110);
            engineOsc.frequency.setTargetAtTime(f, ctx.currentTime, 0.05);
            engineGain.gain.setTargetAtTime(isBoost ? 0.05 : 0.025, ctx.currentTime, 0.05);
        }

        function playRingDing() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.5, ctx.currentTime);
                osc.frequency.setValueAtTime(1318.5, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            } catch(e){}
        }

        // Flight & Player State
        const plane = {
            pos: new THREE.Vector3(0, 70, 0),
            rot: new THREE.Euler(0, 0, 0, 'YXZ'),
            speed: 45.0, // m/s
            minSpeed: 35.0,
            maxSpeed: 65.0,
            pitch: 0,
            roll: 0,
            yaw: 0,
            boostFuel: 100,
            isBoosting: false
        };

        const keys = { w: false, s: false, a: false, d: false, shift: false };
        let cameraMode = 0; // 0: Chase, 1: Cockpit
        let rings = [];
        let currentRingIndex = 0;
        let score = 0;
        let gold = 0;
        let propellerMesh = null;

        let scene, camera, renderer, planeGroup;

        // Ring Course Setup
        const COURSE_COORDS = [
            [0, 65, 180], [60, 80, 400], [140, 95, 680], [180, 75, 960],
            [120, 60, 1240], [-20, 75, 1480], [-160, 90, 1680], [-240, 80, 1400],
            [-220, 65, 1080], [-140, 70, 760], [-40, 85, 480], [0, 70, 200]
        ];

        function buildAirplane() {
            planeGroup = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 });
            const wingMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.4 });
            const accentMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.4 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.1, transparent: true, opacity: 0.75 });

            // Fuselage
            const fuselage = new THREE.Mesh(new THREE.ConeGeometry(1.0, 7.0, 8), bodyMat);
            fuselage.rotation.x = Math.PI / 2;
            planeGroup.add(fuselage);

            // Canopy
            const canopy = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 1.8), glassMat);
            canopy.position.set(0, 0.65, 0.4);
            planeGroup.add(canopy);

            // Main Wings
            const wings = new THREE.Mesh(new THREE.BoxGeometry(9.5, 0.12, 1.6), wingMat);
            wings.position.set(0, 0.1, 0.5);
            planeGroup.add(wings);

            // Wingtip accents
            [-4.7, 4.7].forEach(x => {
                const tip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 1.4), accentMat);
                tip.position.set(x, 0.2, 0.5);
                planeGroup.add(tip);
            });

            // Tailfin
            const fin = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.6, 1.2), accentMat);
            fin.position.set(0, 0.9, -2.7);
            fin.rotation.x = -0.3;
            planeGroup.add(fin);

            // Stabilizer
            const stab = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.1, 0.8), wingMat);
            stab.position.set(0, 0.2, -2.8);
            planeGroup.add(stab);

            // Propeller
            const propHub = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.2, 8), accentMat);
            propHub.rotation.x = Math.PI / 2;
            propHub.position.set(0, 0, 3.55);
            const propBlade = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.04), new THREE.MeshBasicMaterial({ color: 0x111827 }));
            propHub.add(propBlade);
            planeGroup.add(propHub);
            propellerMesh = propBlade;

            scene.add(planeGroup);
        }

        function buildEnvironment() {
            // Sea Surface
            const ocean = new THREE.Mesh(
                new THREE.PlaneGeometry(6000, 6000),
                new THREE.MeshStandardMaterial({ color: 0x0369a1, roughness: 0.2 })
            );
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = 0;
            scene.add(ocean);

            // Islands
            const islandGeo = new THREE.ConeGeometry(70, 50, 7);
            const islandMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.9, flatShading: true });
            [
                [100, 0, 450], [-180, 0, 800], [220, 0, 1100], [-120, 0, 1500]
            ].forEach(pos => {
                const isle = new THREE.Mesh(islandGeo, islandMat);
                isle.position.set(pos[0], 20, pos[2]);
                scene.add(isle);
            });

            // Rings
            const ringGeo = new THREE.TorusGeometry(8.5, 0.6, 8, 24);
            const activeMat = new THREE.MeshBasicMaterial({ color: 0x00f3ff });
            const dormantMat = new THREE.MeshBasicMaterial({ color: 0x334155 });

            COURSE_COORDS.forEach((c, idx) => {
                const ringMesh = new THREE.Mesh(ringGeo, idx === 0 ? activeMat : dormantMat);
                ringMesh.position.set(c[0], c[1], c[2]);
                ringMesh.lookAt(c[0], c[1], c[2] + 20);
                scene.add(ringMesh);
                rings.push({ mesh: ringMesh, pos: new THREE.Vector3(c[0], c[1], c[2]), cleared: false });
            });
        }

        function init3D() {
            const container = document.getElementById("game-wrapper");
            const w = container.clientWidth || 1200;
            const h = container.clientHeight || 700;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7dd3fc);
            scene.fog = new THREE.Fog(0x7dd3fc, 200, 900);

            camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 1500);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById("webgl-canvas"),
                antialias: false,
                powerPreference: "high-performance"
            });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));

            const ambient = new THREE.AmbientLight(0xffffff, 0.85);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xfffaed, 1.2);
            sun.position.set(200, 400, 100);
            scene.add(sun);

            buildAirplane();
            buildEnvironment();
            setupControls();

            window.addEventListener('resize', () => {
                const nw = container.clientWidth || 1200;
                const nh = container.clientHeight || 700;
                camera.aspect = nw / nh;
                camera.updateProjectionMatrix();
                renderer.setSize(nw, nh);
            });
        }

        function setupControls() {
            window.addEventListener('keydown', e => {
                const c = e.code;
                if (['KeyW','KeyS','KeyA','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','ShiftLeft','ShiftRight','KeyC','KeyR'].includes(c)) {
                    e.preventDefault();
                }
                initAudio();
                if (c === 'KeyW' || c === 'ArrowUp') keys.w = true;
                if (c === 'KeyS' || c === 'ArrowDown') keys.s = true;
                if (c === 'KeyA' || c === 'ArrowLeft') keys.a = true;
                if (c === 'KeyD' || c === 'ArrowRight') keys.d = true;
                if (c === 'ShiftLeft' || c === 'ShiftRight') keys.shift = true;
                if (c === 'KeyC') cycleCamera();
                if (c === 'KeyR') resetFlight();
            });

            window.addEventListener('keyup', e => {
                const c = e.code;
                if (c === 'KeyW' || c === 'ArrowUp') keys.w = false;
                if (c === 'KeyS' || c === 'ArrowDown') keys.s = false;
                if (c === 'KeyA' || c === 'ArrowLeft') keys.a = false;
                if (c === 'KeyD' || c === 'ArrowRight') keys.d = false;
                if (c === 'ShiftLeft' || c === 'ShiftRight') keys.shift = false;
            });

            const bindBtn = (id, onStart, onEnd) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', e => { e.preventDefault(); initAudio(); onStart(); }, { passive: false });
                if (onEnd) el.addEventListener('touchend', e => { e.preventDefault(); onEnd(); }, { passive: false });
            };

            bindBtn('btn-touch-up', () => keys.w = true, () => keys.w = false);
            bindBtn('btn-touch-down', () => keys.s = true, () => keys.s = false);
            bindBtn('btn-touch-left', () => keys.a = true, () => keys.a = false);
            bindBtn('btn-touch-right', () => keys.d = true, () => keys.d = false);
            bindBtn('btn-touch-boost', () => keys.shift = true, () => keys.shift = false);
            document.getElementById('btn-touch-cam').addEventListener('click', cycleCamera);
        }

        function cycleCamera() {
            cameraMode = (cameraMode + 1) % 2;
        }

        function resetFlight() {
            plane.pos.set(0, 70, 0);
            plane.pitch = 0;
            plane.roll = 0;
            plane.yaw = 0;
            plane.boostFuel = 100;
            currentRingIndex = 0;
            rings.forEach((r, idx) => {
                r.cleared = false;
                r.mesh.material.color.setHex(idx === 0 ? 0x00f3ff : 0x334155);
            });
            document.getElementById('ring-count').innerText = '0';
        }

        function showBanner(txt) {
            const b = document.getElementById('banner-msg');
            b.innerText = txt;
            b.style.display = 'block';
            setTimeout(() => { b.style.display = 'none'; }, 1200);
        }

        function updatePhysics(dt) {
            // 1. Boost Fuel
            if (keys.shift && plane.boostFuel > 5) {
                plane.isBoosting = true;
                plane.boostFuel = Math.max(0, plane.boostFuel - 30 * dt);
                plane.speed = THREE.MathUtils.lerp(plane.speed, plane.maxSpeed, 0.12);
            } else {
                plane.isBoosting = false;
                plane.boostFuel = Math.min(100, plane.boostFuel + 8 * dt);
                plane.speed = THREE.MathUtils.lerp(plane.speed, plane.minSpeed, 0.08);
            }
            document.getElementById('boost-fill').style.width = `${plane.boostFuel}%`;

            // 2. Smooth Steering & Auto-Leveling
            const steerRate = 1.6;
            if (keys.a) {
                plane.roll = THREE.MathUtils.lerp(plane.roll, 0.75, 0.1);
                plane.yaw += steerRate * dt;
            } else if (keys.d) {
                plane.roll = THREE.MathUtils.lerp(plane.roll, -0.75, 0.1);
                plane.yaw -= steerRate * dt;
            } else {
                plane.roll = THREE.MathUtils.lerp(plane.roll, 0, 0.08);
            }

            // Pitch Controls: S pulls nose UP (+pitch), W pushes nose DOWN (-pitch)
            if (keys.s) {
                plane.pitch = THREE.MathUtils.lerp(plane.pitch, 0.5, 0.1);
            } else if (keys.w) {
                plane.pitch = THREE.MathUtils.lerp(plane.pitch, -0.5, 0.1);
            } else {
                plane.pitch = THREE.MathUtils.lerp(plane.pitch, 0, 0.08);
            }

            // 3. Movement Forward in Direction of Yaw/Pitch
            const forward = new THREE.Vector3(
                Math.sin(plane.yaw) * Math.cos(plane.pitch),
                Math.sin(plane.pitch),
                Math.cos(plane.yaw) * Math.cos(plane.pitch)
            );
            plane.pos.addScaledVector(forward, plane.speed * dt);

            // Water Surface Collision Buffer
            if (plane.pos.y < 6.0) {
                plane.pos.y = 6.0;
                plane.pitch = 0.2; // Auto pitch up from water
            }

            // 4. Update Model
            planeGroup.position.copy(plane.pos);
            planeGroup.rotation.set(plane.pitch, plane.yaw, plane.roll, 'YXZ');

            if (propellerMesh) {
                propellerMesh.rotation.z += (plane.isBoosting ? 0.9 : 0.45);
            }

            // 5. Ring Collision Check
            if (currentRingIndex < rings.length) {
                const targetRing = rings[currentRingIndex];
                const distToRing = plane.pos.distanceTo(targetRing.pos);

                if (distToRing < 12.0 && !targetRing.cleared) {
                    targetRing.cleared = true;
                    targetRing.mesh.material.color.setHex(0x10b981);
                    currentRingIndex++;
                    score += 50;
                    gold += 5;
                    localStorage.setItem('arcade_coins', parseInt(localStorage.getItem('arcade_coins') || 0) + 5);
                    plane.boostFuel = Math.min(100, plane.boostFuel + 35);
                    playRingDing();
                    showBanner(`RING CLEARED! (${currentRingIndex}/${rings.length})`);

                    if (currentRingIndex < rings.length) {
                        rings[currentRingIndex].mesh.material.color.setHex(0x00f3ff);
                    } else {
                        showBanner('🏆 COURSE COMPLETED! +100 GOLD');
                        gold += 100;
                        localStorage.setItem('arcade_coins', parseInt(localStorage.getItem('arcade_coins') || 0) + 100);
                    }

                    document.getElementById('ring-count').innerText = currentRingIndex;
                    document.getElementById('score-display').innerText = score;
                    document.getElementById('coin-count').innerText = localStorage.getItem('arcade_coins') || 0;
                }
            }

            // 6. Camera Follow
            if (cameraMode === 0) {
                // Smooth Chase Camera
                const camOffset = new THREE.Vector3(
                    -Math.sin(plane.yaw) * 12.0,
                    3.8 - Math.sin(plane.pitch) * 4.0,
                    -Math.cos(plane.yaw) * 12.0
                );
                camera.position.lerp(plane.pos.clone().add(camOffset), 0.15);
                camera.lookAt(plane.pos.clone().add(new THREE.Vector3(0, 1.2, 0)).addScaledVector(forward, 15));
            } else {
                // Cockpit Cam
                camera.position.copy(plane.pos).add(new THREE.Vector3(0, 0.7, 0.4));
                camera.lookAt(plane.pos.clone().addScaledVector(forward, 40));
            }

            // HUD
            document.getElementById('spd-display').innerText = `${Math.round(plane.speed * 3.6)} KM/H`;
            document.getElementById('alt-display').innerText = `${Math.round(plane.pos.y)} M`;
            updateAudioPitch(plane.speed / plane.maxSpeed, plane.isBoosting);
        }

        let lastTime = performance.now();
        function animate(now) {
            requestAnimationFrame(animate);
            const dt = Math.min((now - lastTime) / 1000, 0.02);
            lastTime = now;

            updatePhysics(dt);
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('coin-count').innerText = localStorage.getItem('arcade_coins') || 0;
            init3D();
            requestAnimationFrame(animate);
        });
    </script>
</body>
</html>
