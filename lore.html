<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Chronicles: Zelda Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8;
            --accent: #f43f5e;
            --gold: #eab308;
            --emerald: #10b981;
            --bg: #05070b;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            touch-action: none;
        }

        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            image-rendering: pixelated;
        }

        /* Zelda Style HUD Overlay */
        #hud {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 10;
            display: none;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .hud-box {
            background: rgba(10, 14, 24, 0.92);
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 10px 16px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
        }

        .heart-container {
            display: flex;
            gap: 4px;
            color: #f43f5e;
            font-size: 0.9rem;
        }

        /* Cinematic Zelda Dialogue Box */
        #dialogue-box {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: min(720px, 92vw);
            background: rgba(10, 12, 20, 0.96);
            border: 3px solid var(--primary);
            border-radius: 12px;
            padding: 20px 24px;
            z-index: 40;
            display: none;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        #dialogue-speaker {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: var(--gold);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        #dialogue-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #f1f5f9;
            min-height: 48px;
        }

        .dialogue-prompt {
            text-align: right;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            color: var(--primary);
            margin-top: 12px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Character Select Screen */
        #start-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: radial-gradient(circle at top, #1a233a, #07090f);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .title-retro {
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(0.9rem, 2.2vw, 1.4rem);
            color: var(--gold);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 24px;
            text-shadow: 3px 3px 0px #b45309;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            width: 100%;
            max-width: 980px;
            margin-bottom: 24px;
        }

        .hero-card {
            background: #121622;
            border: 3px solid #2a344a;
            border-radius: 10px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }

        .hero-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .hero-card.selected { border-color: var(--gold); background: rgba(234, 179, 8, 0.08); }

        .hero-card h3 {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            margin: 10px 0 6px 0;
            color: #fff;
        }

        .hero-card p { font-size: 0.78rem; color: #94a3b8; line-height: 1.4; }

        .btn-retro {
            font-family: 'Press Start 2P', monospace;
            background: var(--gold);
            color: #000;
            border: 3px solid #b45309;
            border-radius: 8px;
            padding: 14px 28px;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #92400e;
            transition: transform 0.1s;
        }
        .btn-retro:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn-retro:active { transform: translateY(2px); box-shadow: none; }

        /* Mobile Controls */
        #touch-controls {
            position: fixed;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            display: none;
        }
        .dpad-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }
        .action-zone {
            position: absolute;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.3);
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #end-modal {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(5, 7, 12, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .end-card {
            background: #121622;
            border: 3px solid var(--gold);
            border-radius: 12px;
            padding: 28px;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .end-card h2 { font-family: 'Press Start 2P', monospace; font-size: 0.9rem; color: var(--gold); margin-bottom: 12px; }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <!-- Zelda Style HUD -->
    <div id="hud">
        <div class="hud-box">
            <div style="color:var(--gold);">HEALTH</div>
            <div class="heart-container" id="heart-display">❤️❤️❤️❤️</div>
        </div>
        <div class="hud-box">
            <div style="color:var(--primary);" id="boss-hud-title">DUNGEON 1/4</div>
            <div id="boss-hud-hp" style="color:#f43f5e;">BOSS HP: 100%</div>
        </div>
        <div class="hud-box">
            <div style="color:var(--emerald);">RUPEES (🪙)</div>
            <div id="hud-coins">0</div>
        </div>
    </div>

    <!-- Cinematic Dialogue Box -->
    <div id="dialogue-box" onclick="advanceDialogue()">
        <div id="dialogue-speaker">KAI JIE</div>
        <div id="dialogue-text">...</div>
        <div class="dialogue-prompt">PRESS [SPACE] OR TAP TO CONTINUE ▶</div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <div class="title-retro">⚔️ CYBER CHRONICLES: ADVENTURE EDITION ⚔️</div>
        <p style="color:#94a3b8; font-size:0.85rem; margin-bottom:20px; text-align:center;">
            Explore Zelda-style dungeons, dodge unique boss phases, and collect dungeon treasures!
        </p>

        <div class="hero-grid" id="hero-select-grid"></div>

        <button class="btn-retro" onclick="startGame()">START ADVENTURE 🗡️</button>
    </div>

    <!-- Mobile Controls -->
    <div id="touch-controls">
        <div class="dpad-zone" id="dpad"></div>
        <div class="action-zone">
            <button class="touch-btn" ontouchstart="triggerSwordSwing()">SWD</button>
            <button class="touch-btn" ontouchstart="triggerDash()" style="background:rgba(234,179,8,0.3);">DSH</button>
        </div>
    </div>

    <!-- End Game Modal -->
    <div id="end-modal">
        <div class="end-card">
            <h2 id="end-title">QUEST COMPLETE</h2>
            <p id="end-desc" style="color:#94a3b8; font-size:0.85rem; line-height:1.5; margin-bottom:16px;"></p>
            <div id="end-reward" style="font-family:'Press Start 2P'; font-size:0.7rem; color:var(--gold); margin-bottom:20px;">+0 COINS</div>
            <button class="btn-retro" onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const HEROES = [
            { id: 'shivnand', name: 'Shivnand', desc: 'The Master Swordsman with rapid blade combos.', color: '#38bdf8', hearts: 5 },
            { id: 'canming', name: 'Can Ming', desc: 'Royal 2.5x Coin Finder & fast movement speed.', color: '#eab308', hearts: 4 },
            { id: 'endra', name: 'Endra', desc: 'Heavy tank with extra hearts & shield defense.', color: '#f43f5e', hearts: 7 },
            { id: 'wengle', name: 'WengLe', desc: 'Homing magic spells & coin regeneration.', color: '#10b981', hearts: 5 }
        ];

        let selectedHero = HEROES[0];
        function renderHeroes() {
            document.getElementById('hero-select-grid').innerHTML = HEROES.map(h => `
                <div class="hero-card ${h.id === selectedHero.id ? 'selected' : ''}" onclick="selectHero('${h.id}')">
                    <div style="font-size:2rem; margin-bottom:8px;">🛡️</div>
                    <h3>${h.name}</h3>
                    <p>${h.desc}</p>
                    <div style="font-family:'Press Start 2P'; font-size:0.55rem; color:var(--gold); margin-top:10px;">❤️ ${h.hearts} HEARTS</div>
                </div>
            `).join('');
        }
        function selectHero(id) {
            selectedHero = HEROES.find(h => h.id === id);
            renderHeroes();
        }
        renderHeroes();

        // Canvas & Game State
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameActive = false;
        let isPausedForDialogue = false;
        let sessionCoins = 0;
        let dungeonIndex = 0;

        let player = null;
        let activeBoss = null;
        let dungeonRooms = [];
        let currentRoom = 0;
        let swords = [];
        let bossProjectiles = [];
        let particles = [];

        const DUNGEONS = [
            {
                name: "DUNGEON 1: THE HOOPS RUINS",
                bossName: "KAI JIE — THE SNIPER ARCHER",
                bossMaxHp: 600,
                color: "#38bdf8",
                intro: [
                    { speaker: "KAI JIE", text: "Halt adventurer! You dare step into the Hoops Ruins? My AirPod bow never misses!" },
                    { speaker: "TACTICAL GUIDE", text: "ZELDA TIP: Use [SPACE] or SWD to slash his incoming arrows, then strike when he reloads!" }
                ]
            },
            {
                name: "DUNGEON 2: THE GLITCH CRYPT",
                bossName: "RITVIK — THE PHANTOM MAGE",
                bossMaxHp: 850,
                color: "#a855f7",
                intro: [
                    { speaker: "RITVIK", text: "Foolish hero! The crypt walls shift and phase. Can you find the real me amongst my clones?" },
                    { speaker: "TACTICAL GUIDE", text: "ZELDA TIP: Ritvik leaves a purple glitch trail. Watch closely to spot his real location!" }
                ]
            },
            {
                name: "DUNGEON 3: THE HIGHWAY CASTLE",
                bossName: "DARRYL — THE CONVOY KNIGHT",
                bossMaxHp: 1100,
                color: "#f97316",
                intro: [
                    { speaker: "DARRYL", text: "Stop right there! My Double-Decker Siege Engines will flatten your party into dust!" },
                    { speaker: "TACTICAL GUIDE", text: "ZELDA TIP: Roll or dodge out of the flashing orange lanes before the convoy charges through!" }
                ]
            },
            {
                name: "DUNGEON 4: THE ELLA_DES CITADEL",
                bossName: "M DEMON — THE APEX OVERLORD",
                bossMaxHp: 1500,
                color: "#f43f5e",
                intro: [
                    { speaker: "M DEMON", text: "At last, the hero arrives at the final throne. Witness absolute destruction!" },
                    { speaker: "TACTICAL GUIDE", text: "ZELDA TIP: M Demon has 3 unique phases. Keep moving in circles and strike during his cooldowns!" }
                ]
            }
        ];

        // Controls
        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space') {
                if (isPausedForDialogue) advanceDialogue();
                else if (gameActive) slashSword();
            }
            if (e.code === 'KeyD' && gameActive) playerDash();
        });
        window.addEventListener('keyup', e => keys[e.code] = false);

        let dialogueQueue = [];
        function startDialogue(lines) {
            isPausedForDialogue = true;
            dialogueQueue = [...lines];
            document.getElementById('dialogue-box').style.display = 'block';
            advanceDialogue();
        }
        function advanceDialogue() {
            if (dialogueQueue.length === 0) {
                document.getElementById('dialogue-box').style.display = 'none';
                isPausedForDialogue = false;
                return;
            }
            const next = dialogueQueue.shift();
            document.getElementById('dialogue-speaker').innerText = next.speaker;
            document.getElementById('dialogue-text').innerText = next.text;
        }

        function startGame() {
            player = {
                x: canvas.width / 2,
                y: canvas.height / 2,
                radius: 20,
                speed: 4.2,
                hearts: selectedHero.hearts,
                maxHearts: selectedHero.hearts,
                invuln: 0,
                facing: 'DOWN',
                color: selectedHero.color
            };

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('hud-coins').innerText = (parseInt(localStorage.getItem('arcade_coins')) || 0).toLocaleString();

            dungeonIndex = 0;
            sessionCoins = 0;
            gameActive = true;
            loadDungeon(0);
            requestAnimationFrame(gameLoop);
        }

        function loadDungeon(idx) {
            const d = DUNGEONS[idx];
            document.getElementById('boss-hud-title').innerText = `DUNGEON ${idx+1}/4`;
            bossProjectiles = [];
            swords = [];

            activeBoss = {
                name: d.bossName,
                hp: d.bossMaxHp,
                maxHp: d.bossMaxHp,
                x: canvas.width / 2,
                y: canvas.height * 0.28,
                radius: 32,
                vx: 2.2,
                vy: 1.2,
                timer: 0,
                phase: 1,
                color: d.color
            };

            startDialogue(d.intro);
        }

        function slashSword() {
            if (swords.length > 0) return; // 1 sword swing at a time
            const dist = 32;
            let sx = player.x, sy = player.y;
            if (player.facing === 'UP') sy -= dist;
            if (player.facing === 'DOWN') sy += dist;
            if (player.facing === 'LEFT') sx -= dist;
            if (player.facing === 'RIGHT') sx += dist;

            swords.push({ x: sx, y: sy, radius: 24, timer: 12 });
        }

        function playerDash() {
            if (player.invuln > 0) return;
            player.invuln = 30;
            if (player.facing === 'UP') player.y -= 90;
            if (player.facing === 'DOWN') player.y += 90;
            if (player.facing === 'LEFT') player.x -= 90;
            if (player.facing === 'RIGHT') player.x += 90;
        }

        function gameLoop() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isPausedForDialogue) {
                updatePlayer();
                updateBoss();
                updateEntities();
            }

            drawZeldaEnvironment();
            drawEntities();

            requestAnimationFrame(gameLoop);
        }

        function updatePlayer() {
            let mx = 0, my = 0;
            if (keys['KeyW'] || keys['ArrowUp']) { my -= 1; player.facing = 'UP'; }
            if (keys['KeyS'] || keys['ArrowDown']) { my += 1; player.facing = 'DOWN'; }
            if (keys['KeyA'] || keys['ArrowLeft']) { mx -= 1; player.facing = 'LEFT'; }
            if (keys['KeyD'] || keys['ArrowRight']) { mx += 1; player.facing = 'RIGHT'; }

            if (mx !== 0 && my !== 0) { mx *= 0.707; my *= 0.707; }

            player.x = Math.max(80, Math.min(canvas.width - 80, player.x + mx * player.speed));
            player.y = Math.max(80, Math.min(canvas.height - 80, player.y + my * player.speed));

            if (player.invuln > 0) player.invuln--;
        }

        function updateBoss() {
            if (!activeBoss) return;
            const b = activeBoss;
            b.timer++;
            b.x += b.vx;
            b.y += b.vy;

            if (b.x < 120 || b.x > canvas.width - 120) b.vx *= -1;
            if (b.y < 100 || b.y > canvas.height * 0.45) b.vy *= -1;

            // Unique Boss Attacks (Zelda style projectiles)
            if (b.timer % 65 === 0) {
                const angle = Math.atan2(player.y - b.y, player.x - b.x);
                bossProjectiles.push({
                    x: b.x, y: b.y,
                    vx: Math.cos(angle) * 5.5,
                    vy: Math.sin(angle) * 5.5,
                    radius: 10, color: b.color
                });
            }
        }

        function updateEntities() {
            // Swords hitting boss
            for (let i = swords.length - 1; i >= 0; i--) {
                const s = swords[i];
                s.timer--;
                if (activeBoss && Math.hypot(s.x - activeBoss.x, s.y - activeBoss.y) < s.radius + activeBoss.radius) {
                    activeBoss.hp -= 35;
                    swords.splice(i, 1);
                    if (activeBoss.hp <= 0) {
                        handleBossVictory();
                        return;
                    }
                }
                if (s.timer <= 0) swords.splice(i, 1);
            }

            // Boss Projectiles hitting player
            for (let i = bossProjectiles.length - 1; i >= 0; i--) {
                const bp = bossProjectiles[i];
                bp.x += bp.vx;
                bp.y += bp.vy;

                if (Math.hypot(bp.x - player.x, bp.y - player.y) < bp.radius + player.radius && player.invuln === 0) {
                    player.hearts--;
                    player.invuln = 45;
                    bossProjectiles.splice(i, 1);
                    if (player.hearts <= 0) endRun(false);
                }
            }
        }

        function handleBossVictory() {
            const reward = (dungeonIndex + 1) * 7500;
            const currentCoins = parseInt(localStorage.getItem('arcade_coins')) || 0;
            localStorage.setItem('arcade_coins', currentCoins + reward);
            sessionCoins += reward;

            dungeonIndex++;
            if (dungeonIndex >= DUNGEONS.length) {
                endRun(true);
            } else {
                loadDungeon(dungeonIndex);
            }
        }

        function endRun(victory) {
            gameActive = false;
            document.getElementById('end-modal').style.display = 'flex';
            document.getElementById('end-title').innerText = victory ? 'VICTORY: CORE SAVED!' : 'GAME OVER';
            document.getElementById('end-desc').innerText = victory ? 'You conquered all 4 Zelda dungeons and defeated M Demon!' : 'You fell in battle, but your rupees remain in your wallet.';
            document.getElementById('end-reward').innerText = `+${sessionCoins.toLocaleString()} COINS EARNED`;
        }

        function drawZeldaEnvironment() {
            // Zelda-style stone dungeon floor
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Stone border walls
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 16;
            ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
        }

        function drawEntities() {
            // Boss
            if (activeBoss) {
                ctx.fillStyle = activeBoss.color;
                ctx.beginPath();
                ctx.arc(activeBoss.x, activeBoss.y, activeBoss.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Update Boss HP bar
                const pct = Math.max(0, (activeBoss.hp / activeBoss.maxHp) * 100);
                document.getElementById('boss-hud-hp').innerText = `BOSS HP: ${Math.round(pct)}%`;
            }

            // Player
            ctx.save();
            if (player.invuln % 4 > 2) ctx.globalAlpha = 0.5;
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // Swords
            swords.forEach(s => {
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Boss Projectiles
            bossProjectiles.forEach(bp => {
                ctx.fillStyle = bp.color;
                ctx.beginPath();
                ctx.arc(bp.x, bp.y, bp.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Hearts UI
            let heartStr = '';
            for (let i = 0; i < player.maxHearts; i++) {
                heartStr += i < player.hearts ? '❤️ ' : '🖤 ';
            }
            document.getElementById('heart-display').innerText = heartStr;
        }

        function triggerSwordSwing() { slashSword(); }
        function triggerDash() { playerDash(); }

        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.getElementById('touch-controls').style.display = 'block';
        }
    </script>
</body>
</html>
