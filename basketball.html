<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Hoops - Basketball Legends</title>
    <script src="arcade.js"></script>
    <style>
        :root {
            --primary: #00f3ff;
            --primary-glow: rgba(0, 243, 255, 0.4);
            --accent: #ff007f;
            --gold: #facc15;
            --emerald: #10b981;
            --danger: #ef4444;
            --bg: #030712;
            --card: #0b1329;
            --panel-bg: rgba(11, 19, 41, 0.94);
        }
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        header {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 6px 20px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            margin-bottom: 4px;
            box-shadow: 0 0 18px var(--primary-glow);
        }
        .stats { font-size: 1.02rem; font-weight: bold; color: var(--gold); }
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; }
        a.nav:hover { text-shadow: 0 0 8px var(--primary); }

        #game-wrapper {
            width: 100%;
            max-width: 1000px;
            height: calc(100vh - 82px);
            max-height: 720px;
            border: 3px solid var(--primary);
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25);
            position: relative;
            overflow: hidden;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-canvas { width: 100% !important; height: 100% !important; display: block; }

        /* Match Scoreboard */
        #scoreboard {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--panel-bg);
            border: 2px solid var(--primary);
            border-radius: 14px;
            padding: 6px 24px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            z-index: 10;
        }
        .team-score { text-align: center; }
        .score-val { font-size: 1.6rem; font-weight: 900; font-family: monospace; }
        .score-lbl { font-size: 0.65rem; color: #94a3b8; font-weight: bold; text-transform: uppercase; }
        .clock-box { text-align: center; padding: 0 10px; }
        .clock-val { font-size: 1.3rem; font-weight: 900; color: var(--gold); font-family: monospace; }

        #shot-feedback {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 243, 255, 0.95);
            color: #000;
            font-weight: 900;
            padding: 6px 22px;
            border-radius: 20px;
            font-size: 1.15rem;
            display: none;
            pointer-events: none;
            box-shadow: 0 0 25px var(--primary);
            z-index: 20;
        }

        /* Touch Controls */
        .touch-zone {
            position: absolute;
            bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
            touch-action: none;
        }
        #touch-left { left: 14px; }
        #touch-right { right: 14px; }

        .ctrl-btn {
            width: 52px;
            height: 52px;
            background: var(--panel-bg);
            border: 1.5px solid #334155;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            cursor: pointer;
            transition: transform 0.08s;
        }
        .ctrl-btn:active { background: var(--primary); color: #000; transform: scale(0.92); }
        .ctrl-btn.shoot { border-color: var(--accent); color: var(--accent); }
        .ctrl-btn.shoot:active { background: var(--accent); color: #fff; }

        .modal {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 18, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
        }
        .modal-card {
            background: var(--card);
            border: 2px solid var(--primary);
            border-radius: 14px;
            padding: 24px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px var(--primary-glow);
        }
        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px 24px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 14px;
        }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--primary); }

        .controls-info { margin-top: 4px; font-size: 0.76rem; color: #94a3b8; max-width: 1000px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div>🏀 <strong>CYBER HOOPS 1V1</strong> | Court Arena</div>
        <div class="stats">🪙 Gold: <span id="coin-count">0</span></div>
    </header>

    <div id="game-wrapper">
        <canvas id="game-canvas" width="1000" height="600"></canvas>

        <div id="scoreboard">
            <div class="team-score">
                <div class="score-val" id="player-score" style="color:var(--primary);">0</div>
                <div class="score-lbl">PLAYER</div>
            </div>
            <div class="clock-box">
                <div class="clock-val" id="clock-display">60</div>
                <div class="score-lbl">TIME</div>
            </div>
            <div class="team-score">
                <div class="score-val" id="ai-score" style="color:var(--accent);">0</div>
                <div class="score-lbl">RIVAL AI</div>
            </div>
        </div>

        <div id="shot-feedback">SWISH! +3</div>

        <div class="touch-zone" id="touch-left">
            <div class="ctrl-btn" id="btn-touch-left">◀</div>
            <div class="ctrl-btn" id="btn-touch-right">▶</div>
        </div>

        <div class="touch-zone" id="touch-right">
            <div class="ctrl-btn" id="btn-touch-jump">▲<br><small>JUMP</small></div>
            <div class="ctrl-btn shoot" id="btn-touch-shoot">🏀<br><small>SHOOT</small></div>
        </div>

        <div id="gameover-modal" class="modal" style="display: none;">
            <div class="modal-card">
                <h2 style="color:var(--gold); margin:0 0 8px 0;" id="match-result-title">MATCH OVER</h2>
                <p style="color:#94a3b8; font-size:1.1rem; margin:6px 0;" id="match-score-summary">0 - 0</p>
                <p style="color:var(--emerald); font-size:0.95rem; font-weight:bold;" id="coin-reward-text">+0 Gold Coins!</p>
                <button class="btn" onclick="startNewMatch()">🔄 Play Next Match</button>
            </div>
        </div>
    </div>

    <div class="controls-info">
        <strong>Move:</strong> [A]/[D] or Left/Right &nbsp;|&nbsp; <strong>Jump / Dunk:</strong> [W] / Up &nbsp;|&nbsp; <strong>Shoot / Steal:</strong> Hold & Release [Space] / [F]
    </div>

    <script>
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        // Realistic Percussive Backboard Contact Thud
        function playBackboardThud() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                // 1. Low frequency resonant body impact
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(160, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(42, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.45, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);

                // 2. High-frequency impulse click on wood/polycarbonate
                const bufferSize = ctx.sampleRate * 0.04;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 520;

                const nGain = ctx.createGain();
                nGain.gain.setValueAtTime(0.25, ctx.currentTime);
                nGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);

                noise.connect(filter);
                filter.connect(nGain);
                nGain.connect(ctx.destination);
                noise.start();
            } catch(e){}
        }

        // Metallic Rim Ping
        function playRimClank() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(780, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch(e){}
        }

        // Clean Net Swish
        function playNetSwish() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const bufferSize = ctx.sampleRate * 0.18;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 2400;
                filter.Q.value = 3;

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.35, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start();
            } catch(e){}
        }

        // Floor Dribble Bounce
        function playFloorBounce() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(120, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e){}
        }

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        const GRAVITY = 1200;
        const COURT_Y = 530;

        // Player & AI Character Objects
        const player = {
            x: 240,
            y: COURT_Y - 70,
            vx: 0,
            vy: 0,
            width: 38,
            height: 70,
            speed: 340,
            jumpForce: 620,
            onGround: true,
            hasBall: true,
            chargeTime: 0,
            isCharging: false,
            color: '#00f3ff'
        };

        const ai = {
            x: 740,
            y: COURT_Y - 70,
            vx: 0,
            vy: 0,
            width: 38,
            height: 70,
            speed: 280,
            jumpForce: 600,
            onGround: true,
            hasBall: false,
            actionTimer: 0,
            color: '#ff007f'
        };

        // Basketball Physics State
        const ball = {
            x: player.x + 20,
            y: player.y + 10,
            vx: 0,
            vy: 0,
            radius: 12,
            inAir: false,
            holder: player,
            lastTouchedBy: 'player'
        };

        // Two Hoops on Court
        const hoops = [
            {
                side: 'left',
                backboardX: 50,
                backboardY: 260,
                backboardH: 90,
                rimX: 58,
                rimY: 320,
                rimWidth: 38
            },
            {
                side: 'right',
                backboardX: 940,
                backboardY: 260,
                backboardH: 90,
                rimX: 904,
                rimY: 320,
                rimWidth: 38
            }
        ];

        let playerScore = 0;
        let aiScore = 0;
        let matchTime = 60;
        let gameOver = false;
        let gold = 0;
        let particles = [];

        const keys = { a: false, d: false, w: false, shoot: false };

        function updateWallet() {
            gold = parseInt(localStorage.getItem('arcade_coins')) || 0;
            document.getElementById('coin-count').innerText = gold.toLocaleString();
        }

        function addCoins(amt) {
            gold += amt;
            localStorage.setItem('arcade_coins', gold);
            updateWallet();
        }

        function showFeedback(txt) {
            const el = document.getElementById('shot-feedback');
            el.innerText = txt;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 1200);
        }

        function setupControls() {
            window.addEventListener('keydown', e => {
                const c = e.code;
                if (['ArrowLeft','ArrowRight','ArrowUp','Space','KeyA','KeyD','KeyW','KeyF'].includes(c)) {
                    e.preventDefault();
                }
                getAudioContext();

                if (c === 'KeyA' || c === 'ArrowLeft') keys.a = true;
                if (c === 'KeyD' || c === 'ArrowRight') keys.d = true;
                if (c === 'KeyW' || c === 'ArrowUp') {
                    if (player.onGround) {
                        player.vy = -player.jumpForce;
                        player.onGround = false;
                    }
                }
                if (c === 'Space' || c === 'KeyF') {
                    if (ball.holder === player && !player.isCharging) {
                        player.isCharging = true;
                        player.chargeTime = 0;
                    }
                }
            });

            window.addEventListener('keyup', e => {
                const c = e.code;
                if (c === 'KeyA' || c === 'ArrowLeft') keys.a = false;
                if (c === 'KeyD' || c === 'ArrowRight') keys.d = false;

                if (c === 'Space' || c === 'KeyF') {
                    if (player.isCharging && ball.holder === player) {
                        shootBall(player, player.chargeTime);
                    }
                    player.isCharging = false;
                    player.chargeTime = 0;
                }
            });

            const bindBtn = (id, onStart, onEnd) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', e => { e.preventDefault(); getAudioContext(); onStart(); }, { passive: false });
                if (onEnd) el.addEventListener('touchend', e => { e.preventDefault(); onEnd(); }, { passive: false });
            };

            bindBtn('btn-touch-left', () => keys.a = true, () => keys.a = false);
            bindBtn('btn-touch-right', () => keys.d = true, () => keys.d = false);
            bindBtn('btn-touch-jump', () => {
                if (player.onGround) { player.vy = -player.jumpForce; player.onGround = false; }
            });
            bindBtn('btn-touch-shoot', () => {
                if (ball.holder === player) { player.isCharging = true; player.chargeTime = 0; }
            }, () => {
                if (player.isCharging && ball.holder === player) { shootBall(player, player.chargeTime); }
                player.isCharging = false;
                player.chargeTime = 0;
            });
        }

        function shootBall(shooter, charge) {
            ball.holder = null;
            ball.inAir = true;
            ball.lastTouchedBy = shooter === player ? 'player' : 'ai';

            const targetHoop = shooter === player ? hoops[1] : hoops[0];
            const dx = (targetHoop.rimX + 19) - shooter.x;
            const dist = Math.abs(dx);

            // Arc physics calculation
            const powerNorm = Math.min(1.0, Math.max(0.2, charge ? charge * 1.8 : 0.65));
            ball.vx = (dx > 0 ? 1 : -1) * (260 + dist * 0.75) * powerNorm;
            ball.vy = -560 - (dist * 0.35);

            playFloorBounce();
        }

        // Match Clock
        setInterval(() => {
            if (!gameOver && matchTime > 0) {
                matchTime--;
                document.getElementById('clock-display').innerText = matchTime;
                if (matchTime <= 0) {
                    endMatch();
                }
            }
        }, 1000);

        function endMatch() {
            gameOver = true;
            const modal = document.getElementById('gameover-modal');
            const title = document.getElementById('match-result-title');
            const summary = document.getElementById('match-score-summary');
            const reward = document.getElementById('coin-reward-text');

            summary.innerText = `Player ${playerScore} - ${aiScore} Rival AI`;

            if (playerScore > aiScore) {
                title.innerText = '🏆 VICTORY!';
                title.style.color = 'var(--emerald)';
                const earn = 80 + (playerScore - aiScore) * 10;
                addCoins(earn);
                reward.innerText = `+${earn} Gold Coins Earned! 🪙`;
            } else if (playerScore < aiScore) {
                title.innerText = '💀 DEFEAT';
                title.style.color = 'var(--danger)';
                addCoins(15);
                reward.innerText = '+15 Consolation Coins';
            } else {
                title.innerText = '🤝 DRAW';
                title.style.color = 'var(--gold)';
                addCoins(30);
                reward.innerText = '+30 Draw Coins';
            }
            modal.style.display = 'flex';
        }

        function startNewMatch() {
            playerScore = 0;
            aiScore = 0;
            matchTime = 60;
            gameOver = false;
            document.getElementById('player-score').innerText = '0';
            document.getElementById('ai-score').innerText = '0';
            document.getElementById('clock-display').innerText = '60';
            document.getElementById('gameover-modal').style.display = 'none';

            player.x = 240; player.y = COURT_Y - player.height;
            ai.x = 740; ai.y = COURT_Y - ai.height;
            ball.holder = player;
            ball.inAir = false;
        }

        function updateAI(dt) {
            if (gameOver) return;

            ai.actionTimer += dt;

            if (ball.holder === ai) {
                // AI Offense: Move toward left hoop and take high-percentage shots
                const hoop = hoops[0];
                const distToRim = ai.x - (hoop.rimX + 19);

                if (distToRim > 280) {
                    ai.vx = -ai.speed;
                } else {
                    ai.vx = 0;
                    if (ai.actionTimer > 0.8 && ai.onGround) {
                        ai.vy = -ai.jumpForce;
                        ai.onGround = false;
                        setTimeout(() => {
                            if (ball.holder === ai) shootBall(ai, 0.65);
                        }, 220);
                        ai.actionTimer = 0;
                    }
                }
            } else if (ball.holder === player) {
                // AI Defense: Contest player jumper and block
                const distToPlayer = ai.x - player.x;
                if (distToPlayer > 80) {
                    ai.vx = -ai.speed;
                } else if (distToPlayer < -40) {
                    ai.vx = ai.speed;
                } else {
                    ai.vx = 0;
                    // Jump block if player jumps
                    if (!player.onGround && ai.onGround && Math.random() < 0.7) {
                        ai.vy = -ai.jumpForce;
                        ai.onGround = false;
                    }
                }
            } else {
                // Loose ball chase
                if (ball.x < ai.x - 10) ai.vx = -ai.speed;
                else if (ball.x > ai.x + 10) ai.vx = ai.speed;
                else ai.vx = 0;
            }
        }

        function updatePhysics(dt) {
            // Player Movement
            if (keys.a) player.vx = -player.speed;
            else if (keys.d) player.vx = player.speed;
            else player.vx = 0;

            if (player.isCharging) {
                player.chargeTime += dt;
            }

            // Gravity on Characters
            [player, ai].forEach(p => {
                p.vy += GRAVITY * dt;
                p.x += p.vx * dt;
                p.y += p.vy * dt;

                if (p.y >= COURT_Y - p.height) {
                    p.y = COURT_Y - p.height;
                    p.vy = 0;
                    p.onGround = true;
                }
                // Court walls
                p.x = Math.max(70, Math.min(930 - p.width, p.x));
            });

            // Ball Dynamics
            if (ball.holder) {
                ball.x = ball.holder.x + (ball.holder === player ? 28 : -8);
                ball.y = ball.holder.y + 26;
                ball.vx = 0;
                ball.vy = 0;
                ball.inAir = false;
            } else if (ball.inAir) {
                ball.vy += GRAVITY * dt;
                ball.x += ball.vx * dt;
                ball.y += ball.vy * dt;

                // Floor bounce
                if (ball.y >= COURT_Y - ball.radius) {
                    ball.y = COURT_Y - ball.radius;
                    ball.vy = -ball.vy * 0.65;
                    ball.vx *= 0.85;
                    if (Math.abs(ball.vy) > 60) playFloorBounce();
                }

                // -------------------------------------------------------------
                // Backboard Collision & Percussive Contact Sound
                // -------------------------------------------------------------
                hoops.forEach(h => {
                    const bbX = h.backboardX;
                    const bbY = h.backboardY;
                    const bbH = h.backboardH;

                    // AABB Check against 10px thick vertical backboard
                    if (ball.x + ball.radius >= bbX - 4 && ball.x - ball.radius <= bbX + 12 &&
                        ball.y >= bbY && ball.y <= bbY + bbH) {
                        
                        // Deflect ball horizontally with energy restitution
                        ball.vx = -ball.vx * 0.72;
                        ball.x = (ball.vx > 0) ? bbX + 14 : bbX - 6;

                        // Trigger percussive backboard thud!
                        playBackboardThud();

                        // Sparks/Dust Particles
                        for (let i = 0; i < 4; i++) {
                            particles.push({
                                x: ball.x, y: ball.y,
                                vx: (Math.random() - 0.5) * 120,
                                vy: (Math.random() - 0.5) * 120,
                                life: 0.35, color: '#facc15'
                            });
                        }
                    }

                    // Rim Collision & Score Checks
                    const rimLeft = h.rimX;
                    const rimRight = h.rimX + h.rimWidth;
                    const rimY = h.rimY;

                    // Check rim front & back iron cylinders
                    [rimLeft, rimRight].forEach(rx => {
                        const d = Math.hypot(ball.x - rx, ball.y - rimY);
                        if (d < ball.radius + 4) {
                            ball.vy = -ball.vy * 0.6;
                            ball.vx = (ball.x < rx ? -1 : 1) * 140;
                            playRimClank();
                        }
                    });

                    // Through-the-hoop Scoring Condition
                    if (ball.vy > 0 && ball.y >= rimY - 4 && ball.y <= rimY + 12 &&
                        ball.x > rimLeft + 6 && ball.x < rimRight - 6) {

                        playNetSwish();

                        if (h.side === 'right' && ball.lastTouchedBy === 'player') {
                            playerScore += 2;
                            document.getElementById('player-score').innerText = playerScore;
                            showFeedback('BASKET! +2');
                            ball.holder = ai; // AI takes inbound
                        } else if (h.side === 'left' && ball.lastTouchedBy === 'ai') {
                            aiScore += 2;
                            document.getElementById('ai-score').innerText = aiScore;
                            showFeedback('RIVAL SCORED! +2');
                            ball.holder = player; // Player inbounds
                        }
                    }
                });

                // Rebound & Steal Interceptions
                [player, ai].forEach(char => {
                    const d = Math.hypot((char.x + char.width / 2) - ball.x, (char.y + char.height / 2) - ball.y);
                    if (d < 36 && ball.vy > -100) {
                        ball.holder = char;
                    }
                });
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawCourt() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Cyber Court Floor
            const grad = ctx.createLinearGradient(0, COURT_Y, 0, canvas.height);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, COURT_Y, canvas.width, canvas.height - COURT_Y);

            // Glowing Court Lines
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.45)';
            ctx.lineWidth = 3;
            ctx.strokeRect(40, COURT_Y, canvas.width - 80, 2);

            // Center Court Key Circle
            ctx.beginPath();
            ctx.arc(canvas.width / 2, COURT_Y, 70, Math.PI, 0);
            ctx.stroke();

            // Draw Hoops & Glowing Backboards
            hoops.forEach(h => {
                // Support Pole
                ctx.fillStyle = '#334155';
                const poleX = h.side === 'left' ? h.backboardX - 10 : h.backboardX + 10;
                ctx.fillRect(poleX, h.backboardY, 10, COURT_Y - h.backboardY);

                // Backboard
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.strokeStyle = '#00f3ff';
                ctx.lineWidth = 4;
                ctx.fillRect(h.backboardX, h.backboardY, 8, h.backboardH);
                ctx.strokeRect(h.backboardX, h.backboardY, 8, h.backboardH);

                // Rim
                ctx.strokeStyle = '#f97316';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(h.rimX, h.rimY);
                ctx.lineTo(h.rimX + h.rimWidth, h.rimY);
                ctx.stroke();

                // Net lines
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(h.rimX + 4, h.rimY);
                ctx.lineTo(h.rimX + 10, h.rimY + 28);
                ctx.lineTo(h.rimX + 28, h.rimY + 28);
                ctx.lineTo(h.rimX + h.rimWidth - 4, h.rimY);
                ctx.stroke();
            });

            // Draw Player & Rival AI
            [player, ai].forEach((p, idx) => {
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 14;

                // Body & Jersey
                ctx.fillRect(p.x, p.y + 18, p.width, p.height - 18);

                // Head
                ctx.beginPath();
                ctx.arc(p.x + p.width / 2, p.y + 10, 12, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
            });

            // Charge Shot Arc Meter (Player)
            if (player.isCharging && ball.holder === player) {
                const ratio = Math.min(1.0, player.chargeTime / 0.8);
                ctx.fillStyle = '#facc15';
                ctx.fillRect(player.x - 4, player.y - 14, 46 * ratio, 6);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.strokeRect(player.x - 4, player.y - 14, 46, 6);
            }

            // Draw Basketball
            ctx.fillStyle = '#ea580c';
            ctx.shadowColor = '#ea580c';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Ball Seams
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, -0.4, 0.4);
            ctx.stroke();

            // Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
            });
        }

        let lastTime = performance.now();
        function loop(now) {
            requestAnimationFrame(loop);
            const dt = Math.min((now - lastTime) / 1000, 0.02);
            lastTime = now;

            updateAI(dt);
            updatePhysics(dt);
            drawCourt();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateWallet();
            setupControls();
            requestAnimationFrame(loop);
        });
    </script>
</body>
</html>
