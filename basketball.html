<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hoops Legends: Classroom & All-Stars</title>
    <style>
        :root {
            --gold: #facc15;
            --purple-card: #1e1138;
            --p1-cyan: #00f3ff;
            --p2-pink: #f43f5e;
            --green: #22c55e;
            --red: #ef4444;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            background: #090414;
            color: #fff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        #game-wrapper {
            position: relative;
            width: 1000px;
            height: 600px;
            max-width: 100vw;
            max-height: 86vh;
            border: 3px solid #9333ea;
            border-radius: 14px;
            box-shadow: 0 8px 40px rgba(147, 51, 234, 0.45);
            overflow: hidden;
            background: #110726;
        }
        #game-canvas { width: 100%; height: 100%; display: block; }

        /* Scoreboard */
        #scoreboard {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: linear-gradient(180deg, #4c1d95, #1e0b36);
            border: 2px solid #a855f7;
            border-radius: 12px;
            padding: 4px 18px;
            gap: 16px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }
        .team-box { display: flex; flex-direction: column; align-items: center; min-width: 105px; }
        .team-title { font-size: 0.75rem; letter-spacing: 1px; font-weight: bold; }
        .score-num { font-size: 2.1rem; line-height: 1; font-weight: 900; color: #fff; }
        .timer-box {
            background: #020617;
            border: 2px solid var(--gold);
            border-radius: 8px;
            padding: 3px 12px;
            font-size: 1.6rem;
            color: var(--gold);
            font-family: monospace;
            font-weight: 900;
        }

        #banner-popup {
            position: absolute;
            top: 78px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: #f59e0b;
            color: #000;
            padding: 6px 24px;
            font-size: 1.8rem;
            font-weight: 900;
            border: 3px solid #fff;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 30;
            transition: transform 0.16s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Touch Controls for iPad/Mobile */
        .touch-zone {
            position: absolute;
            bottom: 10px;
            display: flex;
            gap: 8px;
            z-index: 25;
            touch-action: none;
        }
        #touch-left { left: 10px; }
        #touch-right { right: 10px; }

        .ctrl-btn {
            width: 52px;
            height: 52px;
            background: rgba(30, 17, 56, 0.85);
            border: 2px solid #a855f7;
            border-radius: 12px;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn:active { background: var(--p1-cyan); color: #000; transform: scale(0.92); }
        .ctrl-btn.act { border-color: var(--gold); color: var(--gold); }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(9, 4, 20, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding: 10px;
        }
        .title {
            font-size: 2.1rem;
            color: var(--gold);
            text-shadow: 3px 3px 0 #ea580c, 5px 5px 0 #000;
            margin: 0 0 6px 0;
        }

        .select-header-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 8px;
        }
        .tab-indicator {
            padding: 5px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: sans-serif;
            font-weight: 900;
            letter-spacing: 0.5px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab-p1 { background: rgba(0, 243, 255, 0.18); color: var(--p1-cyan); border-color: var(--p1-cyan); }
        .tab-p1.selected { background: var(--p1-cyan); color: #000; box-shadow: 0 0 14px var(--p1-cyan); }
        .tab-p2 { background: rgba(244, 63, 94, 0.18); color: var(--p2-pink); border-color: var(--p2-pink); }
        .tab-p2.selected { background: var(--p2-pink); color: #fff; box-shadow: 0 0 14px var(--p2-pink); }

        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(115px, 1fr));
            gap: 8px;
            max-width: 940px;
            max-height: 320px;
            overflow-y: auto;
            width: 100%;
            padding: 6px;
            margin-bottom: 10px;
        }
        .roster-card {
            position: relative;
            background: var(--purple-card);
            border: 2px solid #6b21a8;
            border-radius: 10px;
            padding: 8px 6px;
            cursor: pointer;
            transition: all 0.12s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .roster-card:hover { transform: translateY(-2px); }
        .roster-card.p1-pick {
            border-color: var(--p1-cyan) !important;
            box-shadow: 0 0 14px var(--p1-cyan);
            background: #162a4d;
        }
        .roster-card.p2-pick {
            border-color: var(--p2-pink) !important;
            box-shadow: 0 0 14px var(--p2-pink);
            background: #3e1227;
        }
        .roster-card.both-pick {
            border-color: var(--gold) !important;
            box-shadow: 0 0 16px var(--gold);
            background: #3c2415;
        }

        .badge-container {
            position: absolute;
            top: 4px;
            right: 4px;
            display: flex;
            gap: 3px;
        }
        .pick-badge {
            font-size: 0.58rem;
            font-family: sans-serif;
            font-weight: 900;
            padding: 1px 4px;
            border-radius: 4px;
        }
        .badge-p1 { background: var(--p1-cyan); color: #000; }
        .badge-p2 { background: var(--p2-pink); color: #fff; }

        .card-name { font-size: 0.95rem; color: #fff; margin-bottom: 2px; }
        .card-type { font-size: 0.6rem; color: #38bdf8; font-family: sans-serif; text-transform: uppercase; margin-bottom: 4px; }
        .card-stat { font-size: 0.68rem; color: #cbd5e1; font-family: sans-serif; text-align: left; width: 95%; line-height: 1.3; }
        .card-stat strong { color: var(--gold); }

        .btn-row { display: flex; gap: 14px; margin-top: 4px; }
        .btn {
            background: linear-gradient(180deg, #facc15, #eab308);
            color: #000;
            border: 2px solid #fff;
            padding: 8px 22px;
            font-size: 1.15rem;
            font-family: inherit;
            font-weight: 900;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #a16207;
        }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a16207; }

        .controls-bar {
            width: 1000px;
            max-width: 100vw;
            background: #150a2a;
            border: 1.5px solid #4c1d95;
            border-radius: 8px;
            margin-top: 4px;
            padding: 4px 12px;
            display: flex;
            justify-content: space-around;
            font-size: 0.72rem;
            font-family: sans-serif;
            color: #cbd5e1;
        }
        .controls-bar strong { color: var(--gold); }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="game-canvas" width="1000" height="600"></canvas>

        <div id="scoreboard">
            <div class="team-box">
                <span class="team-title" id="p1-name-hud" style="color:var(--p1-cyan);">PLAYER 1</span>

    <div class="controls-bar">
        <div><strong>P1:</strong> [A]/[D] Move | [W] Jump | [SPACE/F] Shoot / Tap near rival to <strong>STEAL & CLAMP</strong></div>

    <script>
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const t = ctx.currentTime;
                if (type === 'bounce') {
                    const o = ctx.createOscillator(); const g = ctx.createGain();
                    o.frequency.setValueAtTime(140, t);
                    o.frequency.exponentialRampToValueAtTime(45, t + 0.08);
                    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(); o.stop(t + 0.08);
                } else if (type === 'swipe') {
                    const b = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
                    const d = b.getChannelData(0);
                    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                    const src = ctx.createBufferSource(); src.buffer = b;
                    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1800;
                    const g = ctx.createGain(); g.gain.setValueAtTime(0.2, t);
                    g.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
                    src.connect(f); f.connect(g); g.connect(ctx.destination);
                    src.start();
                } else if (type === 'steal') {
                    const o = ctx.createOscillator(); const g = ctx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(520, t);
                    o.frequency.exponentialRampToValueAtTime(980, t + 0.12);
                    g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(); o.stop(t + 0.12);
                } else if (type === 'swish') {
                    const b = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                    const d = b.getChannelData(0);
                    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
                    const src = ctx.createBufferSource(); src.buffer = b;
                    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2600;
                    const g = ctx.createGain(); g.gain.setValueAtTime(0.45, t);
                    g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                    src.connect(f); f.connect(g); g.connect(ctx.destination);
                    src.start();
                } else if (type === 'dunk') {
                    const o = ctx.createOscillator(); const g = ctx.createGain();
                    o.type = 'sawtooth';
                    o.frequency.setValueAtTime(220, t);
                    o.frequency.exponentialRampToValueAtTime(30, t + 0.25);
                    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.25);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(); o.stop(t + 0.25);
                }
            } catch(e){}
        }

        const ROSTER = [
            {
                id: 'kaijie',
                name: 'KAI JIE',

                speed: 220,
                jumpForce: 605,      // Buffed to 70-rated jump

            },
            {

                shotAccuracy: 0.42,

                stealStat: 0.68,
                defenseRating: 70,
                skin: '#fdba74',
                hair: 'wavy',

            },
            {
                id: 'shivnand',
                name: 'SHIVNAND',
                role: 'Lockdown Clamp God',
                speed: 410,          // Highest motor
                jumpForce: 740,      // Best jumping in the game
                shotAccuracy: 0.45,  // Shooting is not the best
                dunkReach: 195,      // Big athletic dunks
                stealStat: 0.98,     // Best steal in the game
                defenseRating: 99,   // Best defense in the game
                skin: '#c2410c',     // Authentic tone
                hair: 'athletic',
                glasses: false,
                beard: false,
                earpiece: false,
                tongueOut: false,
                shirtColor: '#10b981' // Lockdown emerald green
            },
            {
                id: 'lebron',
                name: 'LEBRON JAMES',
                role: 'Freight Train',
                speed: 350,
                jumpForce: 640,
                shotAccuracy: 0.84,
                dunkReach: 180,
                stealStat: 0.70,
                defenseRating: 88,
                skin: '#854d0e',
                hair: 'crop',
                glasses: false,
                beard: true,
                earpiece: false,
                tongueOut: false,

            },
            {
                id: 'curry',
                name: 'CHEF CURRY',
                role: 'Deep Assassin',
                speed: 360,
                jumpForce: 590,
                shotAccuracy: 0.98,
                dunkReach: 90,
                stealStat: 0.75,

                skin: '#ca8a04',

            },
            {

                speed: 345,
                jumpForce: 630,

                dunkReach: 160,
                stealStat: 0.65,
                defenseRating: 80,

            {

                hair: 'crop',

            }
        ];

        let selectedP1Idx = 0; // Kai Jie
        let selectedP2Idx = 1; // John
        let currentActivePicker = 1;

        function setActivePicker(playerNum) {
            currentActivePicker = playerNum;
            document.getElementById('tab-btn-p1').classList.toggle('selected', playerNum === 1);
            document.getElementById('tab-btn-p2').classList.toggle('selected', playerNum === 2);
        }

        function refreshRosterCardsUI() {
            ROSTER.forEach((p, idx) => {
                const card = document.getElementById(`card-${idx}`);
                if (!card) return;
                card.className = 'roster-card';
                const isP1 = (idx === selectedP1Idx);
                const isP2 = (idx === selectedP2Idx);

                if (isP1 && isP2) card.classList.add('both-pick');
                else if (isP1) card.classList.add('p1-pick');
                else if (isP2) card.classList.add('p2-pick');

                const badgeContainer = card.querySelector('.badge-container');
                badgeContainer.innerHTML = '';
                if (isP1) badgeContainer.innerHTML += `<span class="pick-badge badge-p1">P1</span>`;
                if (isP2) badgeContainer.innerHTML += `<span class="pick-badge badge-p2">P2</span>`;
            });
            document.getElementById('p1-pick-name').innerText = ROSTER[selectedP1Idx].name;
            document.getElementById('p2-pick-name').innerText = ROSTER[selectedP2Idx].name;
        }

        const rosterContainer = document.getElementById('roster-container');
        ROSTER.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'roster-card';
            card.id = `card-${idx}`;
            const jumpLabel = (p.id === 'kaijie') ? '70' : (p.jumpForce > 650 ? '85+' : (p.jumpForce > 600 ? '75' : '60'));
            card.innerHTML = `
                <div class="badge-container"></div>
                <div class="card-name">${p.name}</div>
                <div class="card-type">${p.role}</div>
                <div class="card-stat">⚡ Spd: <strong>${Math.round(p.speed / 4)}</strong></div>
                <div class="card-stat">🚀 Jump: <strong>${jumpLabel}</strong></div>
                <div class="card-stat">🎯 3PT: <strong>${Math.round(p.shotAccuracy * 100)}%</strong></div>
                <div class="card-stat">💥 Dunk: <strong>${p.dunkReach > 0 ? 'YES' : 'NO'}</strong></div>
                <div class="card-stat">🛡️ Stl: <strong>${Math.round(p.stealStat * 100)}%</strong></div>
            `;
            card.onclick = () => {
                if (currentActivePicker === 1) {
                    selectedP1Idx = idx;
                    setActivePicker(2);
                } else {
                    selectedP2Idx = idx;
                    setActivePicker(1);
                }
                refreshRosterCardsUI();
            };
            rosterContainer.appendChild(card);
        });

        refreshRosterCardsUI();

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const GRAVITY = 1180;
        const COURT_Y = 515;

        let gameMode = '1P';
        let matchActive = false;
        let p1Score = 0, p2Score = 0;
        let timeLeft = 60;
        let timerInterval = null;
        let screenShake = 0;

        function createEntity(data, startX, facing) {
            return {
                ...data,
                x: startX,
                y: COURT_Y - 95,
                vx: 0,
                vy: 0,
                width: 44,
                height: 95,
                facing: facing,
                onGround: true,
                isCharging: false,
                chargeTimer: 0,
                isDunking: false,
                stealCooldown: 0,
                swipeVisualTimer: 0, // Visual swipe animation
                isClamping: false,    // Active contest aura
                aiDecisionTimer: 0
            };
        }

        let p1 = createEntity(ROSTER[selectedP1Idx], 220, 1);
        let p2 = createEntity(ROSTER[selectedP2Idx], 740, -1);

        const ball = {
            x: 250,
            y: COURT_Y - 70,
            vx: 0,
            vy: 0,
            radius: 13,
            holder: null,
            lastTouchedBy: null,
            rotation: 0,
            isFireball: false
        };

        const hoops = [
            { side: 'left', bbX: 52, bbY: 210, bbH: 110, rimX: 62, rimY: 288, rimW: 46, netWiggle: 0 },
            { side: 'right', bbX: 940, bbY: 210, bbH: 110, rimX: 892, rimY: 288, rimW: 46, netWiggle: 0 }
        ];

        // Improved Active Steal Function
        function attemptSteal(stealer, target) {
            if (stealer.stealCooldown > 0) return;
            stealer.stealCooldown = 0.38; // Snappier cooldown
            stealer.swipeVisualTimer = 0.18; // Trigger hand swipe graphic
            playSound('swipe');

            // Lunge forward into the ball handler
            const dir = (target.x > stealer.x) ? 1 : -1;
            stealer.vx = dir * 190;

            if (ball.holder !== target) return;

            const dist = Math.hypot((stealer.x + stealer.width/2) - (target.x + target.width/2), stealer.y - target.y);
            if (dist < 88) { // Expanded reach
                const successProb = stealer.stealStat * (stealer.id === 'shivnand' && target.id === 'kaijie' ? 0.98 : 0.72);
                if (Math.random() < successProb) {
                    ball.holder = null;
                    ball.lastTouchedBy = stealer;
                    ball.vx = dir * 210;
                    ball.vy = -300;
                    screenShake = 7;
                    playSound('steal');
                    triggerBanner(`${stealer.name} POCKET PICK! ⚡`);
                }
            }
        }

        function getArcTrajectory(startX, startY, targetX, targetY, gravity) {
            const dx = targetX - startX;
            const dy = targetY - startY;
            const dist = Math.abs(dx);
            const flightTime = Math.min(1.15, Math.max(0.72, 0.70 + dist * 0.00065));
            return {
                vx: dx / flightTime,
                vy: (dy - 0.5 * gravity * flightTime * flightTime) / flightTime
            };
        }

        function isShotContested(shooter, defender) {
            const dist = Math.abs((shooter.x + shooter.width/2) - (defender.x + defender.width/2));
            const activeGuard = dist < 82 && (!defender.onGround || defender.defenseRating > 65);
            defender.isClamping = activeGuard;
            return activeGuard;
        }

        function releaseJumpShot(shooter, targetHoop, defender) {
            ball.holder = null;
            ball.lastTouchedBy = shooter;

            const sweetSpot = 0.45;
            const diff = Math.abs(shooter.chargeTimer - sweetSpot);
            const contested = isShotContested(shooter, defender);
            const maxAllowedDiff = contested ? (defender.id === 'shivnand' ? 0.03 : 0.065) : 0.12;
            const isGreen = diff <= maxAllowedDiff;

            const targetX = targetHoop.rimX + targetHoop.rimW / 2;
            const targetY = targetHoop.rimY;
            const perfectArc = getArcTrajectory(ball.x, ball.y, targetX, targetY, GRAVITY);

            if (isGreen) {
                ball.isFireball = true;
                ball.vx = perfectArc.vx;
                ball.vy = perfectArc.vy;
                triggerBanner('🔥 PERFECT GREEN!');
            } else if (shooter.chargeTimer > 0.78) {
                ball.isFireball = false;
                const dir = Math.sign(targetX - ball.x);
                ball.vx = dir * 180;
                ball.vy = -680;
                triggerBanner('BRICK!');
            } else {
                ball.isFireball = false;
                let penalty = (1 - shooter.shotAccuracy);
                if (contested) penalty += (defender.defenseRating / 100) * 0.65;

                const spread = (diff * 220 + penalty * 135);
                ball.vx = perfectArc.vx + (Math.random() - 0.5) * spread;
                ball.vy = perfectArc.vy + (Math.random() - 0.5) * (spread * 0.6);
                if (contested) triggerBanner('CONTESTED!');
            }
            playSound('bounce');
        }

        function executeDunk(player, targetHoop) {
            if (player.dunkReach <= 0) return;

            player.isDunking = true;
            player.vx = 0; player.vy = -160;
            player.x = (targetHoop.side === 'right') ? targetHoop.rimX - 10 : targetHoop.rimX + 30;

            setTimeout(() => {
                if (!player.isDunking) return;
                player.isDunking = false;
                ball.holder = null;
                ball.x = targetHoop.rimX + 23;
                ball.y = targetHoop.rimY + 5;
                ball.vx = 0; ball.vy = 420;
                targetHoop.netWiggle = 1.0;
                screenShake = 16;
                playSound('dunk');
                triggerBanner('💥 MONSTER SLAM!');

                if (targetHoop.side === 'right') {
                    p1Score += 2;
                    document.getElementById('p1-score').innerText = p1Score;
                    setTimeout(() => resetRound(p2), 600);
                } else {
                    p2Score += 2;
                    document.getElementById('p2-score').innerText = p2Score;
                    setTimeout(() => resetRound(p1), 600);
                }
            }, 300);
        }

        function triggerBanner(text) {
            const b = document.getElementById('banner-popup');
            b.innerText = text;
            b.style.transform = 'translateX(-50%) scale(1.15)';
            setTimeout(() => { b.style.transform = 'translateX(-50%) scale(0)'; }, 900);
        }

        function startMatch(mode) {
            gameMode = mode;
            p1Score = 0; p2Score = 0; timeLeft = 60;
            matchActive = true;

            p1 = createEntity(ROSTER[selectedP1Idx], 220, 1);
            p2 = createEntity(ROSTER[selectedP2Idx], 740, -1);

            document.getElementById('p1-name-hud').innerText = p1.name;
            document.getElementById('p2-name-hud').innerText = (gameMode === '1P') ? `${p2.name} (AI)` : p2.name;
            document.getElementById('p1-score').innerText = '0';
            document.getElementById('p2-score').innerText = '0';
            document.getElementById('match-timer').innerText = '60';

            document.getElementById('select-modal').style.display = 'none';
            document.getElementById('end-modal').style.display = 'none';

            resetRound(p1);

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (matchActive && timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('match-timer').innerText = timeLeft;
                    if (timeLeft <= 0) finishMatch();
                }
            }, 1000);
        }

        function resetRound(inboundPlayer) {
            p1.x = 220; p1.y = COURT_Y - p1.height; p1.vx = 0; p1.vy = 0; p1.isDunking = false;
            p2.x = 740; p2.y = COURT_Y - p2.height; p2.vx = 0; p2.vy = 0; p2.isDunking = false;
            ball.holder = inboundPlayer;
            ball.vx = 0; ball.vy = 0;
            ball.isFireball = false;
        }

        function finishMatch() {
            matchActive = false;
            clearInterval(timerInterval);
            document.getElementById('end-modal').style.display = 'flex';
            const winner = p1Score > p2Score ? `${p1.name} WINS!` : (p2Score > p1Score ? `${p2.name} WINS!` : "DRAW MATCH!");
            document.getElementById('end-title').innerText = winner;
            document.getElementById('final-score-text').innerText = `${p1Score} - ${p2Score}`;
        }

        function openMenu() {
            document.getElementById('end-modal').style.display = 'none';
            document.getElementById('select-modal').style.display = 'flex';
            refreshRosterCardsUI();
        }

        function updateAI(dt) {
            if (gameMode !== '1P' || !matchActive || p2.isDunking) return;

            p2.aiDecisionTimer += dt;
            const targetHoop = hoops[0];
            const distToRim = (p2.x + p2.width / 2) - (targetHoop.rimX + 23);
            const distToPlayer = Math.abs(p2.x - p1.x);

            if (ball.holder === p2) {
                if (p2.id === 'john') {
                    p2.vx = -p2.speed;
                    p2.facing = -1;
                    if (distToRim < p2.dunkReach && p2.onGround) {
                        p2.vy = -p2.jumpForce;
                        p2.onGround = false;
                        setTimeout(() => executeDunk(p2, targetHoop), 110);
                    }
                } else if (p2.id === 'kaijie') {
                    if (distToRim > 320) {
                        p2.vx = -p2.speed;
                        p2.facing = -1;
                    } else if (distToPlayer < 70) {
                        p2.vx = p2.speed * 0.9;
                        p2.facing = -1;
                    } else {
                        p2.vx = 0;
                        if (p2.onGround && p2.aiDecisionTimer > 0.55) {
                            p2.aiDecisionTimer = 0;
                            p2.chargeTimer = 0.45;
                            releaseJumpShot(p2, targetHoop, p1);
                        }
                    }
                } else if (p2.id === 'shivnand') {
                    if (distToRim > 200) {
                        p2.vx = -p2.speed;
                        p2.facing = -1;
                    } else {
                        if (distToRim < p2.dunkReach && p2.onGround) {
                            p2.vy = -p2.jumpForce;
                            p2.onGround = false;
                            setTimeout(() => executeDunk(p2, targetHoop), 110);
                        } else if (p2.onGround && p2.aiDecisionTimer > 0.6) {
                            p2.chargeTimer = 0.45;
                            releaseJumpShot(p2, targetHoop, p1);
                            p2.aiDecisionTimer = 0;
                        }
                    }
                } else {
                    if (distToRim > 240) p2.vx = -p2.speed;
                    else {
                        p2.vx = 0;
                        if (p2.onGround && p2.aiDecisionTimer > 0.6) {
                            p2.chargeTimer = 0.45;
                            releaseJumpShot(p2, targetHoop, p1);
                            p2.aiDecisionTimer = 0;
                        }
                    }
                }
            } else if (ball.holder === p1) {
                const guardDist = p2.x - p1.x;
                if (guardDist > 65) { p2.vx = -p2.speed; p2.facing = -1; }
                else if (guardDist < -45) { p2.vx = p2.speed; p2.facing = 1; }
                else {
                    p2.vx = 0;
                    if (p2.stealCooldown <= 0 && Math.random() < 0.48) {
                        attemptSteal(p2, p1);
                    }
                    if ((!p1.onGround || p1.isCharging) && p2.onGround && Math.random() < 0.88) {
                        p2.vy = -p2.jumpForce;
                        p2.onGround = false;
                    }
                }
            } else {
                if (ball.x < p2.x - 16) { p2.vx = -p2.speed; p2.facing = -1; }
                else if (ball.x > p2.x + 16) { p2.vx = p2.speed; p2.facing = 1; }
                else p2.vx = 0;

                if (ball.y < p2.y && p2.onGround && Math.abs(ball.x - p2.x) < 55) {
                    p2.vy = -p2.jumpForce * 0.85;
                    p2.onGround = false;
                }
            }
        }

        const keys = {};
        window.addEventListener('keydown', e => {
            getAudioContext();
            keys[e.code] = true;

            if (e.code === 'KeyW' && p1.onGround && !p1.isDunking) {
                p1.vy = -p1.jumpForce;
                p1.onGround = false;
            }

            if (e.code === 'Space' || e.code === 'KeyF') {
                if (ball.holder === p1 && !p1.isCharging) {
                    const distToRim = Math.abs((hoops[1].rimX + 23) - (p1.x + p1.width/2));
                    if (distToRim < p1.dunkReach && p1.y < COURT_Y - 40) {
                        executeDunk(p1, hoops[1]);
                    } else {
                        p1.isCharging = true;
                        p1.chargeTimer = 0;
                    }
                } else {
                    attemptSteal(p1, p2);
                }
            }

            if (gameMode === '2P') {
                if (e.code === 'ArrowUp' && p2.onGround && !p2.isDunking) {
                    p2.vy = -p2.jumpForce;
                    p2.onGround = false;
                }
                if (e.code === 'KeyL' || e.code === 'Enter') {
                    if (ball.holder === p2 && !p2.isCharging) {
                        const distToRim = Math.abs((hoops[0].rimX + 23) - (p2.x + p2.width/2));
                        if (distToRim < p2.dunkReach && p2.y < COURT_Y - 40) {
                            executeDunk(p2, hoops[0]);
                        } else {
                            p2.isCharging = true;
                            p2.chargeTimer = 0;
                        }
                    } else {
                        attemptSteal(p2, p1);
                    }
                }
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
            if ((e.code === 'Space' || e.code === 'KeyF') && p1.isCharging) {
                if (ball.holder === p1) releaseJumpShot(p1, hoops[1], p2);
                p1.isCharging = false;
            }
            if (gameMode === '2P' && (e.code === 'KeyL' || e.code === 'Enter') && p2.isCharging) {
                if (ball.holder === p2) releaseJumpShot(p2, hoops[0], p1);
                p2.isCharging = false;
            }
        });

        const bindTouch = (id, start, end) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', e => { e.preventDefault(); getAudioContext(); start(); }, { passive: false });
            if (end) el.addEventListener('touchend', e => { e.preventDefault(); end(); }, { passive: false });
        };

        bindTouch('t-left', () => keys['KeyA'] = true, () => keys['KeyA'] = false);
        bindTouch('t-right', () => keys['KeyD'] = true, () => keys['KeyD'] = false);
        bindTouch('t-jump', () => {
            if (p1.onGround && !p1.isDunking) { p1.vy = -p1.jumpForce; p1.onGround = false; }
        });
        bindTouch('t-action', () => {
            if (ball.holder === p1) {
                const distToRim = Math.abs((hoops[1].rimX + 23) - (p1.x + p1.width/2));
                if (distToRim < p1.dunkReach && p1.y < COURT_Y - 40) executeDunk(p1, hoops[1]);
                else { p1.isCharging = true; p1.chargeTimer = 0; }
            } else {
                attemptSteal(p1, p2);
            }
        }, () => {
            if (p1.isCharging && ball.holder === p1) { releaseJumpShot(p1, hoops[1], p2); }
            p1.isCharging = false;
        });

        function updatePhysics(dt) {
            if (!matchActive) return;

            if (screenShake > 0.5) screenShake *= 0.88;
            if (p1.stealCooldown > 0) p1.stealCooldown -= dt;
            if (p2.stealCooldown > 0) p2.stealCooldown -= dt;
            if (p1.swipeVisualTimer > 0) p1.swipeVisualTimer -= dt;
            if (p2.swipeVisualTimer > 0) p2.swipeVisualTimer -= dt;

            // Check active clamp defense
            isShotContested(p1, p2);
            isShotContested(p2, p1);

            if (!p1.isDunking) {
                if (keys['KeyA']) { p1.vx = -p1.speed; p1.facing = -1; }
                else if (keys['KeyD']) { p1.vx = p1.speed; p1.facing = 1; }
                else p1.vx *= 0.82;

                if (p1.isCharging) p1.chargeTimer += dt;
            }

            if (gameMode === '2P' && !p2.isDunking) {
                if (keys['ArrowLeft']) { p2.vx = -p2.speed; p2.facing = -1; }
                else if (keys['ArrowRight']) { p2.vx = p2.speed; p2.facing = 1; }
                else p2.vx *= 0.82;

                if (p2.isCharging) p2.chargeTimer += dt;
            }

            [p1, p2].forEach(p => {
                if (!p.isDunking) {
                    p.vy += GRAVITY * dt;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;

                    if (p.y >= COURT_Y - p.height) {
                        p.y = COURT_Y - p.height;
                        p.vy = 0;
                        p.onGround = true;
                    }
                    p.x = Math.max(45, Math.min(955 - p.width, p.x));
                }
            });

            if (ball.holder) {
                const h = ball.holder;
                ball.x = h.x + (h.facing === 1 ? 36 : 8);
                ball.y = h.isDunking ? h.y - 12 : h.y + 40;
                ball.vx = 0; ball.vy = 0;
            } else {
                ball.vy += GRAVITY * dt;
                ball.x += ball.vx * dt;
                ball.y += ball.vy * dt;
                ball.rotation += ball.vx * 0.015;

                if (ball.x - ball.radius <= 35) {
                    ball.x = 35 + ball.radius;
                    ball.vx = Math.abs(ball.vx) * 0.75;
                    playSound('bounce');
                } else if (ball.x + ball.radius >= 965) {
                    ball.x = 965 - ball.radius;
                    ball.vx = -Math.abs(ball.vx) * 0.75;
                    playSound('bounce');
                }

                if (ball.y >= COURT_Y - ball.radius) {
                    ball.y = COURT_Y - ball.radius;
                    ball.vy = -ball.vy * 0.65;
                    ball.vx *= 0.88;
                    ball.isFireball = false;
                    if (Math.abs(ball.vy) > 60) playSound('bounce');
                }

                hoops.forEach(h => {
                    if (!ball.isFireball) {
                        if (ball.x + ball.radius >= h.bbX - 4 && ball.x - ball.radius <= h.bbX + 12 &&
                            ball.y >= h.bbY && ball.y <= h.bbY + h.bbH) {
                            ball.vx = -ball.vx * 0.72;
                            ball.x = (ball.vx > 0) ? h.bbX + 14 : h.bbX - 8;
                            playSound('bounce');
                        }
                    }

                    if (ball.vy > 0 && ball.y >= h.rimY - 4 && ball.y <= h.rimY + 16 &&
                        ball.x > h.rimX + 4 && ball.x < h.rimX + h.rimW - 4) {

                        h.netWiggle = 1.0;
                        playSound('swish');

                        if (h.side === 'right' && ball.lastTouchedBy === p1) {
                            p1Score += ball.isFireball ? 3 : 2;
                            document.getElementById('p1-score').innerText = p1Score;
                            triggerBanner(ball.isFireball ? '🔥 3-POINT SWISH!' : 'BUCKET! +2');
                            setTimeout(() => resetRound(p2), 500);
                        } else if (h.side === 'left' && ball.lastTouchedBy === p2) {
                            p2Score += ball.isFireball ? 3 : 2;
                            document.getElementById('p2-score').innerText = p2Score;
                            triggerBanner('RIVAL SCORED!');
                            setTimeout(() => resetRound(p1), 500);
                        }
                        ball.isFireball = false;
                    }

                    if (h.netWiggle > 0) h.netWiggle -= dt * 2;
                });

                [p1, p2].forEach(p => {
                    const cx = p.x + p.width / 2;
                    const cy = p.y + p.height / 2;
                    if (Math.hypot(cx - ball.x, cy - ball.y) < 46 && ball.vy > -140) {
                        ball.holder = p;
                        ball.lastTouchedBy = p;
                        ball.isFireball = false;
                    }
                });
            }
        }

        // Render Frame
        function render() {
            ctx.save();
            if (screenShake > 0.5) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const bg = ctx.createLinearGradient(0, 0, 0, COURT_Y);
            bg.addColorStop(0, '#130628');
            bg.addColorStop(1, '#2c0d5a');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, COURT_Y);

            const wood = ctx.createLinearGradient(0, COURT_Y, 0, canvas.height);
            wood.addColorStop(0, '#d97706');
            wood.addColorStop(1, '#92400e');
            ctx.fillStyle = wood;
            ctx.fillRect(0, COURT_Y, canvas.width, canvas.height - COURT_Y);

            ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
            ctx.strokeRect(35, COURT_Y, canvas.width - 70, canvas.height - COURT_Y - 14);
            ctx.beginPath(); ctx.arc(canvas.width / 2, COURT_Y, 78, Math.PI, 0); ctx.stroke();

            hoops.forEach(h => {
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(h.side === 'left' ? h.bbX - 16 : h.bbX + 16, h.bbY, 16, COURT_Y - h.bbY);

                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 5;
                ctx.fillRect(h.bbX, h.bbY, 8, h.bbH);
                ctx.strokeRect(h.bbX, h.bbY, 8, h.bbH);

                ctx.strokeStyle = '#f97316'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.moveTo(h.rimX, h.rimY); ctx.lineTo(h.rimX + h.rimW, h.rimY); ctx.stroke();

                const swing = Math.sin(performance.now() * 0.02) * 12 * h.netWiggle;
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(h.rimX + 4, h.rimY);
                ctx.lineTo(h.rimX + 10 + swing, h.rimY + 34);
                ctx.lineTo(h.rimX + h.rimW - 10 + swing, h.rimY + 34);
                ctx.lineTo(h.rimX + h.rimW - 4, h.rimY);
                ctx.stroke();
            });

            [p1, p2].forEach((p, idx) => {
                const bounce = Math.sin(performance.now() * 0.009) * 2;

                // Defensive Clamp Aura Ring
                if (p.isClamping) {
                    ctx.save();
                    ctx.strokeStyle = (p === p1) ? 'rgba(0,243,255,0.7)' : 'rgba(244,63,94,0.7)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath();
                    ctx.ellipse(p.x + p.width/2, COURT_Y - 4, 34, 11, 0, 0, Math.PI*2);
                    ctx.stroke();
                    ctx.restore();
                } else {
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.beginPath();
                    ctx.ellipse(p.x + p.width/2, COURT_Y - 4, 25, 7, 0, 0, Math.PI*2);
                    ctx.fill();
                }

                // Shoes
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(p.x + (p.facing === 1 ? 4 : 22), p.y + p.height - 14, 18, 12);

                // Jersey / School Polo
                ctx.fillStyle = p.shirtColor;
                ctx.beginPath();
                ctx.roundRect(p.x + 8, p.y + 36 + bounce, 28, 40, 6);
                ctx.fill();

                // School Blue Polo Collar & Button Tab (from Classroom Photo)
                if (p.shirtColor === '#38bdf8') {
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(p.x + 18, p.y + 36 + bounce, 8, 14);
                    ctx.beginPath();
                    ctx.moveTo(p.x + 14, p.y + 36 + bounce);
                    ctx.lineTo(p.x + 18, p.y + 44 + bounce);
                    ctx.lineTo(p.x + 22, p.y + 36 + bounce);
                    ctx.fill();
                }

                // Head
                ctx.fillStyle = p.skin;
                ctx.beginPath();
                ctx.arc(p.x + 22, p.y + 20 + bounce, 22, 0, Math.PI*2);
                ctx.fill();

                if (p.beard) {
                    ctx.fillStyle = '#171717';
                    ctx.beginPath();
                    ctx.arc(p.x + 22, p.y + 25 + bounce, 15, 0, Math.PI);
                    ctx.fill();
                }

                // Accurate Hair Matching Classroom Photo
                ctx.fillStyle = '#171717';
                if (p.hair === 'parted') {
                    // Kai Jie: Sleek curtain bangs / center-parted fringe
                    ctx.beginPath();
                    ctx.arc(p.x + 22, p.y + 14 + bounce, 23, Math.PI * 0.9, 0.1);
                    ctx.fill();
                    ctx.fillRect(p.x + 3, p.y + 10 + bounce, 10, 16);
                    ctx.fillRect(p.x + 31, p.y + 10 + bounce, 10, 16);
                    ctx.clearRect(p.x + 20, p.y + 12 + bounce, 4, 8);
                } else if (p.hair === 'wavy') {
                    // John: Fluffy textured bangs from photo
                    ctx.beginPath();
                    ctx.arc(p.x + 22, p.y + 12 + bounce, 24, Math.PI, 0);
                    ctx.arc(p.x + 9, p.y + 15 + bounce, 9, 0, Math.PI*2);
                    ctx.arc(p.x + 22, p.y + 14 + bounce, 9, 0, Math.PI*2);
                    ctx.arc(p.x + 35, p.y + 15 + bounce, 9, 0, Math.PI*2);
                    ctx.fill();
                } else if (p.hair === 'athletic') {
                    // Shivnand: Sharp athletic fade
                    ctx.beginPath();
                    ctx.arc(p.x + 22, p.y + 13 + bounce, 22, Math.PI, 0);
                    ctx.fill();
                    ctx.fillRect(p.x + 5, p.y + 5 + bounce, 34, 7);
                } else {
                    ctx.fillRect(p.x + 2, p.y - 2 + bounce, 40, 10);
                }

                // John's Glasses (Dark rimmed circular frames from photo)
                if (p.glasses) {
                    ctx.strokeStyle = '#000000'; ctx.lineWidth = 2.4;
                    ctx.strokeRect(p.x + 10, p.y + 12 + bounce, 10, 8);
                    ctx.strokeRect(p.x + 24, p.y + 12 + bounce, 10, 8);
                    ctx.beginPath(); ctx.moveTo(p.x + 20, p.y + 16 + bounce); ctx.lineTo(p.x + 24, p.y + 16 + bounce); ctx.stroke();
                }

                // Kai Jie's White Earpiece (AirPod in left ear from photo)
                if (p.earpiece) {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(p.x + (p.facing === 1 ? 38 : 6), p.y + 19 + bounce, 4.5, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillRect(p.x + (p.facing === 1 ? 37 : 5), p.y + 22 + bounce, 2.5, 7);
                }

                const eyeX = p.facing === 1 ? 26 : 14;
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(p.x + eyeX, p.y + 18 + bounce, 2.5, 0, Math.PI*2);
                ctx.fill();

                // John's Tongue-Out Expression from Photo
                if (p.tongueOut) {
                    ctx.fillStyle = '#000';
                    ctx.beginPath(); ctx.arc(p.x + eyeX, p.y + 26 + bounce, 5, 0, Math.PI); ctx.fill();
                    ctx.fillStyle = '#fb7185';
                    ctx.beginPath(); ctx.arc(p.x + eyeX, p.y + 29 + bounce, 4, 0, Math.PI); ctx.fill();
                }

                // Visual Hand Swipe / Steal Reach
                if (p.swipeVisualTimer > 0) {
                    ctx.save();
                    ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3;
                    const armStartX = p.x + (p.facing === 1 ? 28 : 16);
                    const armEndX = armStartX + (p.facing * 34);
                    ctx.beginPath();
                    ctx.moveTo(armStartX, p.y + 44 + bounce);
                    ctx.lineTo(armEndX, p.y + 36 + bounce);
                    ctx.stroke();

                    // Hand slash arc
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.beginPath();
                    ctx.arc(armEndX, p.y + 36 + bounce, 12, -0.6, 0.6);
                    ctx.stroke();
                    ctx.restore();
                }

                // Shot Gauge Meter with Green Sweet Spot
                if (p.isCharging && ball.holder === p) {
                    const meterW = 54;
                    const meterH = 9;
                    const meterX = p.x - 5;
                    const meterY = p.y - 22;

                    ctx.fillStyle = 'rgba(0,0,0,0.85)';
                    ctx.fillRect(meterX, meterY, meterW, meterH);

                    ctx.fillStyle = '#22c55e';
                    const greenStart = meterW * (0.45 - 0.10);
                    ctx.fillRect(meterX + greenStart, meterY, meterW * 0.20, meterH);

                    const fillRatio = Math.min(1.0, p.chargeTimer / 0.85);
                    const isCurrentlyGreen = Math.abs(p.chargeTimer - 0.45) <= 0.10;
                    ctx.fillStyle = isCurrentlyGreen ? '#22c55e' : (fillRatio > 0.8 ? '#ef4444' : '#facc15');
                    ctx.fillRect(meterX + 1, meterY + 1, (meterW - 2) * fillRatio, meterH - 2);

                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
                    ctx.strokeRect(meterX, meterY, meterW, meterH);
                }
            });

            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rotation);

            const bGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, ball.radius);
            bGrad.addColorStop(0, ball.isFireball ? '#fef08a' : '#fb923c');
            bGrad.addColorStop(1, ball.isFireball ? '#dc2626' : '#c2410c');
            ctx.fillStyle = bGrad;
            ctx.beginPath(); ctx.arc(0, 0, ball.radius, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(0, 0, ball.radius, -0.6, 0.6); ctx.stroke();
            ctx.restore();

            ctx.restore();
        }

        let lastTime = performance.now();
        function loop(time) {
            requestAnimationFrame(loop);
            const dt = Math.min((time - lastTime) / 1000, 0.02);
            lastTime = time;

            updateAI(dt);
            updatePhysics(dt);
            render();
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
