<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Snake 2099 - Neon Arcade Edition</title>
    <script src="arcade.js"></script>
    <style>
        :root {
            --primary: #00f3ff;
            --primary-glow: rgba(0, 243, 255, 0.4);
            --accent: #ff007f;
            --accent-glow: rgba(255, 0, 127, 0.4);
            --gold: #facc15;
            --emerald: #10b981;
            --bg: #030712;
            --card: #0b1329;
            --panel-bg: rgba(11, 19, 41, 0.92);
        }
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        header {
            width: 100%;
            max-width: 820px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 8px 20px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            margin-bottom: 6px;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .stats { font-size: 1.05rem; font-weight: bold; color: var(--gold); }
        a.nav { color: var(--primary); text-decoration: none; font-weight: bold; }
        a.nav:hover { text-shadow: 0 0 8px var(--primary); }

        #game-wrapper {
            width: 100%;
            max-width: 820px;
            height: calc(100vh - 90px);
            max-height: 680px;
            background: var(--card);
            border: 3px solid var(--primary);
            border-radius: 14px;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.25);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 8px;
            overflow: hidden;
        }

        /* Top HUD */
        .hud-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1.5px solid rgba(0, 243, 255, 0.35);
            border-radius: 10px;
            padding: 6px 14px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            z-index: 10;
        }
        .hud-val { font-weight: bold; color: var(--gold); font-family: monospace; font-size: 1.1rem; }
        .combo-badge { color: var(--accent); font-weight: bold; }

        /* Canvas Arena */
        #canvas-container {
            position: relative;
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background: #050b18;
            border: 2px solid #1e293b;
            border-radius: 10px;
            box-shadow: inset 0 0 25px rgba(0, 243, 255, 0.1);
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        /* Onscreen Touch D-Pad for iPad / Mobile */
        .touch-dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            width: 180px;
            height: 90px;
            margin-top: 4px;
            z-index: 15;
        }
        .dpad-btn {
            background: var(--panel-bg);
            border: 2px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
        }
        .dpad-btn:active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            transform: scale(0.92);
        }

        /* Modals & Overlays */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 18, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 20px;
        }
        .modal-card {
            background: var(--card);
            border: 2px solid var(--primary);
            border-radius: 14px;
            padding: 24px;
            max-width: 520px;
            width: 95%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.25);
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 16px;
        }
        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--primary); }
        .btn.chaos { background: var(--accent); color: #fff; }
        .btn.chaos:hover { box-shadow: 0 0 15px var(--accent); }

        .active-buff {
            color: var(--emerald);
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav">← Hub</a>
        <div>🐍 <strong>CYBER SNAKE 2099</strong></div>
        <div class="stats">🪙 Gold: <span id="coin-count">0</span></div>
    </header>

    <div id="game-wrapper">
        <!-- Start / Mode Select Modal -->
        <div id="mode-modal" class="modal">
            <div class="modal-card">
                <h2 style="color:var(--primary); margin:0 0 8px 0;">SELECT GAME MODE</h2>
                <p style="color:#94a3b8; font-size:0.85rem; margin-top:0;">Choose your cyberspace arena rules:</p>
                <div class="btn-grid">
                    <button class="btn" onclick="startGame('CLASSIC')">🕹️ Classic<br><small>Deadly Walls</small></button>
                    <button class="btn" onclick="startGame('PORTAL')">🌀 Portal<br><small>Wrap Screen</small></button>
                    <button class="btn chaos" onclick="startGame('CHAOS')">⚡ Chaos Rush<br><small>Power-ups & Bombs</small></button>
                </div>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="over-modal" class="modal" style="display: none;">
            <div class="modal-card">
                <h2 style="color:var(--accent); margin:0 0 6px 0;">SYSTEM CRASH!</h2>
                <p style="color:#94a3b8; font-size:0.9rem;">Final Score: <span id="final-score" style="color:var(--gold); font-weight:bold; font-size:1.2rem;">0</span></p>
                <p style="color:#38bdf8; font-size:0.85rem;">Earned Bounty: +<span id="earned-gold">0</span> Gold Coins 🪙</p>
                <div class="btn-grid">
                    <button class="btn" onclick="restartCurrentMode()">🔄 Play Again</button>
                    <button class="btn" style="background:#334155; color:#fff;" onclick="openModeSelect()">📋 Mode Select</button>
                </div>
            </div>
        </div>

        <!-- Top HUD -->
        <div class="hud-bar">
            <div>Score: <span class="hud-val" id="score-text">0</span></div>
            <div>High: <span class="hud-val" id="high-text" style="color:var(--primary);">0</span></div>
            <div>Combo: <span class="combo-badge" id="combo-text">1.0x</span></div>
            <div id="buff-indicator" class="active-buff">NORMAL</div>
        </div>

        <!-- Canvas -->
        <div id="canvas-container">
            <canvas id="game-canvas" width="600" height="420"></canvas>
        </div>

        <!-- Virtual Touch D-Pad -->
        <div class="touch-dpad">
            <div></div>
            <div class="dpad-btn" onclick="handleInputDirection(0, -1)">▲</div>
            <div></div>
            <div class="dpad-btn" onclick="handleInputDirection(-1, 0)">◀</div>
            <div class="dpad-btn" onclick="handleInputDirection(0, 1)">▼</div>
            <div class="dpad-btn" onclick="handleInputDirection(1, 0)">▶</div>
        </div>
    </div>

    <script>
        // Web Audio Synthesizer Engine
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                if (type === 'eat') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'powerup') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        setTimeout(() => {
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.type = 'sine';
                            osc.frequency.value = freq;
                            gain.gain.setValueAtTime(0.2, ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                            osc.connect(gain); gain.connect(ctx.destination);
                            osc.start(); osc.stop(ctx.currentTime + 0.15);
                        }, idx * 60);
                    });
                } else if (type === 'crash') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(260, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.4, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                }
            } catch(e){}
        }

        // Game Configuration & Grid Constants
        const canvas = document.getElementById("game-canvas");
        const ctx = canvas.getContext("2d");

        const GRID_SIZE = 20;
        const COLS = canvas.width / GRID_SIZE;
        const ROWS = canvas.height / GRID_SIZE;

        let gameMode = 'CLASSIC'; // 'CLASSIC', 'PORTAL', 'CHAOS'
        let snake = [];
        let dir = { x: 1, y: 0 };
        let nextDir = { x: 1, y: 0 };

        let foods = [];
        let particles = [];
        let score = 0;
        let highScore = 0;
        let combo = 1.0;
        let lastEatTime = 0;
        let gameInterval = null;
        let isRunning = false;

        // Buffs
        let activeBuff = null;
        let buffTimer = 0;
        let goldEarnedThisRun = 0;

        function updateWallet() {
            const coins = parseInt(localStorage.getItem('arcade_coins')) || 0;
            document.getElementById('coin-count').innerText = coins.toLocaleString();
        }

        function addCoins(amt) {
            let coins = parseInt(localStorage.getItem('arcade_coins')) || 0;
            coins += amt;
            localStorage.setItem('arcade_coins', coins);
            updateWallet();
        }

        function openModeSelect() {
            document.getElementById("over-modal").style.display = "none";
            document.getElementById("mode-modal").style.display = "flex";
            isRunning = false;
            clearInterval(gameInterval);
        }

        function restartCurrentMode() {
            startGame(gameMode);
        }

        function startGame(mode) {
            getAudioContext();
            gameMode = mode;
            document.getElementById("mode-modal").style.display = "none";
            document.getElementById("over-modal").style.display = "none";

            highScore = parseInt(localStorage.getItem(`snake_high_${mode}`)) || 0;
            document.getElementById("high-text").innerText = highScore;

            score = 0;
            combo = 1.0;
            goldEarnedThisRun = 0;
            activeBuff = null;
            buffTimer = 0;
            document.getElementById("score-text").innerText = score;
            document.getElementById("combo-text").innerText = "1.0x";
            document.getElementById("buff-indicator").innerText = "NORMAL";
            document.getElementById("buff-indicator").style.color = "var(--emerald)";

            // Initialize Snake in Center
            const startX = Math.floor(COLS / 2);
            const startY = Math.floor(ROWS / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];

            dir = { x: 1, y: 0 };
            nextDir = { x: 1, y: 0 };
            foods = [];
            particles = [];

            spawnFood();
            if (mode === 'CHAOS') {
                spawnFood('GOLDEN');
                spawnFood('POWERUP');
            }

            isRunning = true;
            clearInterval(gameInterval);
            gameInterval = setInterval(gameStep, 80);
        }

        function spawnFood(forceType = null) {
            let type = forceType || 'NORMAL';
            if (!forceType && gameMode === 'CHAOS') {
                const r = Math.random();
                if (r < 0.15) type = 'GOLDEN';
                else if (r < 0.3) type = 'POWERUP';
                else if (r < 0.42) type = 'BOMB';
            }

            let valid = false;
            let fx = 0, fy = 0;

            while (!valid) {
                fx = Math.floor(Math.random() * COLS);
                fy = Math.floor(Math.random() * ROWS);
                valid = !snake.some(seg => seg.x === fx && seg.y === fy) &&
                        !foods.some(f => f.x === fx && f.y === fy);
            }

            foods.push({
                x: fx,
                y: fy,
                type,
                pulse: 0
            });
        }

        function handleInputDirection(nx, ny) {
            getAudioContext();
            if (!isRunning) return;
            // Prevent immediate 180° self-reversal
            if (nx !== -dir.x || ny !== -dir.y) {
                nextDir = { x: nx, y: ny };
            }
        }

        window.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d", " "].includes(k) || e.code === "Space") {
                e.preventDefault();
            }
            if (k === 'arrowup' || k === 'w') handleInputDirection(0, -1);
            if (k === 'arrowdown' || k === 's') handleInputDirection(0, 1);
            if (k === 'arrowleft' || k === 'a') handleInputDirection(-1, 0);
            if (k === 'arrowright' || k === 'd') handleInputDirection(1, 0);
        });

        // Touch Swipe Gesture Handling on Canvas
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener("touchstart", e => {
            const t = e.touches[0];
            touchStartX = t.clientX;
            touchStartY = t.clientY;
        }, { passive: false });

        canvas.addEventListener("touchend", e => {
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStartX;
            const dy = t.clientY - touchStartY;
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);

            if (Math.max(absX, absY) > 24) {
                if (absX > absY) handleInputDirection(dx > 0 ? 1 : -1, 0);
                else handleInputDirection(0, dy > 0 ? 1 : -1);
            }
        }, { passive: false });

        // Particle System
        function createExplosion(x, y, color) {
            for (let i = 0; i < 14; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x * GRID_SIZE + GRID_SIZE / 2,
                    y: y * GRID_SIZE + GRID_SIZE / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color,
                    life: 1.0
                });
            }
        }

        // Main Game Step Logic
        function gameStep() {
            if (!isRunning) return;

            dir = { ...nextDir };
            const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

            // Wall Collision Logic
            if (gameMode === 'PORTAL' || activeBuff === 'GHOST') {
                if (head.x < 0) head.x = COLS - 1;
                if (head.x >= COLS) head.x = 0;
                if (head.y < 0) head.y = ROWS - 1;
                if (head.y >= ROWS) head.y = 0;
            } else {
                if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                    gameOver();
                    return;
                }
            }

            // Self Collision Check
            if (activeBuff !== 'GHOST' && snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                if (activeBuff === 'SHIELD') {
                    activeBuff = null;
                    document.getElementById("buff-indicator").innerText = "NORMAL";
                    document.getElementById("buff-indicator").style.color = "var(--emerald)";
                    playSound('eat');
                } else {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Food & Item Interaction Check
            let ateFood = false;
            for (let i = foods.length - 1; i >= 0; i--) {
                const f = foods[i];
                if (f.x === head.x && f.y === head.y) {
                    ateFood = true;

                    // Combo Multiplier Logic
                    const now = Date.now();
                    if (now - lastEatTime < 2400) {
                        combo = Math.min(4.0, +(combo + 0.2).toFixed(1));
                    } else {
                        combo = 1.0;
                    }
                    lastEatTime = now;
                    document.getElementById("combo-text").innerText = `${combo}x`;

                    if (f.type === 'NORMAL') {
                        score += Math.round(10 * combo);
                        goldEarnedThisRun += 1;
                        createExplosion(f.x, f.y, '#00f3ff');
                        playSound('eat');
                    } else if (f.type === 'GOLDEN') {
                        score += Math.round(50 * combo);
                        goldEarnedThisRun += 10;
                        createExplosion(f.x, f.y, '#facc15');
                        playSound('powerup');
                    } else if (f.type === 'POWERUP') {
                        const buffs = ['SHIELD', '2X', 'GHOST'];
                        activeBuff = buffs[Math.floor(Math.random() * buffs.length)];
                        buffTimer = 60; // ~5 seconds
                        document.getElementById("buff-indicator").innerText = `${activeBuff} ACTIVE`;
                        document.getElementById("buff-indicator").style.color = "var(--gold)";
                        createExplosion(f.x, f.y, '#ff007f');
                        playSound('powerup');
                    } else if (f.type === 'BOMB') {
                        if (activeBuff === 'SHIELD') {
                            activeBuff = null;
                            document.getElementById("buff-indicator").innerText = "NORMAL";
                        } else {
                            gameOver();
                            return;
                        }
                    }

                    foods.splice(i, 1);
                    spawnFood();
                    break;
                }
            }

            if (!ateFood) {
                snake.pop();
            }

            // Buff Decay
            if (activeBuff) {
                buffTimer--;
                if (buffTimer <= 0) {
                    activeBuff = null;
                    document.getElementById("buff-indicator").innerText = "NORMAL";
                    document.getElementById("buff-indicator").style.color = "var(--emerald)";
                }
            }

            document.getElementById("score-text").innerText = score;
            if (score > highScore) {
                highScore = score;
                document.getElementById("high-text").innerText = highScore;
                localStorage.setItem(`snake_high_${gameMode}`, highScore);
            }
        }

        function gameOver() {
            isRunning = false;
            clearInterval(gameInterval);
            playSound('crash');

            createExplosion(snake[0].x, snake[0].y, '#ff007f');
            addCoins(goldEarnedThisRun);

            document.getElementById("final-score").innerText = score;
            document.getElementById("earned-gold").innerText = goldEarnedThisRun;
            document.getElementById("over-modal").style.display = "flex";
        }

        // Cyber Rendering Engine
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Cyber Grid Lines
            ctx.strokeStyle = "rgba(30, 41, 59, 0.45)";
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Draw Foods
            foods.forEach(f => {
                f.pulse = (f.pulse + 0.1) % (Math.PI * 2);
                const pScale = 1 + Math.sin(f.pulse) * 0.15;
                const radius = (GRID_SIZE / 2 - 2) * pScale;
                const cx = f.x * GRID_SIZE + GRID_SIZE / 2;
                const cy = f.y * GRID_SIZE + GRID_SIZE / 2;

                ctx.save();
                if (f.type === 'NORMAL') {
                    ctx.fillStyle = "#00f3ff";
                    ctx.shadowColor = "#00f3ff";
                    ctx.shadowBlur = 12;
                    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
                } else if (f.type === 'GOLDEN') {
                    ctx.fillStyle = "#facc15";
                    ctx.shadowColor = "#facc15";
                    ctx.shadowBlur = 16;
                    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
                } else if (f.type === 'POWERUP') {
                    ctx.fillStyle = "#ff007f";
                    ctx.shadowColor = "#ff007f";
                    ctx.shadowBlur = 16;
                    ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
                } else if (f.type === 'BOMB') {
                    ctx.fillStyle = "#ef4444";
                    ctx.shadowColor = "#ef4444";
                    ctx.shadowBlur = 14;
                    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            });

            // Draw Snake
            snake.forEach((seg, idx) => {
                const cx = seg.x * GRID_SIZE;
                const cy = seg.y * GRID_SIZE;

                ctx.save();
                if (idx === 0) {
                    // Head
                    ctx.fillStyle = activeBuff === 'GHOST' ? "rgba(0, 243, 255, 0.5)" : "#00f3ff";
                    ctx.shadowColor = "#00f3ff";
                    ctx.shadowBlur = 14;
                    ctx.fillRect(cx + 1, cy + 1, GRID_SIZE - 2, GRID_SIZE - 2);

                    // Eyes
                    ctx.fillStyle = "#000";
                    if (dir.x === 1) {
                        ctx.fillRect(cx + 13, cy + 4, 3, 3);
                        ctx.fillRect(cx + 13, cy + 13, 3, 3);
                    } else if (dir.x === -1) {
                        ctx.fillRect(cx + 4, cy + 4, 3, 3);
                        ctx.fillRect(cx + 4, cy + 13, 3, 3);
                    } else if (dir.y === 1) {
                        ctx.fillRect(cx + 4, cy + 13, 3, 3);
                        ctx.fillRect(cx + 13, cy + 13, 3, 3);
                    } else {
                        ctx.fillRect(cx + 4, cy + 4, 3, 3);
                        ctx.fillRect(cx + 13, cy + 4, 3, 3);
                    }
                } else {
                    // Body Segments with Gradient Trail
                    const alpha = Math.max(0.35, 1 - idx / (snake.length + 5));
                    ctx.fillStyle = activeBuff === 'GHOST' ? `rgba(2, 132, 199, 0.4)` : `rgba(2, 132, 199, ${alpha})`;
                    ctx.shadowColor = "rgba(0, 243, 255, 0.2)";
                    ctx.shadowBlur = 6;
                    ctx.fillRect(cx + 2, cy + 2, GRID_SIZE - 4, GRID_SIZE - 4);
                }
                ctx.restore();
            });

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.04;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.5 * p.life, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateWallet();
            requestAnimationFrame(render);
        });
    </script>
</body>
</html>
